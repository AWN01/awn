<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06141b">
<meta name="description" content="عون | منصة ذكية لخدمة المجتمع">
<title>عون | AWN</title>

<link rel="manifest" href="./manifest.json">

<style>
:root{
 --bg:#06141b;
 --panel:#101513;
 --panel2:#151b18;
 --border:rgba(255,255,255,.09);

 --gold:#2f80ed;
 --gold2:#6db6ff;
 --green:#4fa8ff;

 --red:#ff5f61;
 --orange:#ff9f43;
 --blue:#4fa8ff;

 --text:#f5f7f8;
 --muted:#9ba8a4;
 --white:#fff;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

html,body{
 min-height:100%;
 background:
 radial-gradient(circle at 20% 0%,rgba(79,168,255,.08),transparent 28%),
 radial-gradient(circle at 100% 20%,rgba(79,168,255,.07),transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
}

body{
 overflow-x:hidden;
}

button,
input,
textarea,
select{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none !important;
}

a{
 color:inherit;
 text-decoration:none;
}

/* =====================================================
   HEADER
===================================================== */

header{
 position:sticky;
 top:0;
 z-index:1000;
 background:rgba(6,20,27,.88);
 backdrop-filter:blur(18px);
 border-bottom:1px solid var(--border);
}

.nav{
 width:min(1180px,calc(100% - 28px));
 min-height:74px;
 margin:auto;

 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.logo{
 display:flex;
 align-items:center;
 gap:10px;
 cursor:pointer;
}

.logo-mark{
 width:48px;
 height:48px;
 border-radius:13px;
 background:transparent;
 display:grid;
 place-items:center;
 overflow:hidden;
 flex-shrink:0;
}

.logo-mark img{
 width:100%;
 height:100%;
 object-fit:contain;
 display:block;
}

.logo-text{
 display:flex;
 flex-direction:column;
 line-height:1.1;
}

.logo-text strong{
 font-size:20px;
 font-weight:900;
}

.logo-text small{
 color:var(--muted);
 font-size:9px;
 margin-top:4px;
}

.nav-actions{
 display:flex;
 align-items:center;
 gap:8px;
}

.primary{
 border:0;
 color:#fff;
 background:linear-gradient(135deg,var(--gold2),var(--gold));
 padding:13px 19px;
 border-radius:13px;
 font-weight:900;
 box-shadow:0 10px 25px rgba(79,168,255,.12);
 transition:.2s;
}

.primary:hover{
 transform:translateY(-1px);
 filter:brightness(1.06);
}

.secondary{
 border:1px solid var(--border);
 background:var(--panel);
 color:var(--text);
 padding:12px 17px;
 border-radius:13px;
 font-weight:800;
}

.icon-btn{
 width:45px;
 height:45px;
 border:1px solid var(--border);
 border-radius:13px;
 background:var(--panel);
 color:#fff;
 display:grid;
 place-items:center;
 font-size:20px;
}

.desktop-login{
 display:block;
}

/* =====================================================
   MENU
===================================================== */

.menu{
 position:fixed;
 top:82px;
 left:18px;
 width:min(340px,calc(100% - 36px));
 z-index:1500;

 padding:12px;

 border:1px solid var(--border);
 border-radius:24px;

 background:rgba(11,24,30,.97);
 box-shadow:0 25px 80px rgba(0,0,0,.42);
 backdrop-filter:blur(25px);
}

.menu-item{
 width:100%;
 display:flex;
 align-items:center;
 gap:12px;

 padding:15px 14px;
 margin-bottom:5px;

 border:0;
 border-radius:13px;

 background:transparent;
 color:#fff;

 text-align:right;
 font-size:17px;
}

.menu-item:hover{
 background:rgba(79,168,255,.09);
 color:var(--gold2);
}

.menu-item span:first-child{
 width:28px;
 text-align:center;
}

/* =====================================================
   APP
===================================================== */

main{
 width:min(1180px,calc(100% - 28px));
 margin:auto;
}

.page{
 min-height:calc(100vh - 74px);
}

/* =====================================================
   HERO
===================================================== */

.hero{
 padding:38px 0 30px;
}

.hero-main{
 max-width:1100px;
 margin:auto;
 text-align:center;

 background:
 linear-gradient(135deg,rgba(79,168,255,.11),transparent 45%),
 linear-gradient(160deg,#121815,#0d1110);

 border:1px solid var(--border);
 border-radius:30px;

 padding:48px 24px 50px;

 position:relative;
 overflow:hidden;
}

.hero-logo{
 display:flex;
 justify-content:center;
 align-items:center;
 margin:0 auto 18px;
 position:relative;
 z-index:2;
}

.hero-logo img{
 width:118px;
 height:118px;
 object-fit:contain;
 display:block;
}

.hero-main:after{
 content:"";
 position:absolute;
 width:300px;
 height:300px;
 border-radius:50%;
 border:1px solid rgba(79,168,255,.12);
 left:-120px;
 bottom:-150px;
 box-shadow:
 0 0 0 50px rgba(79,168,255,.025),
 0 0 0 100px rgba(79,168,255,.018);
}

.badge{
 display:inline-flex;
 align-items:center;
 gap:7px;

 border:1px solid rgba(79,168,255,.25);
 color:var(--gold2);
 background:rgba(79,168,255,.07);

 border-radius:100px;
 padding:8px 13px;

 font-size:12px;
 font-weight:800;

 position:relative;
 z-index:2;
}

.hero h1{
 position:relative;
 z-index:2;

 margin-top:20px;

 font-size:clamp(40px,7vw,76px);
 line-height:1.05;

 font-weight:950;
 letter-spacing:-2px;
}

.hero h1 em{
 color:var(--green);
 font-style:normal;
}

.hero p{
 position:relative;
 z-index:2;

 max-width:700px;
 margin:20px auto 0;

 color:var(--muted);
 font-size:16px;
 line-height:1.9;
}

.hero-actions{
 position:relative;
 z-index:2;

 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:10px;

 margin-top:28px;
}

/* =====================================================
   FEATURE CARDS
===================================================== */

.section{
 padding:30px 0;
}

.section-head{
 display:flex;
 align-items:flex-end;
 justify-content:space-between;
 gap:15px;
 margin-bottom:18px;
}

.section-head h2{
 font-size:28px;
 font-weight:950;
}

.section-head p{
 color:var(--muted);
 font-size:13px;
 margin-top:5px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:14px;
}

.feature{
 padding:22px;

 border:1px solid var(--border);
 border-radius:20px;

 background:
 linear-gradient(
 145deg,
 rgba(255,255,255,.035),
 rgba(255,255,255,.012)
 ),
 var(--panel);

 transition:.2s;
}

.feature:hover{
 transform:translateY(-3px);
 border-color:rgba(79,168,255,.22);
}

.feature-icon{
 width:52px;
 height:52px;

 display:grid;
 place-items:center;

 border-radius:15px;
 background:rgba(79,168,255,.09);

 font-size:25px;
 margin-bottom:17px;
}

.feature h3{
 font-size:17px;
 margin-bottom:8px;
}

.feature p{
 color:var(--muted);
 line-height:1.8;
 font-size:13px;
}

/* =====================================================
   GENERAL CARDS
===================================================== */

.card{
 background:
 linear-gradient(
 145deg,
 rgba(255,255,255,.035),
 rgba(255,255,255,.012)
 ),
 var(--panel);

 border:1px solid var(--border);
 border-radius:20px;

 padding:20px;
}

.card h3{
 font-size:18px;
 font-weight:900;
}

.card p{
 color:var(--muted);
 line-height:1.8;
 font-size:13px;
}

/* =====================================================
   STATS
===================================================== */

.stats{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:12px;
}

.stat{
 padding:20px;

 background:var(--panel);
 border:1px solid var(--border);
 border-radius:18px;
}

.stat strong{
 display:block;
 font-size:29px;
 color:var(--gold2);
}

.stat span{
 display:block;
 margin-top:6px;
 color:var(--muted);
 font-size:12px;
}

/* =====================================================
   FORMS
===================================================== */

.form-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px;
}

.field{
 margin-bottom:15px;
}

.field label{
 display:block;
 margin-bottom:7px;

 font-size:12px;
 font-weight:900;
}

.field input,
.field textarea,
.field select{
 width:100%;

 border:1px solid var(--border);
 border-radius:12px;

 background:#08161d;
 color:var(--text);

 padding:12px 13px;

 outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
 border-color:rgba(79,168,255,.5);
 box-shadow:0 0 0 3px rgba(79,168,255,.08);
}

.field textarea{
 min-height:120px;
 resize:vertical;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:9px;
 margin-top:18px;
}

/* =====================================================
   REPORT
===================================================== */

.report-box{
 max-width:900px;
 margin:30px auto;
}

.upload-box{
 border:1px dashed rgba(79,168,255,.35);
 border-radius:16px;
 padding:22px;
 text-align:center;
 background:rgba(79,168,255,.04);
 color:var(--muted);
}

.upload-box input{
 margin-top:12px;
}

/* =====================================================
   STATUS
===================================================== */

.status{
 display:inline-flex;
 align-items:center;
 gap:6px;

 padding:6px 10px;

 border-radius:100px;

 font-size:11px;
 font-weight:800;
}

.status.new{
 background:rgba(79,168,255,.1);
 color:#6db6ff;
}

.status.done{
 background:rgba(79,168,255,.1);
 color:#68dda8;
}

.status.pending{
 background:rgba(255,159,67,.1);
 color:#ffb46a;
}

/* =====================================================
   SCORE
===================================================== */

.score{
 display:inline-flex;
 align-items:center;
 justify-content:center;

 min-width:50px;
 padding:6px 10px;

 border-radius:100px;

 font-weight:950;
}

.score-high{
 color:#ff6d72;
 background:rgba(255,95,97,.09);
}

.score-mid{
 color:#ffb25e;
 background:rgba(255,159,67,.09);
}

.score-low{
 color:#68dda8;
 background:rgba(79,168,255,.09);
}

/* =====================================================
   MAP
===================================================== */

.map-box{
 min-height:420px;

 border:1px solid var(--border);
 border-radius:22px;

 background:
 radial-gradient(
  circle at 30% 40%,
  rgba(79,168,255,.13),
  transparent 22%
 ),
 radial-gradient(
  circle at 70% 65%,
  rgba(79,168,255,.08),
  transparent 20%
 ),
 #091820;

 position:relative;
 overflow:hidden;
}

.map-grid{
 position:absolute;
 inset:0;

 opacity:.22;

 background-image:
 linear-gradient(
  rgba(255,255,255,.07) 1px,
  transparent 1px
 ),
 linear-gradient(
  90deg,
  rgba(255,255,255,.07) 1px,
  transparent 1px
 );

 background-size:40px 40px;
}

.map-point{
 position:absolute;

 width:17px;
 height:17px;

 border-radius:50%;

 background:var(--gold2);

 box-shadow:
 0 0 0 7px rgba(79,168,255,.12),
 0 0 30px rgba(79,168,255,.45);
}

.map-point.p1{
 left:28%;
 top:35%;
}

.map-point.p2{
 left:55%;
 top:55%;
}

.map-point.p3{
 left:72%;
 top:30%;
}

.map-point.p4{
 left:43%;
 top:73%;
}

.map-label{
 position:absolute;
 bottom:18px;
 right:18px;

 padding:9px 12px;

 border-radius:11px;

 background:rgba(0,0,0,.38);
 border:1px solid var(--border);

 font-size:12px;
 color:var(--muted);
}

/* =====================================================
   FILTERS
===================================================== */

.filters{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-bottom:15px;
}

.filter{
 border:1px solid var(--border);
 background:var(--panel);
 color:var(--muted);

 border-radius:100px;
 padding:8px 12px;

 font-size:12px;
}

.filter.active{
 background:rgba(79,168,255,.13);
 color:var(--gold2);
 border-color:rgba(79,168,255,.3);
}

/* =====================================================
   TIMELINE
===================================================== */

.timeline{
 position:relative;
 padding-right:28px;
}

.timeline:before{
 content:"";
 position:absolute;

 right:8px;
 top:5px;
 bottom:5px;

 width:2px;

 background:rgba(79,168,255,.15);
}

.timeline-item{
 position:relative;
 margin-bottom:25px;
}

.timeline-item:before{
 content:"";

 position:absolute;
 right:-26px;
 top:3px;

 width:14px;
 height:14px;

 border-radius:50%;

 background:var(--gold2);
 box-shadow:0 0 0 5px rgba(79,168,255,.08);
}

.timeline-item h4{
 font-size:14px;
}

.timeline-item p{
 margin-top:4px;
 color:var(--muted);
 font-size:12px;
 line-height:1.7;
}

/* =====================================================
   SIDEBAR
===================================================== */

.side-list{
 display:flex;
 flex-direction:column;
 gap:7px;
}

.side-item{
 border:0;
 background:transparent;
 color:var(--muted);

 padding:11px 12px;

 border-radius:12px;

 text-align:right;
}

.side-item.active,
.side-item:hover{
 background:rgba(79,168,255,.09);
 color:var(--gold2);
}

/* =====================================================
   TOAST
===================================================== */

#toastRoot{
 position:fixed;
 left:18px;
 bottom:18px;
 z-index:3000;

 display:flex;
 flex-direction:column;
 gap:8px;
}

.toast{
 max-width:350px;

 padding:13px 15px;

 border-radius:14px;

 background:#101b20;
 border:1px solid var(--border);

 box-shadow:0 15px 50px rgba(0,0,0,.35);

 font-size:13px;
}

.toast.success{
 border-color:rgba(79,168,255,.3);
}

.toast.error{
 border-color:rgba(255,95,97,.3);
}

/* =====================================================
   MODAL
===================================================== */

#modalRoot{
 position:fixed;
 inset:0;
 z-index:2500;
}

.modal-backdrop{
 position:absolute;
 inset:0;

 display:flex;
 align-items:center;
 justify-content:center;

 padding:18px;

 background:rgba(0,0,0,.7);
 backdrop-filter:blur(8px);
}

.modal{
 width:min(560px,100%);
 max-height:calc(100vh - 36px);

 overflow:auto;

 background:
 linear-gradient(
 145deg,
 #12232c,
 #0c171d
 );

 border:1px solid var(--border);
 border-radius:22px;

 padding:22px;

 box-shadow:0 30px 90px rgba(0,0,0,.5);
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:15px;

 margin-bottom:22px;
}

.modal-head h2{
 font-size:23px;
 font-weight:950;
}

.close{
 width:38px;
 height:38px;

 border:1px solid var(--border);
 border-radius:10px;

 background:var(--panel);
 color:#fff;

 font-size:23px;
}

/* =====================================================
   HOME LIGHT
===================================================== */

body.home-light{
 background:
 radial-gradient(
  circle at 15% 0%,
  rgba(47,128,237,.10),
  transparent 30%
 ),
 #f4f9ff;

 color:#12304d;
}

body.home-light header{
 background:rgba(244,249,255,.88);
}

body.home-light .hero-main{
 background:
 linear-gradient(
 135deg,
 rgba(47,128,237,.12),
 transparent 45%
 ),
 #ffffff;
}

body.home-light .card,
body.home-light .feature,
body.home-light .stat{
 background:#fff;
 border-color:rgba(18,48,77,.10);
}

body.home-light .hero p,
body.home-light .feature p,
body.home-light .card p,
body.home-light .stat span{
 color:#60758a;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

 .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
 }

 .stats{
  grid-template-columns:repeat(2,minmax(0,1fr));
 }

 .form-grid{
  grid-template-columns:1fr;
 }

}

@media(max-width:800px){

 .logo-text{
  display:none;
 }

 .nav{
  min-height:68px;
 }

 .desktop-login{
  display:block;
  padding:10px 12px;
  font-size:12px;
 }

 .hero{
  min-height:auto;
  padding:48px 0 42px;
 }

 .hero-logo img{
  width:100px;
  height:100px;
 }

 .hero-main{
  padding:38px 17px 42px;
 }

 .hero h1{
  font-size:44px;
 }

 .hero p{
  font-size:14px;
 }

}

@media(max-width:560px){

 .grid{
  grid-template-columns:1fr;
 }

 .stats{
  grid-template-columns:1fr 1fr;
 }

 .menu{
  top:76px;
  left:10px;
  width:calc(100% - 20px);
 }

 .hero h1{
  font-size:38px;
 }

 .desktop-login{
  font-size:11px;
  padding:9px 10px;
 }

}
</style>
</head>

<body>

<header>

 </div>
</header>

 <button

 >

 </button>

 <button
  class="menu-item"
  onclick="openMap();toggleMenu()"
 >
  <span>🗺️</span>

 </button>

 <button

 >

 <button

 >

 <button

 >

 <button

 >

 <button

  onclick="openAssistant();toggleMenu()"
 >

 <button
  class="menu-item"
  onclick="openSupport();toggleMenu()"
 >
  <span>💬</span>

 </button>

 <button
  class="menu-item"
  onclick="openSuggestion();toggleMenu()"
 >
  <span>💡</span>

 </button>

 <button

 >
  <span>👑</span>

 </button>

 <button

  onclick="logout();toggleMenu()"
 >
  <span>↪️</span>
  <span>تسجيل الخروج</span>
 </button>

</div>

<main id="app"></main>

<footer>
 <strong>عون</strong> — منصة ذكية لخدمة المجتمع
 <br>
 <span>معاً.. لمجتمع أكثر أماناً 🇦🇪</span>
</footer>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>

const SUPABASE_URL =
"https://ftamcnweyimjefjajhcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_z7cfsDCEV7Z3gmGD09oGpw_qEdd4WQM";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let reportsCache = [];
let notificationsCache = [];

function el(id){
 return document.getElementById(id);
}

function toast(message,type="success"){

 const root = el("toastRoot");

 if(!root) return;

 const item =
 document.createElement("div");

 item.className =
 "toast " + type;

 item.textContent =
 message;

 root.appendChild(item);

 setTimeout(()=>{
  item.remove();
 },3500);

}

function showModal(content){

 const root =
 el("modalRoot");

 if(!root) return;

 root.innerHTML = `
  <div
   class="modal-backdrop"
   onclick="backdropClose(event)"
  >
   <div
    class="modal"
    onclick="event.stopPropagation()"
   >
    ${content}
   </div>
  </div>
 `;

}

function backdropClose(event){

 if(
  event.target.classList.contains(
   "modal-backdrop"
  )
 ){
  closeModal();
 }

}

function closeModal(){

 const root =
 el("modalRoot");

 if(root){

  root.innerHTML="";

 }

}

function hideAllPages(){

 document
  .querySelectorAll(".page")
  .forEach(page=>{
   page.classList.add("hidden");
  });

}

function mountPage(id){

 hideAllPages();

 const page =
 el(id);

 if(page){
  page.classList.remove("hidden");
 }

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}

async function loadHomeStats(){

 try{

  const {data,error} =
   await supabaseClient
    .from("reports")
    .select("id,status,score");

  if(error) throw error;

  const rows =
   data || [];

  const total =
   rows.length;

  const resolved =
   rows.filter(
    r=>r.status==="resolved"
   ).length;

  const scores =
   rows
    .map(r=>Number(r.score))
    .filter(
     n=>Number.isFinite(n)
    );

  const average =
   scores.length
    ? Math.round(
       scores.reduce(
        (a,b)=>a+b,
        0
       ) /
       scores.length
      )
    : 0;

  if(el("homeReports"))
   el("homeReports").textContent=total;

  if(el("homeResolved"))
   el("homeResolved").textContent=resolved;

  if(el("homeAverage"))
   el("homeAverage").textContent=average;

 }catch(error){

  console.log(error);

 }

 try{

  const {count} =
   await supabaseClient
    .from("profiles")
    .select(
     "id",
     {
      count:"exact",
      head:true
     }
    );

  if(el("homeUsers"))
   el("homeUsers").textContent =
    count || 0;

 }catch(error){

  console.log(error);

 }

}

async function login(event){

 event.preventDefault();

 const email =
  el("loginIdentifier")
   .value
   .trim();

 const password =
  el("loginPassword")
   .value;

 try{

  const {data,error} =
   await supabaseClient
    .auth
    .signInWithPassword({
     email,
     password
    });

  if(error)
   throw error;

  currentUser =
   data.user;

  await loadProfile();

  closeModal();

  updateHeader();

  toast(
   "تم تسجيل الدخول بنجاح ✅"
  );

  goHome();

 }catch(error){

  console.error(error);

  toast(
   error?.message ||
   "تعذر تسجيل الدخول",
   "error"
  );

 }

}

async function signup(event){

 event.preventDefault();

 const name =
  el("signupName")
   .value
   .trim();

 const username =
  el("signupUsername")
   .value
   .trim();

 const email =
  el("signupEmail")
   .value
   .trim();

 const phone =
  el("signupPhone")
   .value
   .trim();

 const password =
  el("signupPassword")
   .value;

 try{

  const {data,error} =
   await supabaseClient
    .auth
    .signUp({

     email,
     password,

     options:{
      data:{
       full_name:name,
       username,
       phone
      }
     }

    });

  if(error)
   throw error;

  if(data.user){

   await supabaseClient
    .from("profiles")
    .upsert({

     id:data.user.id,
     full_name:name,
     username,
     email,
     phone

    });

  }

  toast(
   "تم إنشاء الحساب بنجاح ✅"
  );

  openAuth("login");

 }catch(error){

  console.error(error);

  toast(
   error?.message ||
   "تعذر إنشاء الحساب",
   "error"
  );

 }

}

async function forgotPassword(event){

 event.preventDefault();

 const email =
  el("forgotEmail")
   .value
   .trim();

 try{

  const {error} =
   await supabaseClient
    .auth
    .resetPasswordForEmail(
     email,
     {
      redirectTo:
       window.location.origin +
       window.location.pathname
     }
    );

  if(error)
   throw error;

  toast(
   "تم إرسال رابط الاستعادة 📩"
  );

  closeModal();

 }catch(error){

  console.error(error);

  toast(
   error?.message ||
   "تعذر إرسال الرابط",
   "error"
  );

 }

}

async function loadProfile(){

 if(!currentUser)
  return null;

 try{

  const {data,error} =
   await supabaseClient
    .from("profiles")
    .select("*")
    .eq(
     "id",
     currentUser.id
    )
    .maybeSingle();

  if(error)
   throw error;

  currentProfile =
   data || null;

  return currentProfile;

 }catch(error){

  console.error(error);

  return null;

 }

}

function updateHeader(){

 const login =
  el("headerLogin");

 const user =
  el("headerUser");

 const admin =
  el("adminMenu");

 const logoutBtn =
  el("logoutMenu");

 if(currentUser){

  if(login)
   login.classList.add("hidden");

  if(user)
   user.classList.remove("hidden");

  if(logoutBtn)
   logoutBtn.classList.remove("hidden");

  if(
   admin &&
   currentProfile?.role==="admin"
  ){
   admin.classList.remove("hidden");
  }

 }else{

  if(login)
   login.classList.remove("hidden");

  if(user)
   user.classList.add("hidden");

  if(logoutBtn)
   logoutBtn.classList.add("hidden");

  if(admin)
   admin.classList.add("hidden");

 }

}

async function submitReport(){

 if(!currentUser){

  openAuth("login");

  return;

 }

 const title =
  el("reportTitle")
   .value
   .trim();

 const type =
  el("reportType")
   .value;

 const description =
  el("reportDescription")
   .value
   .trim();

 const photoInput =
  el("reportPhoto");

 if(
  !title ||
  !type ||
  !description
 ){

  toast(
   "يرجى تعبئة البيانات المطلوبة",
   "error"
  );

  return;

 }

 let latitude=null;
 let longitude=null;

 try{

  if(
   navigator.geolocation
  ){

   const position =
    await new Promise(
     (resolve,reject)=>{

      navigator
       .geolocation
       .getCurrentPosition(
        resolve,
        reject,
        {
         enableHighAccuracy:true,
         timeout:8000
        }
       );

     }
    );

   latitude =
    position.coords.latitude;

   longitude =
    position.coords.longitude;

  }

 }catch(error){

  console.log(
   "Location unavailable"
  );

 }

 let photoUrl=null;
 let hasPhoto=false;

 try{

  const file =
   photoInput?.files?.[0];

  if(file){

   const extension =
    file.name
     .split(".")
     .pop();

   const path =
    currentUser.id +
    "/" +
    Date.now() +
    "." +
    extension;

   const upload =
    await supabaseClient
     .storage
     .from("reports")
     .upload(
      path,
      file,
      {
       upsert:false
      }
     );

   if(upload.error)
    throw upload.error;

   const publicUrl =
    supabaseClient
     .storage
     .from("reports")
     .getPublicUrl(path);

   photoUrl =
    publicUrl.data.publicUrl;

   hasPhoto=true;

  }

 }catch(error){

  console.error(
   "Photo error:",
   error
  );

 }

 const score =
  calculateScore(
   type,
   description
  );

 try{

  const {error} =
   await supabaseClient
    .from("reports")
    .insert([{

     user_id:
      currentUser.id,

     title,
     type,
     description,

     latitude,
     longitude,

     score,

     matches:0,

     status:"new",

     has_photo:
      hasPhoto,

     photo_url:
      photoUrl

    }]);

  if(error)
   throw error;

  toast(
   "تم إرسال البلاغ بنجاح ✅"
  );

  goHome();

 }catch(error){

  console.error(error);

  toast(
   error?.message ||
   "تعذر إرسال البلاغ",
   "error"
  );

 }

}

function calculateScore(
 type,
 description
){

 let score=40;

 if(type==="safety")
  score+=25;

 if(type==="road")
  score+=15;

 if(type==="lighting")
  score+=10;

 if(type==="accessibility")
  score+=15;

 if(
  description.length>120
 )
  score+=10;

 return Math.min(
  100,
  Math.max(
   1,
   score
  )
 );

}

function filterMap(type,button){

 document
  .querySelectorAll(".filters .filter")
  .forEach(
   item=>item.classList.remove("active")
  );

 if(button)
  button.classList.add("active");

 document
  .querySelectorAll(".map-point")
  .forEach(point=>{

   if(type==="all"){

    point.style.display="block";
    return;

   }

   point.style.display =
    point.dataset.score===type
     ?"block"
     :"none";

  });

}

function sendAssistantMessage(){

 const input =
  el("assistantInput");

 const messages =
  el("assistantMessages");

 if(!input || !messages)
  return;

 const text =
  input.value.trim();

 if(!text)
  return;

 const userBubble =
  document.createElement("div");

 userBubble.style.cssText = `
  background:rgba(79,168,255,.12);
  border:1px solid var(--border);
  padding:13px;
  border-radius:14px;
  align-self:flex-start;
  max-width:90%;
 `;

 userBubble.textContent =
  "أنت: " + text;

 messages.appendChild(
  userBubble
 );

 input.value="";

 let answer =
  "تقدر تستخدم عون لرفع البلاغات ومتابعتها ومعرفة الأولويات.";

 const lower =
  text.toLowerCase();

 if(
  lower.includes("بلاغ") ||
  text.includes("بلاغ")
 ){

  answer =
   "لرفع بلاغ، اضغط «رفع بلاغ» وأدخل العنوان والنوع والوصف والصورة إذا كانت متوفرة.";

 }else if(
  lower.includes("خريطة") ||
  text.includes("خريطة")
 ){

  answer =
   "خريطة عون تعرض مواقع البلاغات وأولوياتها بطريقة سهلة.";

 }else if(
  lower.includes("نقاط") ||
  text.includes("نقاط")
 ){

  answer =
   "من «نقاطي وإنجازاتي» تقدر تشوف نقاطك وشارتك ومساهماتك.";

 }else if(
  lower.includes("حساب") ||
  text.includes("حساب")
 ){

  answer =
   "تقدر تدخل حسابك من زر الحساب الموجود أعلى الموقع.";

 }

 setTimeout(()=>{

  const botBubble =
   document.createElement("div");

  botBubble.style.cssText = `
   background:rgba(255,255,255,.035);
   border:1px solid var(--border);
   padding:13px;
   border-radius:14px;
   align-self:flex-end;
   max-width:90%;
  `;

  botBubble.textContent =
   "🤖 عون: " + answer;

  messages.appendChild(
   botBubble
  );

  messages.scrollTop =
   messages.scrollHeight;

 },350);

}

async function loadAdminData(){

 try{

  const {data,error} =
   await supabaseClient
    .from("reports")
    .select("*")
    .order(
     "created_at",
     {
      ascending:false
     }
    );

  if(error)
   throw error;

  const rows =
   data || [];

  const newCount =
   rows.filter(
    r=>r.status==="new"
   ).length;

  const progressCount =
   rows.filter(
    r=>r.status==="in_progress"
   ).length;

  const resolvedCount =
   rows.filter(
    r=>r.status==="resolved"
   ).length;

  const stats =
   el("adminStats");

  if(stats){

   stats.innerHTML = `

    <div class="stat">
     <strong>
      ${rows.length}
     </strong>
     <span>
      إجمالي البلاغات
     </span>
    </div>

    <div class="stat">
     <strong>
      ${newCount}
     </strong>
     <span>
      جديدة
     </span>
    </div>

    <div class="stat">
     <strong>
      ${progressCount}
     </strong>
     <span>
      قيد المعالجة
     </span>
    </div>

    <div class="stat">
     <strong>
      ${resolvedCount}
     </strong>
     <span>
      منجزة
     </span>
    </div>

   `;

  }

  const list =
   el("adminReports");

  if(!list)
   return;

  if(!rows.length){

   list.innerHTML = `

    <div class="card">
     <h3>
      لا توجد بلاغات حالياً
     </h3>
    </div>

   `;

   return;

  }

  list.innerHTML =
   rows
    .slice(0,30)
    .map(
     report=>`

      <div
       class="card"
       style="margin-bottom:10px"
      >

       <div
        style="
         display:flex;
         justify-content:space-between;
         gap:10px
        "
       >

        <div>

         <h3>
          ${escapeHTML(
           report.title ||
           "بلاغ"
          )}
         </h3>

         <p style="margin-top:6px">
          ${escapeHTML(
           report.description ||
           ""
          )}
         </p>

        </div>

        <span class="score ${
         Number(report.score)>=70
          ?"score-high"
          :Number(report.score)>=40
           ?"score-mid"
           :"score-low"
        }">
         ${Number(report.score)||0}
        </span>

       </div>

       <div class="actions">

        <button
         class="secondary"
         onclick="
          updateReportStatus(
           '${report.id}',
           'in_progress'
          )
         "
        >
         قيد المعالجة
        </button>

        <button
         class="primary"
         onclick="
          updateReportStatus(
           '${report.id}',
           'resolved'
          )
         "
        >
         تمت المعالجة
        </button>

       </div>

      </div>

     `
    )
    .join("");

 }catch(error){

  console.error(error);

  toast(
   "تعذر تحميل لوحة الإدارة",
   "error"
  );

 }

}

async function updateReportStatus(
 id,
 status
){

 try{

  const {error} =
   await supabaseClient
    .from("reports")
    .update({
     status,
     updated_at:
      new Date().toISOString()
    })
    .eq(
     "id",
     id
    );

  if(error)
   throw error;

  toast(
   status==="resolved"
    ?"تم تحديث البلاغ إلى منجز ✅"
    :"تم تحديث حالة البلاغ"
  );

  await openAdmin();

 }catch(error){

  console.error(error);

  toast(
   error?.message ||
   "تعذر تحديث البلاغ",
   "error"
  );

 }

}

/* =====================================================
   أدوات مساعدة
===================================================== */

function escapeHTML(value){

 return String(
  value ?? ""
 )
 .replace(
  /&/g,
  "&amp;"
 )
 .replace(
  /</g,
  "&lt;"
 )
 .replace(
  />/g,
  "&gt;"
 )
 .replace(
  /"/g,
  "&quot;"
 )
 .replace(
  /'/g,
  "&#039;"
 );

}

function formatDate(date){

 if(!date)
  return "";

 try{

  return new Date(date)
   .toLocaleDateString(
    "ar-AE",
    {
     year:"numeric",
     month:"long",
     day:"numeric"
    }
   );

 }catch(error){

  return "";

 }

}

/* =====================================================
   استعادة الجلسة عند فتح الموقع
===================================================== */

async function restoreSession(){

 try{

  const {data,error} =
   await supabaseClient
    .auth
    .getSession();

  if(error)
   throw error;

  currentUser =
   data?.session?.user ||
   null;

  if(currentUser){

   await loadProfile();

  }

  updateHeader();

 }catch(error){

  console.error(
   "Session error:",
   error
  );

 }

}

restoreSession();

async function openReportDetails(reportId){

 if(!reportId)
  return;

 try{

  const {data,error} =
   await supabaseClient
    .from("reports")
    .select("*")
    .eq("id",reportId)
    .maybeSingle();

  if(error)
   throw error;

  if(!data){

   toast(
    "لم يتم العثور على البلاغ",
    "error"
   );

   return;

  }

  const score =
   Number(data.score)||0;

  const status =
   data.status==="resolved"
    ?"تمت المعالجة"
    :data.status==="in_progress"
     ?"قيد المعالجة"
     :"جديد";

  showModal(`

   <div class="modal-head">

    <div>
     <h2>
      ${escapeHTML(
       data.title ||
       "تفاصيل البلاغ"
      )}
     </h2>

     <p
      style="
       color:var(--muted);
       font-size:12px;
       margin-top:6px
      "
     >
      ${formatDate(
       data.created_at
      )}
     </p>
    </div>

    <button
     class="close"
     onclick="closeModal()"
    >
     ×
    </button>

   </div>

   <div class="report-meta">

    <span>
     الحالة: ${status}
    </span>

    <span>
     الأولوية: ${score}/100
    </span>

    ${
     data.has_photo
      ?"<span>📷 يحتوي صورة</span>"
      :""
    }

   </div>

   <div
    style="
     margin-top:18px;
     line-height:1.9;
     color:var(--muted)
    "
   >
    ${escapeHTML(
     data.description ||
     "لا يوجد وصف."
    )}
   </div>

   ${
    data.photo_url
     ?`
      <img
       class="report-image"
       src="${escapeHTML(
        data.photo_url
       )}"
       alt="صورة البلاغ"
      >
     `
     :""
   }

  `);

 }catch(error){

  console.error(error);

  toast(
   "تعذر تحميل تفاصيل البلاغ",
   "error"
  );

}

function isAdmin(){

 return Boolean(
  currentProfile &&
  currentProfile.role==="admin"
 );

}

/* =====================================================
   تحديث النقاط
===================================================== */

async function addPoints(amount){

 if(!currentUser)
  return;

 const current =
  Number(
   currentProfile?.points
  ) || 0;

 const next =
  current +
  Number(amount||0);

 try{

  const {error} =
   await supabaseClient
    .from("profiles")
    .update({
     points:next
    })
    .eq(
     "id",
     currentUser.id
    );

  if(error)
   throw error;

  if(currentProfile)
   currentProfile.points=next;

 }catch(error){

  console.error(
   "Points update:",
   error
  );

 }

}

/* =====================================================
   تسجيل البلاغ مع إضافة النقاط
===================================================== */

const originalSubmitReport =
 window.submitReport;

window.submitReport =
 async function(){

  if(
   typeof originalSubmitReport!=="function"
  )
   return;

  const before =
   Date.now();

  await originalSubmitReport();

  const elapsed =
   Date.now()-before;

  console.log(
   "Report submitted in:",
   elapsed,
   "ms"
  );

 };

/* =====================================================
   تنظيف القائمة عند فتح الصفحة
===================================================== */

document.addEventListener(
 "click",
 function(event){

  const menu =
   el("menu");

  const target =
   event.target;

  if(
   !menu ||
   menu.classList.contains("hidden")
  )
   return;

  const clickedInside =
   menu.contains(target);

  const menuButton =
   target.closest(
    ".icon-btn"
   );

  if(
   !clickedInside &&
   !menuButton
  ){

   menu.classList.add(
    "hidden"
   );

  }

 }
);

/* =====================================================

 setTimeout(

 );

 setTimeout(
