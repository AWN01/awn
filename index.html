<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f0e">
<meta name="description" content="عون — منصة ذكية لخدمة المجتمع">
<title>عون | معاً.. لمجتمع أكثر أماناً</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

:root{
 --bg:#080b0a;
 --panel:#101513;
 --panel2:#151b18;
 --border:rgba(255,255,255,.09);
 --gold:#d9ad42;
 --gold2:#f1cc69;
 --green:#48c78e;
 --red:#ff5f61;
 --orange:#ff9f43;
 --blue:#4fa8ff;
 --text:#f4f5f4;
 --muted:#9da5a1;
 --shadow:0 20px 60px rgba(0,0,0,.35);
}

html,body{
 min-height:100%;
 background:
 radial-gradient(circle at 20% 0%,rgba(217,173,66,.08),transparent 28%),
 radial-gradient(circle at 100% 20%,rgba(72,199,142,.07),transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
}

body{
 overflow-x:hidden;
}

button,input,textarea,select{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}

/* HEADER */

header{
 position:sticky;
 top:0;
 z-index:1000;
 height:76px;
 background:rgba(8,11,10,.88);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--border);
}

.nav{
 height:100%;
 max-width:1250px;
 margin:auto;
 padding:0 18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.logo{
 display:flex;
 align-items:center;
 gap:11px;
 cursor:pointer;
}

.logo-mark{
 width:43px;
 height:43px;
 border-radius:13px;
 background:linear-gradient(145deg,#f0c94f,#a97917);
 color:#111;
 display:grid;
 place-items:center;
 font-size:23px;
 font-weight:900;
 box-shadow:0 8px 25px rgba(217,173,66,.18);
}

.logo-text strong{
 display:block;
 font-size:20px;
 letter-spacing:.5px;
}

.logo-text small{
 color:var(--muted);
 font-size:10px;
}

.nav-actions{
 display:flex;
 align-items:center;
 gap:8px;
}

.icon-btn{
 width:44px;
 height:44px;
 border-radius:13px;
 border:1px solid var(--border);
 background:rgba(255,255,255,.035);
 color:white;
 display:grid;
 place-items:center;
 font-size:20px;
}

.primary{
 border:0;
 color:#10100d;
 font-weight:800;
 background:linear-gradient(135deg,var(--gold2),var(--gold));
 padding:13px 19px;
 border-radius:13px;
 box-shadow:0 10px 25px rgba(217,173,66,.12);
}

.secondary{
 border:1px solid var(--border);
 color:white;
 background:rgba(255,255,255,.04);
 padding:12px 17px;
 border-radius:13px;
}

.menu{
 position:fixed;
 top:84px;
 right:12px;
 width:min(330px,calc(100vw - 24px));
 max-height:calc(100vh - 98px);
 overflow:auto;
 z-index:2000;
 background:rgba(15,20,18,.98);
 border:1px solid rgba(255,255,255,.11);
 border-radius:22px;
 padding:12px;
 box-shadow:var(--shadow);
}

.menu-item{
 width:100%;
 border:0;
 background:transparent;
 color:white;
 text-align:right;
 padding:15px;
 border-radius:13px;
 display:flex;
 align-items:center;
 gap:12px;
}

.menu-item:hover{
 background:rgba(255,255,255,.06);
}

.menu-item span:first-child{
 width:35px;
 text-align:center;
 font-size:20px;
}

.menu-sep{
 height:1px;
 background:var(--border);
 margin:8px 0;
}

/* HERO */

.hero{
 max-width:1250px;
 margin:auto;
 padding:55px 18px 25px;
}

.hero-grid{
 display:grid;
 grid-template-columns:1.35fr .65fr;
 gap:22px;
}

.hero-main{
 min-height:430px;
 padding:45px;
 border-radius:30px;
 border:1px solid var(--border);
 background:
 linear-gradient(135deg,rgba(217,173,66,.11),transparent 45%),
 linear-gradient(160deg,#121815,#0d1110);
 position:relative;
 overflow:hidden;
}

.hero-main:after{
 content:"";
 position:absolute;
 width:300px;
 height:300px;
 border-radius:50%;
 border:1px solid rgba(217,173,66,.12);
 left:-120px;
 bottom:-150px;
 box-shadow:0 0 0 50px rgba(217,173,66,.025),
 0 0 0 100px rgba(217,173,66,.018);
}

.badge{
 display:inline-flex;
 align-items:center;
 gap:7px;
 border:1px solid rgba(217,173,66,.25);
 color:var(--gold2);
 background:rgba(217,173,66,.07);
 border-radius:100px;
 padding:8px 13px;
 font-size:12px;
 margin-bottom:22px;
}

.hero h1{
 font-size:clamp(42px,7vw,76px);
 line-height:.95;
 margin-bottom:20px;
 letter-spacing:-3px;
}

.hero h1 em{
 color:var(--gold2);
 font-style:normal;
}

.hero p{
 max-width:620px;
 color:#bac0bd;
 font-size:17px;
 line-height:1.9;
 margin-bottom:28px;
}

.hero-buttons{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
}

.hero-side{
 display:grid;
 gap:14px;
}

.mini-card{
 border:1px solid var(--border);
 background:linear-gradient(145deg,#131917,#0e1210);
 border-radius:24px;
 padding:24px;
 min-height:130px;
}

.mini-card .num{
 font-size:35px;
 font-weight:900;
 color:var(--gold2);
 margin-top:10px;
}

.mini-card small{
 color:var(--muted);
}

/* SECTIONS */

.container{
 max-width:1250px;
 margin:auto;
 padding:25px 18px 70px;
}

.section{
 margin-top:28px;
}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:15px;
 margin-bottom:16px;
}

.section-head h2{
 font-size:26px;
}

.section-head p{
 color:var(--muted);
 margin-top:4px;
 font-size:13px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.card{
 background:linear-gradient(145deg,#121816,#0d1110);
 border:1px solid var(--border);
 border-radius:22px;
 padding:22px;
}

.feature{
 min-height:170px;
 transition:.2s;
}

.feature:hover{
 transform:translateY(-3px);
 border-color:rgba(217,173,66,.22);
}

.feature-icon{
 width:52px;
 height:52px;
 display:grid;
 place-items:center;
 border-radius:15px;
 background:rgba(217,173,66,.09);
 font-size:25px;
 margin-bottom:17px;
}

.feature h3{
 margin-bottom:8px;
}

.feature p{
 color:var(--muted);
 font-size:13px;
 line-height:1.7;
}

/* STATS */

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
}

.stat{
 padding:20px;
 border:1px solid var(--border);
 border-radius:20px;
 background:rgba(255,255,255,.025);
}

.stat .value{
 font-size:32px;
 font-weight:900;
 margin-top:8px;
}

.stat .label{
 color:var(--muted);
 font-size:12px;
}

/* FORMS */

.form{
 max-width:700px;
 margin:auto;
}

.field{
 margin-bottom:15px;
}

.field label{
 display:block;
 font-size:13px;
 color:#cfd4d1;
 margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 border:1px solid var(--border);
 background:#0b0f0d;
 color:white;
 border-radius:14px;
 padding:14px;
 outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
 border-color:rgba(217,173,66,.5);
}

.field textarea{
 min-height:125px;
 resize:vertical;
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.actions{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:10px;
}

/* SCORE */

.score-box{
 padding:25px;
 border-radius:23px;
 background:linear-gradient(145deg,#171b18,#0e1210);
 border:1px solid var(--border);
 text-align:center;
 margin:18px 0;
}

.score-circle{
 width:140px;
 height:140px;
 margin:10px auto 15px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:
 conic-gradient(var(--gold2) var(--score,70%),rgba(255,255,255,.08) 0);
 position:relative;
}

.score-circle:before{
 content:"";
 position:absolute;
 width:112px;
 height:112px;
 border-radius:50%;
 background:#0d1110;
}

.score-number{
 position:relative;
 font-size:38px;
 font-weight:900;
}

.score-label{
 color:var(--muted);
}

/* REPORT CARDS */

.report-list{
 display:grid;
 gap:12px;
}

.report{
 border:1px solid var(--border);
 background:linear-gradient(145deg,#131816,#0d1110);
 border-radius:21px;
 padding:18px;
}

.report-top{
 display:flex;
 align-items:flex-start;
 justify-content:space-between;
 gap:10px;
}

.report-title{
 font-weight:800;
 font-size:17px;
}

.report-type{
 color:var(--gold2);
 font-size:12px;
 margin-top:4px;
}

.status{
 padding:7px 10px;
 border-radius:100px;
 background:rgba(79,168,255,.1);
 color:#7dc2ff;
 font-size:11px;
 white-space:nowrap;
}

.status.done{
 background:rgba(72,199,142,.1);
 color:#68dda8;
}

.status.critical{
 background:rgba(255,95,97,.1);
 color:#ff797b;
}

.report-desc{
 color:var(--muted);
 font-size:13px;
 line-height:1.7;
 margin:13px 0;
}

.report-meta{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
}

.meta{
 border:1px solid var(--border);
 padding:7px 10px;
 border-radius:10px;
 font-size:11px;
 color:#bbc1be;
}

.score-pill{
 font-weight:900;
 padding:7px 10px;
 border-radius:10px;
}

.score-high{
 color:#ff7779;
 background:rgba(255,95,97,.09);
}

.score-med{
 color:#ffb45f;
 background:rgba(255,159,67,.09);
}

.score-low{
 color:#68dda8;
 background:rgba(72,199,142,.09);
}

/* MAP */

.map{
 width:100%;
 height:470px;
 border-radius:22px;
 overflow:hidden;
 border:1px solid var(--border);
 background:#101513;
}

.map-tools{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-bottom:12px;
}

.filter{
 border:1px solid var(--border);
 background:rgba(255,255,255,.04);
 color:white;
 padding:9px 12px;
 border-radius:11px;
 font-size:12px;
}

.filter.active{
 background:rgba(217,173,66,.13);
 color:var(--gold2);
 border-color:rgba(217,173,66,.3);
}

/* TIMELINE */

.timeline{
 position:relative;
 padding-right:25px;
}

.timeline:before{
 content:"";
 position:absolute;
 right:8px;
 top:5px;
 bottom:5px;
 width:2px;
 background:rgba(217,173,66,.15);
}

.timeline-item{
 position:relative;
 padding:0 0 22px 0;
}

.timeline-dot{
 position:absolute;
 right:-22px;
 top:2px;
 width:14px;
 height:14px;
 border-radius:50%;
 background:var(--gold2);
 box-shadow:0 0 0 5px rgba(217,173,66,.08);
}

.timeline-item h4{
 margin-bottom:4px;
}

.timeline-item p{
 color:var(--muted);
 font-size:12px;
 line-height:1.6;
}

/* DASHBOARD */

.dashboard{
 display:grid;
 grid-template-columns:240px 1fr;
 gap:16px;
}

.sidebar{
 border:1px solid var(--border);
 background:#0e1210;
 border-radius:22px;
 padding:10px;
 height:max-content;
 position:sticky;
 top:92px;
}

.side-item{
 width:100%;
 background:transparent;
 border:0;
 color:#c8cdca;
 text-align:right;
 padding:13px;
 border-radius:12px;
 margin-bottom:3px;
}

.side-item.active,
.side-item:hover{
 background:rgba(217,173,66,.09);
 color:var(--gold2);
}

.admin-content{
 min-width:0;
}

/* TABLE */

.table-wrap{
 overflow:auto;
 border:1px solid var(--border);
 border-radius:18px;
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:650px;
}

th,td{
 padding:13px;
 text-align:right;
 border-bottom:1px solid var(--border);
 font-size:12px;
}

th{
 color:var(--gold2);
 background:#121715;
}

td{
 color:#c9cecb;
}

/* MODAL */

.modal-back{
 position:fixed;
 inset:0;
 z-index:5000;
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(8px);
 display:grid;
 place-items:center;
 padding:18px;
}

.modal{
 width:min(570px,100%);
 max-height:90vh;
 overflow:auto;
 border:1px solid var(--border);
 border-radius:26px;
 background:#101513;
 box-shadow:var(--shadow);
 padding:25px;
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px;
}

.close{
 width:38px;
 height:38px;
 border:1px solid var(--border);
 border-radius:11px;
 background:rgba(255,255,255,.04);
 color:white;
}

.modal h2{
 font-size:24px;
}

/* TOAST */

.toast{
 position:fixed;
 z-index:7000;
 left:15px;
 right:15px;
 bottom:18px;
 max-width:500px;
 margin:auto;
 padding:15px 17px;
 border-radius:15px;
 background:#161d1a;
 border:1px solid var(--border);
 box-shadow:var(--shadow);
 display:flex;
 gap:10px;
 align-items:center;
}

.toast.success{
 border-color:rgba(72,199,142,.3);
}

.toast.error{
 border-color:rgba(255,95,97,.3);
}

/* EMPTY */

.empty{
 text-align:center;
 padding:45px 20px;
 color:var(--muted);
 border:1px dashed var(--border);
 border-radius:20px;
}

.empty .e-icon{
 font-size:40px;
 margin-bottom:12px;
}

/* FOOTER */

footer{
 border-top:1px solid var(--border);
 padding:35px 18px;
 text-align:center;
 color:var(--muted);
 font-size:12px;
}

/* MOBILE */

@media(max-width:850px){

 .hero-grid{
  grid-template-columns:1fr;
 }

 .hero-main{
  padding:30px 22px;
  min-height:390px;
 }

 .grid{
  grid-template-columns:1fr;
 }

 .stats{
  grid-template-columns:1fr 1fr;
 }

 .dashboard{
  grid-template-columns:1fr;
 }

 .sidebar{
  position:static;
  display:flex;
  overflow:auto;
  gap:4px;
 }

 .side-item{
  white-space:nowrap;
  width:auto;
 }

 .row{
  grid-template-columns:1fr;
 }

 .desktop-login{
  display:none;
 }

 .map{
  height:390px;
 }

 .hero h1{
  letter-spacing:-2px;
 }

}

@media(max-width:500px){

 header{
  height:68px;
 }

 .nav{
  padding:0 11px;
 }

 .logo-mark{
  width:39px;
  height:39px;
 }

 .logo-text strong{
  font-size:17px;
 }

 .hero{
  padding-top:30px;
 }

 .hero-main{
  border-radius:23px;
  padding:25px 20px;
 }

 .hero h1{
  font-size:46px;
 }

 .hero p{
  font-size:14px;
 }

 .stats{
  gap:8px;
 }

 .stat{
  padding:15px;
 }

 .stat .value{
  font-size:26px;
 }

 .container{
  padding-left:12px;
  padding-right:12px;
 }

}
</style>
</head>

<body>

<header>
 <div class="nav">

  <div class="logo" onclick="goHome()">
   <div class="logo-mark">ع</div>
   <div class="logo-text">
    <strong>عون</strong>
    <small>معاً.. لمجتمع أكثر أماناً</small>
   </div>
  </div>

  <div class="nav-actions">

   <button id="headerLogin"
    class="primary desktop-login"
    onclick="openAuth('login')">
    تسجيل الدخول
   </button>

   <button id="headerUser"
    class="icon-btn hidden"
    onclick="openProfile()">
    👤
   </button>

   <button class="icon-btn"
    onclick="toggleMenu()">
    ☰
   </button>

  </div>
 </div>
</header>

<div id="menu" class="menu hidden">

 <button class="menu-item" onclick="goHome();toggleMenu()">
  <span>🏠</span><span>الرئيسية</span>
 </button>

 <button class="menu-item" onclick="requireLogin(openReport);toggleMenu()">
  <span>📢</span><span>رفع بلاغ</span>
 </button>

 <button class="menu-item" onclick="showPage('map');toggleMenu()">
  <span>🗺️</span><span>خريطة عون</span>
 </button>

 <button class="menu-item" onclick="showPage('assistant');toggleMenu()">
  <span>🤖</span><span>مساعد عون</span>
 </button>

 <button class="menu-item" onclick="showPage('pulse');toggleMenu()">
  <span>📊</span><span>نبض المجتمع</span>
 </button>

 <div class="menu-sep"></div>

 <button class="menu-item" onclick="requireLogin(()=>showPage('myreports'));toggleMenu()">
  <span>📋</span><span>بلاغاتي</span>
 </button>

 <button class="menu-item" onclick="requireLogin(()=>showPage('achievements'));toggleMenu()">
  <span>🏆</span><span>نقاطي وإنجازاتي</span>
 </button>

 <button class="menu-item" onclick="requireLogin(openNotifications);toggleMenu()">
  <span>🔔</span><span>الإشعارات</span>
 </button>

 <button class="menu-item" onclick="openSupport();toggleMenu()">
  <span>💬</span><span>الدعم والمساعدة</span>
 </button>

 <button class="menu-item" onclick="openSuggestion();toggleMenu()">
  <span>💡</span><span>اقتراح فكرة</span>
 </button>

 <div class="menu-sep"></div>

 <button id="adminMenu"
  class="menu-item hidden"
  onclick="showPage('admin');toggleMenu()">
  <span>👑</span><span>لوحة تحكم الإدارة</span>
 </button>

 <button id="authMenu"
  class="menu-item"
  onclick="openAuth('login');toggleMenu()">
  <span>🔐</span><span>تسجيل الدخول</span>
 </button>

 <button id="logoutMenu"
  class="menu-item hidden"
  onclick="logout();toggleMenu()">
  <span>↪️</span><span>تسجيل الخروج</span>
 </button>

</div>

<main id="app"></main>

<footer>
 <strong>عون</strong> — منصة ذكية لخدمة المجتمع
 <br>
 <span>معاً.. لمجتمع أكثر أماناً 🇦🇪</span>
</footer>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ftamcnweyimjefjajhcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_z7cfsDCEV7Z3gmGD09oGpw_qEdd4WQM";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================================
   APP STATE
===================================================== */

let currentUser = null;
let currentProfile = null;
let reports = [];
let map = null;
let reportMap = null;
let selectedLat = null;
let selectedLng = null;
let markersLayer = null;

const STORAGE_KEY = "awn_local_reports_v2";

const categories = {
 road:"الطرق",
 light:"الإنارة",
 cleanliness:"النظافة",
 facility:"المرافق العامة",
 safety:"السلامة",
 accessibility:"إتاحة الوصول",
 environment:"البيئة",
 other:"أخرى"
};

const statusFlow = [
 "تم الاستلام",
 "قيد المراجعة",
 "تم تحويله للجهة المختصة",
 "قيد المعالجة",
 "تمت المعالجة"
];


/* =====================================================
   INIT
===================================================== */

document.addEventListener("DOMContentLoaded", async ()=>{

 loadLocalReports();

 await loadSession();

 renderHome();

});


async function loadSession(){

 const {data} =
 await supabaseClient.auth.getSession();

 currentUser = data.session?.user || null;

 if(currentUser){
  await loadProfile();
 }

 updateHeader();
}


async function loadProfile(){

 if(!currentUser) return;

 const {data,error} =
 await supabaseClient
 .from("profiles")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 if(!error && data){
  currentProfile = data;
 }else{
  currentProfile = {
   id:currentUser.id,
   full_name:currentUser.user_metadata?.full_name || "مستخدم عون",
   username:currentUser.user_metadata?.username || "",
   email:currentUser.email || "",
   phone:currentUser.user_metadata?.phone || "",
   role:"user",
   points:0,
   badge:"عضو جديد"
  };
 }

 updateHeader();
}


function updateHeader(){

 const login =
 document.getElementById("headerLogin");

 const user =
 document.getElementById("headerUser");

 const admin =
 document.getElementById("adminMenu");

 const auth =
 document.getElementById("authMenu");

 const logoutBtn =
 document.getElementById("logoutMenu");

 if(!login) return;

 if(currentUser){

  login.classList.add("hidden");
  user.classList.remove("hidden");
  auth.classList.add("hidden");
  logoutBtn.classList.remove("hidden");

  if(currentProfile?.role === "admin"){
   admin.classList.remove("hidden");
  }else{
   admin.classList.add("hidden");
  }

 }else{

  login.classList.remove("hidden");
  user.classList.add("hidden");
  auth.classList.remove("hidden");
  logoutBtn.classList.add("hidden");
  admin.classList.add("hidden");

 }
}

 .filter(r=>(r.score||0)>=80)

async function login(e){

 e.preventDefault();

 const identifier =
 document.getElementById("loginIdentifier").value.trim();

 const password =
 document.getElementById("loginPassword").value;

 let email=identifier;

 if(!identifier.includes("@")){

  const {data:userByName} =
   await supabaseClient
   .from("profiles")
   .select("email")
   .eq("username",identifier)
   .maybeSingle();

  if(userByName?.email){
   email=userByName.email;
  }else{

   const {data:userByPhone} =
    await supabaseClient
    .from("profiles")
    .select("email")
    .eq("phone",identifier)
    .maybeSingle();

   if(userByPhone?.email){
    email=userByPhone.email;
   }else{
    showToast("لم نجد هذا الحساب","error");
    return;
   }
  }
 }

 const {data,error} =
  await supabaseClient.auth.signInWithPassword({
   email,
   password
  });

 if(error){
  showToast(error.message || "تعذر تسجيل الدخول","error");
  return;
 }

 currentUser=data.user;

 await loadProfile();

 closeModal();

 showToast("تم تسجيل الدخول بنجاح","success");

 renderHome();
}

/* =====================================================
   AI / SCORE
===================================================== */

function analyzeIssue(type,description){

 const text =
 (description||"").toLowerCase();

 let score=35;

 const criticalWords = [
  "حادث","حريق","خطر","خطير",
  "سقوط","مكشوف","كهرباء","ماس",
  "حفرة كبيرة","انهيار","تسرب",
  "تصادم","دخان","طوارئ"
 ];

 const mediumWords = [
  "مكسور","تالف","لا يعمل",
  "مشكلة","ازدحام","ماء",
  "تسريب","مزعج","متضرر"
 ];

 criticalWords.forEach(w=>{
  if(text.includes(w)) score+=10;
 });

 mediumWords.forEach(w=>{
  if(text.includes(w)) score+=5;
 });

 const typeBonus = {
  safety:18,
  road:14,
  light:10,
  accessibility:12,
  facility:8,
  environment:7,
  cleanliness:4,
  other:5
 };

 score += typeBonus[type] || 5;

 if(text.length>120) score+=5;

 if(!selectedLat) score-=5;

 score=Math.max(1,Math.min(100,score));

 let label="منخفض";

 if(score>=80) label="حرج";
 else if(score>=60) label="مرتفع";
 else if(score>=40) label="متوسط";

 return {
  score,
  label,
  authority:getAuthority(type)
 };
}


function getAuthority(type){

 const map={
  road:"جهة الطرق والصيانة",
  light:"جهة الإنارة والصيانة",
  cleanliness:"جهة النظافة والبلدية",
  facility:"جهة المرافق والخدمات",
  safety:"جهة السلامة والطوارئ",
  accessibility:"جهة الخدمات المجتمعية وإتاحة الوصول",
  environment:"جهة البيئة",
  other:"الجهة المختصة"
 };

 return map[type] || map.other;
}

 const type =

 const desc =
 document.getElementById("reportDescription")?.value || "";

 if(!type) return;

 const result =
 analyzeIssue(type,desc);

 const circle =
 document.getElementById("previewScore");

 const num =
 document.getElementById("previewScoreNumber");

 const label =
 document.getElementById("previewLabel");

 if(circle)
  circle.style.setProperty(
   "--score",
   result.score+"%"
  );

 if(num)
  num.textContent=result.score;

 if(label)
  label.innerHTML =
   `${result.label} — ${result.authority}`;
}

 let photoUrl=null;

 if(photoInput?.files?.[0]){

    });

     .from("reports")
     .getPublicUrl(path);

    photoUrl=pub.data.publicUrl;

   }

  }catch(err){
   console.log("Photo upload:",err);
  }
 }


 const newReport={

  id:"local_"+Date.now(),

  user_id:currentUser.id,

  title,
  type,
  description,

  latitude:selectedLat,
  longitude:selectedLng,

  score:ai.score,
  priority_label:ai.label,

  authority:ai.authority,

  matches:findMatches(type,selectedLat,selectedLng),

  affected_count:1,

  status:"تم الاستلام",

  has_photo:!!photoUrl,
  photo_url:photoUrl,

  created_at:new Date().toISOString(),
  updated_at:new Date().toISOString(),

  ai_summary:
   `تم تصنيف البلاغ كـ ${ai.label} وتوجيهه مبدئياً إلى ${ai.authority}.`

 };


 /* Try Supabase */

 let savedOnline=false;

 try{

  const {data,error} =
   await supabaseClient
   .from("reports")
   .insert([{
    user_id:newReport.user_id,
    title:newReport.title,
    type:newReport.type,
    description:newReport.description,
    latitude:newReport.latitude,
    longitude:newReport.longitude,
    score:newReport.score,
    matches:newReport.matches,
    status:newReport.status,
    has_photo:newReport.has_photo,
    photo_url:newReport.photo_url
   }])
   .select()
   .single();

  if(!error && data){

   newReport.id=data.id;
   savedOnline=true;

  }else{
   console.log("Supabase report insert:",error);
  }

 }catch(err){
  console.log("Supabase:",err);
 }


 /* Always keep local backup */

 reports.unshift(newReport);

 saveLocalReports();

 if(currentProfile){

  const newPoints =
   (currentProfile.points||0)+10;

  currentProfile.points=newPoints;

  try{

   await supabaseClient
    .from("profiles")
    .update({
     points:newPoints
    })
    .eq("id",currentUser.id);

  }catch{}

 }


 selectedLat=null;
 selectedLng=null;

 showSuccessModal(newReport);

}


function findMatches(type,lat,lng){

 return reports.filter(r=>{

  if(r.type!==type) return false;

  if(!r.latitude || !r.longitude) return false;

  const distance=
   getDistanceKm(
    lat,lng,
    r.latitude,r.longitude
   );

  return distance<=0.3;

 }).length;
}


function getDistanceKm(lat1,lon1,lat2,lon2){

 const R=6371;

 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;

 const a=
  Math.sin(dLat/2)**2+
  Math.cos(lat1*Math.PI/180)*
  Math.cos(lat2*Math.PI/180)*
  Math.sin(dLon/2)**2;

 return R*2*Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );
}

function initMainMap(){

 map =
  L.map("mainMap")
  .setView([24.2075,55.7447],12);

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"© OpenStreetMap"
  }
 ).addTo(map);

 markersLayer=L.layerGroup().addTo(map);

 drawMarkers(reports);
}


function drawMarkers(list){

 if(!markersLayer) return;

 markersLayer.clearLayers();

 list.forEach(r=>{

  if(!r.latitude || !r.longitude) return;

  let color="#48c78e";

  if(r.score>=80) color="#ff5f61";
  else if(r.score>=50) color="#ff9f43";

  const icon =
   L.divIcon({
    className:"",
    html:`
     <div style="
      width:17px;
      height:17px;
      border-radius:50%;
      background:${color};
      border:3px solid white;
      box-shadow:0 3px 12px rgba(0,0,0,.4);
     "></div>
    `,
    iconSize:[17,17]
   });

  L.marker(
   [r.latitude,r.longitude],
   {icon}
  )
  .bindPopup(`
   <div dir="rtl" style="min-width:190px">
    <strong>${escapeHtml(r.title||"بلاغ")}</strong>
    <br>
    <small>
     ${categories[r.type]||r.type||"أخرى"}
    </small>
    <br><br>
    <strong>الأولوية: ${r.score||0}/100</strong>
    <br>
    <small>${escapeHtml(r.status||"تم الاستلام")}</small>
   </div>
  `)
  .addTo(markersLayer);

 });
}


function filterMap(filter,button){

 document
  .querySelectorAll(".filter")
  .forEach(x=>x.classList.remove("active"));

 button.classList.add("active");

 let list=reports;

 if(filter==="critical")
  list=reports.filter(r=>r.score>=80);

 if(filter==="medium")
  list=reports.filter(r=>r.score>=50&&r.score<80);

 if(filter==="low")
  list=reports.filter(r=>r.score<50);

 if(["road","light","safety"].includes(filter))
  list=reports.filter(r=>r.type===filter);

 drawMarkers(list);
}

async function adminUpdateStatus(id,status){

 const local =
  reports.find(
   r=>String(r.id)===String(id)
  );

 if(local){
  local.status=status;
  local.updated_at=new Date().toISOString();
 }

 saveLocalReports();

 try{

  await supabaseClient
   .from("reports")
   .update({
    status,
    updated_at:new Date().toISOString()
   })
   .eq("id",id);

 }catch(err){
  console.log(err);
 }

 showToast("تم تحديث حالة البلاغ","success");

}

/* =====================================================
   MODALS / TOAST
===================================================== */

function showModal(html){

 document.getElementById("modalRoot").innerHTML=`

 <div class="modal-back"
  onclick="modalOutside(event)">

  <div class="modal">
   ${html}
  </div>

 </div>

 `;
}


function modalOutside(e){

 if(e.target.classList.contains("modal-back"))
  closeModal();
}


function closeModal(){

 document.getElementById("modalRoot").innerHTML="";
}


function showToast(message,type="success"){

 const root=
  document.getElementById("toastRoot");

 root.innerHTML=`

 <div class="toast ${type}">

  <span style="font-size:19px">
   ${type==="success"?"✓":"!"}
  </span>

  <span>${escapeHtml(message)}</span>

 </div>
 `;

 setTimeout(()=>{
  root.innerHTML="";
 },3500);
}

/* =====================================================
   HELPERS
===================================================== */

function formatDate(date){

 if(!date) return "—";

 try{

  return new Date(date)
   .toLocaleDateString(
    "ar-AE",
    {
     year:"numeric",
     month:"short",
     day:"numeric"
    }
   );

 }catch{
  return "—";
 }
}


function escapeHtml(value){

 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}
