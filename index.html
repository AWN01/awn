<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06141b">
<meta name="description" content="عون — منصة رقمية لخدمة المجتمع">
<title>عون | معاً.. لمجتمع أكثر أماناً</title>

<link rel="icon" href="awn-logo.png">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#06141b;
  --bg2:#081d25;
  --card:#0b2029;
  --card2:#0e2731;
  --line:rgba(111,235,230,.14);
  --text:#f5fbfb;
  --muted:#91a8ad;
  --accent:#52e2dc;
  --accent2:#2dcac5;
  --gold:#d6b56a;
  --danger:#ff6b72;
  --success:#52df9c;
  --shadow:0 20px 60px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Cairo',sans-serif;
  background:
    radial-gradient(circle at 80% 10%,rgba(57,217,211,.08),transparent 28%),
    radial-gradient(circle at 15% 45%,rgba(214,181,106,.04),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  height:88px;
  background:rgba(5,18,24,.88);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  width:min(1180px,calc(100% - 32px));
  height:100%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:white;
}

.brand img{
  width:58px;
  height:58px;
  object-fit:contain;
  border-radius:17px;
  background:#fff;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.login-btn,
.primary-btn{
  border:0;
  border-radius:18px;
  background:linear-gradient(135deg,#62e9e4,#39d4cf);
  color:#032024;
  font-size:16px;
  font-weight:800;
  padding:14px 24px;
  box-shadow:0 12px 30px rgba(63,224,218,.16);
}

.login-btn:hover,
.primary-btn:hover{
  transform:translateY(-2px);
}

.menu-btn{
  width:54px;
  height:54px;
  border-radius:17px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  color:white;
  font-size:25px;
}

.menu-btn:hover{
  background:rgba(82,226,220,.08);
}

.user-chip{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.025);
}

.user-avatar{
  width:34px;
  height:34px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:rgba(82,226,220,.12);
  color:var(--accent);
}

/* =========================
   SIDE MENU
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:1500;
  display:none;
}

.overlay.open{
  display:block;
}

.side-menu{
  position:fixed;
  top:0;
  right:-360px;
  width:min(360px,88vw);
  height:100dvh;
  background:#071a22;
  border-left:1px solid var(--line);
  z-index:1600;
  padding:22px;
  transition:.3s ease;
  overflow:auto;
}

.side-menu.open{
  right:0;
}

.menu-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.menu-logo{
  width:55px;
  height:55px;
  object-fit:contain;
  border-radius:15px;
  background:white;
}

.close-menu{
  width:44px;
  height:44px;
  border:1px solid var(--line);
  background:transparent;
  color:white;
  border-radius:14px;
  font-size:22px;
}

.menu-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.menu-item{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:#d9e7e8;
  padding:15px 16px;
  border-radius:15px;
  text-align:right;
  font-size:15px;
  font-weight:700;
}

.menu-item:hover{
  background:rgba(82,226,220,.07);
  border-color:var(--line);
  color:white;
}

.menu-item.admin{
  color:var(--gold);
  border-color:rgba(214,181,106,.15);
}

/* =========================
   LAYOUT
========================= */

.container{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}

.page{
  padding:35px 0 80px;
}

.section{
  margin-top:28px;
}

.section-title{
  font-size:25px;
  margin-bottom:8px;
}

.section-subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:20px;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  overflow:hidden;
  min-height:650px;
  border:1px solid var(--line);
  border-radius:38px;
  background:
    radial-gradient(circle at 15% 90%,rgba(82,226,220,.08),transparent 35%),
    radial-gradient(circle at 95% 10%,rgba(82,226,220,.08),transparent 35%),
    linear-gradient(145deg,#0a2029,#07171f);
  padding:55px;
  box-shadow:var(--shadow);
}

.hero:before,
.hero:after{
  content:"";
  position:absolute;
  border:1px solid rgba(82,226,220,.07);
  border-radius:50%;
  pointer-events:none;
}

.hero:before{
  width:620px;
  height:620px;
  left:-300px;
  bottom:-390px;
}

.hero:after{
  width:450px;
  height:450px;
  right:-220px;
  top:-260px;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:850px;
  margin-right:auto;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid rgba(82,226,220,.18);
  background:rgba(82,226,220,.06);
  color:var(--accent);
  border-radius:999px;
  padding:10px 17px;
  font-size:14px;
  margin-bottom:30px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 14px rgba(82,223,156,.6);
}

.hero h1{
  font-size:clamp(44px,7vw,78px);
  line-height:1.15;
  letter-spacing:-2px;
  margin-bottom:28px;
  font-weight:900;
}

.hero h1 span{
  color:var(--accent);
}

.hero p{
  max-width:720px;
  color:#a9babc;
  font-size:18px;
  line-height:2;
  margin-bottom:35px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.secondary-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  color:white;
  border-radius:18px;
  padding:14px 23px;
  font-size:16px;
  font-weight:700;
}

.secondary-btn:hover{
  background:rgba(82,226,220,.07);
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-top:20px;
}

.stat{
  border:1px solid var(--line);
  border-radius:28px;
  background:rgba(7,28,36,.82);
  padding:26px;
  min-height:150px;
  position:relative;
  overflow:hidden;
}

.stat:after{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(82,226,220,.04);
  left:-55px;
  bottom:-75px;
}

.stat-label{
  color:var(--muted);
  font-size:14px;
  margin-bottom:13px;
}

.stat-value{
  font-size:42px;
  font-weight:900;
  color:var(--accent);
}

/* =========================
   CARDS
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  border:1px solid var(--line);
  border-radius:25px;
  background:rgba(9,30,38,.78);
  padding:24px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.card h3{
  font-size:18px;
  margin-bottom:8px;
}

.card p{
  color:var(--muted);
  line-height:1.9;
  font-size:14px;
}

.feature-icon{
  width:50px;
  height:50px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:rgba(82,226,220,.07);
  margin-bottom:17px;
  font-size:23px;
}

/* =========================
   REPORT
========================= */

.form-card{
  max-width:800px;
  margin:auto;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  color:#dbe7e8;
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  background:#071b23;
  color:white;
  border-radius:15px;
  padding:14px;
  outline:none;
  font-size:15px;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:rgba(82,226,220,.4);
}

.field textarea{
  min-height:130px;
  resize:vertical;
}

.location-box{
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.location-head{
  padding:14px;
  background:#0b222b;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.location-head span{
  color:var(--muted);
  font-size:13px;
}

.location-btn{
  border:1px solid var(--line);
  background:rgba(82,226,220,.06);
  color:var(--accent);
  padding:8px 12px;
  border-radius:12px;
  font-weight:700;
}

#reportMap{
  height:330px;
}

.file-box{
  border:1px dashed rgba(82,226,220,.2);
  border-radius:17px;
  padding:18px;
  background:rgba(82,226,220,.025);
}

.file-box input{
  border:0;
  padding:0;
}

/* =========================
   MAP
========================= */

.map-card{
  border:1px solid var(--line);
  border-radius:28px;
  overflow:hidden;
}

#mainMap{
  width:100%;
  height:500px;
}

/* =========================
   REPORT LIST
========================= */

.report-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.report{
  border:1px solid var(--line);
  background:#091f28;
  border-radius:20px;
  padding:19px;
}

.report-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.report-title{
  font-size:17px;
  font-weight:800;
}

.report-type{
  color:var(--accent);
  font-size:12px;
  margin-top:4px;
}

.report-desc{
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
  margin-top:12px;
}

.status{
  display:inline-flex;
  border-radius:999px;
  padding:6px 10px;
  font-size:11px;
  background:rgba(82,226,220,.07);
  color:var(--accent);
}

/* =========================
   PROFILE
========================= */

.profile-head{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:20px;
}

.profile-avatar{
  width:70px;
  height:70px;
  border-radius:22px;
  background:linear-gradient(135deg,#52e2dc,#167f7b);
  color:#052126;
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:900;
}

.profile-name{
  font-size:22px;
  font-weight:900;
}

.profile-meta{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   ADMIN
========================= */

.admin-layout{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:18px;
}

.admin-side{
  border:1px solid var(--line);
  background:#091f28;
  border-radius:25px;
  padding:15px;
  height:max-content;
}

.admin-side button{
  width:100%;
  padding:13px;
  border:0;
  background:transparent;
  color:#c6d5d7;
  border-radius:13px;
  text-align:right;
  margin-bottom:5px;
}

.admin-side button.active,
.admin-side button:hover{
  background:rgba(82,226,220,.07);
  color:var(--accent);
}

.admin-content{
  min-width:0;
}

.admin-welcome{
  margin-bottom:18px;
}

.admin-welcome h2{
  font-size:28px;
  margin-bottom:6px;
}

.admin-welcome p{
  color:var(--muted);
}

/* =========================
   AUTH MODAL
========================= */

.modal-layer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);
  z-index:3000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-layer.open{
  display:flex;
}

.modal{
  width:min(520px,100%);
  max-height:90dvh;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:28px;
  background:#081b23;
  padding:26px;
  box-shadow:0 30px 90px rgba(0,0,0,.5);
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.modal-top h2{
  font-size:24px;
}

.close-modal{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  background:transparent;
  color:white;
  border-radius:13px;
  font-size:20px;
}

.auth-switch{
  display:flex;
  gap:6px;
  padding:5px;
  border-radius:14px;
  background:#06151b;
  margin-bottom:20px;
}

.auth-switch button{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px;
  border-radius:10px;
}

.auth-switch button.active{
  background:#0d2b34;
  color:var(--accent);
}

.forgot{
  border:0;
  background:transparent;
  color:var(--accent);
  font-size:13px;
  padding:0;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,120px);
  z-index:5000;
  background:#0d2932;
  border:1px solid var(--line);
  color:white;
  border-radius:15px;
  padding:13px 18px;
  box-shadow:var(--shadow);
  transition:.3s;
  font-size:14px;
}

.toast.show{
  transform:translate(-50%,0);
}

.toast.error{
  border-color:rgba(255,107,114,.3);
}

/* =========================
   EMPTY
========================= */

.empty{
  border:1px dashed var(--line);
  border-radius:20px;
  padding:35px;
  text-align:center;
  color:var(--muted);
}

/* =========================
   FOOTER
========================= */

footer{
  border-top:1px solid var(--line);
  padding:30px 0;
  margin-top:50px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .header{
    height:78px;
  }

  .header-inner{
    width:calc(100% - 20px);
  }

  .brand img{
    width:51px;
    height:51px;
  }

  .login-btn{
    padding:12px 16px;
    font-size:14px;
    border-radius:15px;
  }

  .menu-btn{
    width:49px;
    height:49px;
  }

  .page{
    padding-top:20px;
  }

  .hero{
    min-height:auto;
    padding:32px 23px 36px;
    border-radius:30px;
  }

  .hero h1{
    font-size:48px;
    letter-spacing:-1.5px;
  }

  .hero p{
    font-size:15px;
    line-height:2;
  }

  .hero-buttons{
    flex-direction:column;
  }

  .hero-buttons button{
    width:100%;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .stat:last-child{
    grid-column:1/-1;
  }

  .stat{
    min-height:135px;
    padding:20px;
  }

  .stat-value{
    font-size:34px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .admin-layout{
    grid-template-columns:1fr;
  }

  .admin-side{
    display:flex;
    overflow:auto;
    gap:6px;
  }

  .admin-side button{
    min-width:130px;
    margin:0;
  }

  #mainMap{
    height:430px;
  }

  #reportMap{
    height:300px;
  }
}

@media(max-width:450px){

  .container{
    width:calc(100% - 20px);
  }

  .hero h1{
    font-size:42px;
  }

  .stats{
    gap:10px;
  }

  .stat{
    padding:17px;
    border-radius:22px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="header-actions">

      <button
        id="headerLogin"
        class="login-btn"
        onclick="openAuth('login')">
        تسجيل الدخول
      </button>

      <div id="headerUser" class="user-chip hidden">
        <div class="user-avatar">ع</div>
        <span id="headerUserName">مستخدم</span>
      </div>

      <button
        class="menu-btn"
        onclick="toggleMenu()"
        aria-label="القائمة">
        ☰
      </button>

    </div>

    <a class="brand" href="#" onclick="goHome();return false;">
      <img src="awn-logo.png" alt="عون">
    </a>

  </div>
</header>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<aside id="sideMenu" class="side-menu">

  <div class="menu-top">
    <img class="menu-logo" src="awn-logo.png" alt="عون">
    <button class="close-menu" onclick="closeMenu()">×</button>
  </div>

  <div class="menu-list">

    <button class="menu-item" onclick="navigate('home')">
      🏠 الرئيسية
    </button>

    <button class="menu-item" onclick="navigate('report')">
      📢 رفع بلاغ
    </button>

    <button class="menu-item" onclick="navigate('map')">
      🗺️ خريطة عون
    </button>

    <button class="menu-item" onclick="navigate('pulse')">
      📊 نبض المجتمع
    </button>

    <button class="menu-item" onclick="navigate('myReports')">
      📋 بلاغاتي
    </button>

    <button class="menu-item" onclick="navigate('points')">
      🏆 نقاطي وإنجازاتي
    </button>

    <button class="menu-item" onclick="navigate('notifications')">
      🔔 الإشعارات
    </button>

    <button
      id="adminMenu"
      class="menu-item admin hidden"
      onclick="navigate('admin')">
      👑 لوحة تحكم عون
    </button>

    <button class="menu-item" onclick="navigate('support')">
      💬 الدعم والمساعدة
    </button>

    <button
      id="logoutMenu"
      class="menu-item hidden"
      onclick="logout()">
      🚪 تسجيل الخروج
    </button>

  </div>

</aside>

<main id="app" class="page">
</main>

<footer>
  <div class="container">
    <div>عون | AWN</div>
    <div style="margin-top:5px">
      معاً.. لمجتمع أكثر أماناً
    </div>
  </div>
</footer>

<!-- AUTH -->

<div id="authModal" class="modal-layer">

  <div class="modal">

    <div class="modal-top">
      <h2 id="authTitle">تسجيل الدخول</h2>
      <button class="close-modal" onclick="closeAuth()">×</button>
    </div>

    <div class="auth-switch">
      <button id="loginTab" class="active" onclick="setAuthMode('login')">
        دخول
      </button>
      <button id="signupTab" onclick="setAuthMode('signup')">
        إنشاء حساب
      </button>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)">

      <div id="signupFields" class="hidden">

        <div class="field">
          <label>الاسم الكامل</label>
          <input
            id="authName"
            type="text"
            placeholder="اسمك الكامل">
        </div>

        <div class="field">
          <label>اسم المستخدم</label>
          <input
            id="authUsername"
            type="text"
            placeholder="اسم المستخدم">
        </div>

        <div class="field">
          <label>رقم الهاتف</label>
          <input
            id="authPhone"
            type="tel"

function initReportMap(){

  const element =
    document.getElementById("reportMap");

  if(!element) return;

  if(reportMap){

    reportMap.remove();
    reportMap=null;

  }

  reportMap =
    L.map("reportMap")
      .setView([24.2075,55.7447],12);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap"
    }
  ).addTo(reportMap);

  reportMap.on("click",function(e){

    selectedLat=e.latlng.lat;
    selectedLng=e.latlng.lng;

    if(reportMarker){
      reportMap.removeLayer(reportMarker);
    }

    reportMarker =
      L.marker([
        selectedLat,
        selectedLng
      ]).addTo(reportMap);

  });

}


function useMyLocation(){

  if(!navigator.geolocation){

    showToast(
      "الموقع غير مدعوم في جهازك",
      "error"
    );

    return;

  }

  navigator.geolocation.getCurrentPosition(
    position=>{

      selectedLat =
        position.coords.latitude;

      selectedLng =
        position.coords.longitude;

      if(reportMap){

        reportMap.setView(
          [selectedLat,selectedLng],
          16
        );

        if(reportMarker){
          reportMap.removeLayer(reportMarker);
        }

        reportMarker=
          L.marker([
            selectedLat,
            selectedLng
          ]).addTo(reportMap);

      }

    },
    ()=>{
      showToast(
        "تعذر الحصول على الموقع",
        "error"
      );
    }
  );

}


/* =====================================================
   REPORT ANALYSIS
===================================================== */

function analyzeIssue(type,description){

  const text=
    (description||"").toLowerCase();

  let score=35;

  const critical=[
    "خطر",
    "حادث",
    "حريق",
    "سقوط",
    "كهرباء",
    "مكشوف",
    "انهيار",
    "danger",
    "fire"
  ];

  const medium=[
    "مكسور",
    "حفرة",
    "ظلام",
    "إنارة",
    "نفايات",
    "تسرب",
    "broken"
  ];

  critical.forEach(word=>{
    if(text.includes(word)) score+=18;
  });

  medium.forEach(word=>{
    if(text.includes(word)) score+=8;
  });

  const bonus={
    safety:20,
    road:10,
    light:8,
    accessibility:10
  };

  score+=bonus[type]||0;

  score=Math.max(1,Math.min(100,score));

  let label="منخفضة";

  if(score>=80) label="عالية";
  else if(score>=50) label="متوسطة";

  return {
    score,
    label
  };

}

async function submitReport(){

      .value.trim();

  const type=
    document.getElementById("reportType")

  if(!title){

  }

    selectedLng===null
  ){

    showToast(
      "حدد موقع المشكلة من الخريطة",
      "error"
    );

    return;

  }

  const analysis=
    analyzeIssue(
      type,
      description
    );

  let photoUrl=null;

  if(photoInput?.files?.[0]){

    try{

      const file=
        photoInput.files[0];

      const path=
        `${currentUser.id}/${Date.now()}_${file.name}`;

      const result=
        await supabaseClient
          .storage
          .from("reports")
          .upload(
            path,
            file,
            {upsert:false}
          );

      if(!result.error){

        const publicUrl=
          supabaseClient
            .storage
            .from("reports")
            .getPublicUrl(path);

        photoUrl=
          publicUrl.data.publicUrl;

      }

    }catch(error){

      console.log(error);

    }

  }


  const report={

    user_id:currentUser.id,

    title,

    type,

    description,

    latitude:selectedLat,

    longitude:selectedLng,

    score:analysis.score,

    matches:0,

    status:"تم الاستلام",

    has_photo:!!photoUrl,

    photo_url:photoUrl

  };


  const {data,error}=
    await supabaseClient
      .from("reports")
      .insert([report])
      .select()
      .single();


  if(error){

    console.log(error);

    /*
      نحتفظ بنسخة محلية حتى لا تضيع

    saveLocalReports();

    addPoints(10);

    showToast(
      "تم إرسال البلاغ بنجاح",
      "success"
    );

  selectedLat=null;
  selectedLng=null;

  setTimeout(()=>{
    navigate("myReports");
  },900);

}

    const {data,error}=
      await supabaseClient
        .from("reports")
        .select("*")
        .order("created_at",{ascending:false})
        .limit(500);

    if(!error && data){
      online=data;
    }

  }catch{}

  let local=[];

  try{

    local=
      JSON.parse(
        localStorage.getItem("awn_local_reports_v2")
        || "[]"
      );

  }catch{
    local=[];
  }

  /*
    إذا كانت البيانات موجودة أونلاين نعرضها،
    مع الاحتفاظ بالبلاغات المحلية غير الموجودة.
  */

  const onlineIds=
    new Set(online.map(r=>String(r.id)));

  const extraLocal=
    local.filter(
      r=>!onlineIds.has(String(r.id))
    );

  reports=[
    ...online,
    ...extraLocal
  ];

}


function saveLocalReports(){

  try{

    localStorage.setItem(
      "awn_local_reports_v2",
      JSON.stringify(reports)
    );

  }catch{}

}

function renderMapPage(){

  document.getElementById("app").innerHTML=`

      <p class="section-subtitle">

function initMainMap(){

  if(mainMap){

    mainMap.remove();
    mainMap=null;

  }

  mainMap=
    L.map("mainMap")
      .setView([24.2075,55.7447],11);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap"
    }
  ).addTo(mainMap);

  mainMarkers=
    L.layerGroup().addTo(mainMap);

  reports.forEach(report=>{

    if(
      report.latitude===null ||
      report.longitude===null
    ) return;

    const marker=
      L.marker([
        report.latitude,
        report.longitude
      ]);

    marker.bindPopup(`
      <strong>
        ${escapeHtml(report.title||"بلاغ")}
      </strong>
      <br>
      ${escapeHtml(
        categories[report.type]||
        report.type||
        ""
      )}
      <br>
      ${escapeHtml(report.status||"تم الاستلام")}
    `);

    mainMarkers.addLayer(marker);

  });

}

function openSupport(){

  document.getElementById("simpleBody")
    .innerHTML=`

      <div class="field">

        <label>العنوان</label>

          id="supportTitle"
          placeholder="موضوع الرسالة">

        <label>الرسالة</label>

        <textarea
          id="supportMessage"
          placeholder="اكتب رسالتك..."></textarea>

      </div>

      <button
        class="primary-btn"
        style="width:100%"
        onclick="sendSupport()">
        إرسال
      </button>
    `;

  document.getElementById("simpleModal")
    .classList.add("open");

}


async function sendSupport(){

  if(!currentUser){

    closeSimpleModal();
    openAuth("login");
    return;

  }

  const title=
    document.getElementById("supportTitle")
      .value.trim();

  const message=
    document.getElementById("supportMessage")
      .value.trim();

  if(!title || !message){

    showToast(
      "أكمل البيانات",
      "error"
    );

    return;

  }

  const {error}=
    await supabaseClient
      .from("support_messages")
      .insert([{
        user_id:currentUser.id,
        title,
        message
      }]);

  if(error){

    showToast(
      "تعذر إرسال الرسالة",
      "error"
    );

  }else{

    closeSimpleModal();

    showToast(
      "تم إرسال رسالتك",
      "success"
    );

  }

}


function closeSimpleModal(){

  document.getElementById("simpleModal")
    .classList.remove("open");

}

    const total=reports.length;

    const resolved=
      reports.filter(
        r=>r.status==="تمت المعالجة"
      ).length;

    const pending=
      reports.filter(

      ).length;

    box.innerHTML=`

      <div class="stats">

          <div class="stat-label">

          </div>

            ${total}

        </div>

            قيد المتابعة
          </div>
          <div class="stat-value">
            ${pending}
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            تمت المعالجة
          </div>
          <div class="stat-value">
            ${resolved}
          </div>
        </div>

      </div>

      <div class="section">

        <div class="card">

          <h3>
            أحدث البلاغات
          </h3>

          <div
            class="report-list"
            style="margin-top:15px">

            ${
              reports.length
              ? reports
                  .slice(0,8)
                  .map(adminReportCard)
                  .join("")

                  لا توجد بلاغات.
                </div>
              `
            }

          </div>

        </div>

      </div>
    `;

  }


  if(section==="reports"){

    box.innerHTML=`

      <div class="card">

        <h3>
          📢 إدارة البلاغات
        </h3>

        <p style="margin-top:5px">
          عرض ومتابعة جميع البلاغات.
        </p>

        <div
          class="report-list"
          style="margin-top:18px">

          ${
            reports.length
            ? reports
                .map(adminReportCard)
                .join("")
            : `
              <div class="empty">
                لا توجد بلاغات.
              </div>
            `
          }

        </div>

      </div>
    `;

  }


  if(section==="users"){

    loadAdminUsers(box);

  }


  if(section==="analytics"){

    const total=reports.length;

    const resolved=
      reports.filter(
        r=>r.status==="تمت المعالجة"
      ).length;

    box.innerHTML=`

      <div class="stats">

        <div class="stat">

function adminReportCard(r){

  return `

    <div class="report">

          <div class="report-title">

              categories[r.type]||
              r.type||
              ""
            )}
          </div>

        </div>

      </div>

      <p class="report-desc">
        ${escapeHtml(r.description||"")}
      </p>

      <div
        style="
        display:flex;
        gap:8px;
        margin-top:15px;
        align-items:center;
        flex-wrap:wrap">

        <select
          onchange="adminUpdateStatus('${String(r.id)}',this.value)"
          style="

          background:#071b23;
          color:white;
          border-radius:12px;
          padding:9px">

          ${
            statusFlow.map(
              s=>`

              `

          }

    </div>

}


async function adminUpdateStatus(id,status){

  if(currentProfile?.role!=="admin")
    return;

  const {error}=
    await supabaseClient
      .from("reports")
      .update({
        status,
        updated_at:new Date().toISOString()
      })
      .eq("id",id);

  if(error){

    showToast(
      "تعذر تحديث الحالة",
      "error"
    );

    return;

  }

  const item=
    reports.find(
      r=>String(r.id)===String(id)
    );

  if(item){
    item.status=status;
  }

  saveLocalReports();

  showToast(
    "تم تحديث حالة البلاغ",
    "success"
  );

  renderAdmin();

}

/* =====================================================
   HELPERS
===================================================== */

function showToast(message,type="success"){

  const toast=
    document.getElementById("toast");

  toast.textContent=message;

  toast.className=
    "toast show "+
    (type==="error"?"error":"");

  clearTimeout(window.toastTimer);

  window.toastTimer=
    setTimeout(()=>{
      toast.className="toast";
    },3500);

}


function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getInitial(){

  const name=
    currentProfile?.full_name||
    currentProfile?.username||
    "ع";

  return name.charAt(0);

}
