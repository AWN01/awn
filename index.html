/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ftamcnweyimjefjajhcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_z7cfsDCEV7Z3gmGD09oGpw_qEdd4WQM";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================================
   APP STATE
===================================================== */

let currentUser = null;
let currentProfile = null;
let reports = [];
let map = null;
let reportMap = null;
let selectedLat = null;
let selectedLng = null;
let markersLayer = null;

const STORAGE_KEY = "awn_local_reports_v2";

const categories = {
 road:"الطرق",
 light:"الإنارة",
 cleanliness:"النظافة",
 facility:"المرافق العامة",
 safety:"السلامة",
 accessibility:"إتاحة الوصول",
 environment:"البيئة",
 other:"أخرى"
};

const statusFlow = [
 "تم الاستلام",
 "قيد المراجعة",
 "تم تحويله للجهة المختصة",
 "قيد المعالجة",
 "تمت المعالجة"
];


/* =====================================================
   INIT
===================================================== */

document.addEventListener("DOMContentLoaded", async ()=>{

 loadLocalReports();

 await loadSession();

 renderHome();

});


async function loadSession(){

 const {data} =
 await supabaseClient.auth.getSession();

 currentUser = data.session?.user || null;

 if(currentUser){
  await loadProfile();
 }

 updateHeader();
}


async function loadProfile(){

 if(!currentUser) return;

 const {data,error} =
 await supabaseClient
 .from("profiles")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 if(!error && data){
  currentProfile = data;
 }else{
  currentProfile = {
   id:currentUser.id,
   full_name:currentUser.user_metadata?.full_name || "مستخدم عون",
   username:currentUser.user_metadata?.username || "",
   email:currentUser.email || "",
   phone:currentUser.user_metadata?.phone || "",
   role:"user",
   points:0,
   badge:"عضو جديد"
  };
 }

 updateHeader();
}


function updateHeader(){

 const login =
 document.getElementById("headerLogin");

 const user =
 document.getElementById("headerUser");

 const admin =
 document.getElementById("adminMenu");

 const auth =
 document.getElementById("authMenu");

 const logoutBtn =
 document.getElementById("logoutMenu");

 if(!login) return;

 if(currentUser){

  login.classList.add("hidden");
  user.classList.remove("hidden");
  if(auth) auth.classList.add("hidden");
  logoutBtn.classList.remove("hidden");

  if(currentProfile?.role === "admin"){
   admin.classList.remove("hidden");
  }else{
   admin.classList.add("hidden");
  }

 }else{

  login.classList.remove("hidden");
  user.classList.add("hidden");
  if(auth) auth.classList.remove("hidden");
  logoutBtn.classList.add("hidden");
  admin.classList.add("hidden");

 }
}


/* =====================================================
   LOCAL FALLBACK
===================================================== */

function loadLocalReports(){

 try{
  reports =
   JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
 }catch{
  reports=[];
 }
}


function saveLocalReports(){

 localStorage.setItem(
  STORAGE_KEY,
  JSON.stringify(reports)
 );
}

function updateHomeStats(){

 const total = reports.length;

 const resolved =
 reports.filter(r=>r.status==="تمت المعالجة").length;

 const critical =
 reports
 .filter(r=>(r.score||0)>=80)
 .sort((a,b)=>(b.score||0)-(a.score||0))[0];

 document.getElementById("homeReports").textContent=total;

 document.getElementById("homeResolved").textContent =
 total ? Math.round((resolved/total)*100)+"%" : "0%";

 document.getElementById("homeCritical").textContent =
 critical ? critical.score : "—";
}

function getLevel(points){

 if(points>=500)
  return{
   name:"قائد المجتمع",
   icon:"👑"
  };

 if(points>=250)
  return{
   name:"بطل المجتمع",
   icon:"🏆"
  };

 if(points>=100)
  return{
   name:"عضو مؤثر",
   icon:"🏅"
  };

 if(points>=50)
  return{
   name:"مساهم فعال",
   icon:"⭐"
  };

 return{
  name:"مساهم جديد",
  icon:"🌱"
 };
}


function getNextLevel(points){

 const levels=[
  {target:50},
  {target:100},
  {target:250},
  {target:500},
  {target:1000}
 ];

 const target =
  levels.find(
   x=>points<x.target
  )?.target || 1000;

 const previous =
  target===50
  ?0
  :target===100
  ?50
  :target===250
  ?100
  :target===500
  ?250
  :500;

 const progress =
  Math.max(
   0,
   Math.min(
    100,
    ((points-previous)/
     (target-previous))*100
   )
  );

 return{
  target,
  progress
 };
}

function getLevel(points){

 if(points>=500)
  return{
   name:"قائد المجتمع",
   icon:"👑"
  };

 if(points>=250)
  return{
   name:"بطل المجتمع",
   icon:"🏆"
  };

 if(points>=100)
  return{
   name:"عضو مؤثر",
   icon:"🏅"
  };

 if(points>=50)
  return{
   name:"مساهم فعال",
   icon:"⭐"
  };

 return{
  name:"مساهم جديد",
  icon:"🌱"
 };
}


function getNextLevel(points){

 const levels=[
  {target:50},
  {target:100},
  {target:250},
  {target:500},
  {target:1000}
 ];

 const target =
  levels.find(
   x=>points<x.target
  )?.target || 1000;

 const previous =
  target===50
  ?0
  :target===100
  ?50
  :target===250
  ?100
  :target===500
  ?250
  :500;

 const progress =
  Math.max(
   0,
   Math.min(
    100,
    ((points-previous)/
     (target-previous))*100
   )
  );

 return{
  target,
  progress
 };
}
