<style>

.auth-tabs{

.info-box{

.grid{grid-template-columns:1fr 1fr}

.hero h1{font-size:48px}
.hero p{font-size:16px}
.actions>*{min-width:100%}

}

@media(prefers-reduced-motion:no-preference){
button,.card,.feature{transition:.18s ease}
button:hover{transform:translateY(-1px)}
}
</style>

<body>

<header>
<div class="nav">

<div class="logo" onclick="showPage('home')">
<img id="headerLogo"
src="awn-logo.png"
alt="عون"
style="width:43px;height:43px;border-radius:13px;object-fit:contain">
<div class="logo-text">
<strong>عون</strong>
<small>معاً.. لمجتمع أكثر أماناً</small>
</div>
</div>

<div class="nav-actions">
<button class="icon-btn" onclick="toggleMenu()">☰</button>
<div id="authHeader"></div>
</div>

</div>
</header>

<div id="sideMenu" class="menu hidden">

<button onclick="showPage('home');toggleMenu()">🏠 الرئيسية</button>
<button onclick="requireLogin(()=>showPage('report'));toggleMenu()">📢 رفع بلاغ</button>
<button onclick="requireLogin(()=>showPage('myReports'));toggleMenu()">📋 بلاغاتي</button>
<button onclick="requireLogin(()=>openProfile());toggleMenu()">👤 حسابي</button>
<button onclick="requireLogin(()=>showPage('achievements'));toggleMenu()">🏆 إنجازاتي</button>
<button onclick="showPage('about');toggleMenu()">ℹ️ عن عون</button>

<div id="adminMenu"></div>
</div>

<main id="app"></main>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script>
/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ftamcnweyimjefjajhcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_z7cfsDCEV7Z3gmGD09oGpw_qEdd4WQM";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* =====================================================
   GLOBALS
===================================================== */

let currentUser=null;
let currentProfile=null;
let reports=[];
let reportMap=null;
let reportMarker=null;
let selectedLat=null;
let selectedLng=null;

/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function formatDate(date){
if(!date)return"—";
try{
return new Date(date).toLocaleDateString(
"ar-AE",
{
year:"numeric",
month:"long",
day:"numeric"
}
);
}catch{
return"—";
}
}

function showToast(message,type="success"){
const root=document.getElementById("toastRoot");

root.innerHTML=`
<div class="toast ${type}">
<span style="font-size:19px">
${type==="success"?"✓":"!"}
</span>
<span>${escapeHtml(message)}</span>
</div>
`;

setTimeout(()=>{
root.innerHTML="";
},3500);
}

function showModal(html){
document.getElementById("modalRoot").innerHTML=`
<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
<div class="modal">${html}</div>
</div>
`;
}

function closeModal(){
document.getElementById("modalRoot").innerHTML="";
}

function toggleMenu(){
document.getElementById("sideMenu").classList.toggle("hidden");
}

function requireLogin(callback){
if(!currentUser){
openAuth("login");
return;
}
callback();
}

/* =====================================================
   ROUTER
===================================================== */

function showPage(page){

document.getElementById("sideMenu").classList.add("hidden");

if(page==="home"){
renderHome();
return;
}

if(page==="report"){
renderReportPage();
return;
}

if(page==="myReports"){
renderMyReports();
return;
}

if(page==="achievements"){
renderAchievements();
return;
}

if(page==="about"){
renderAbout();
return;
}

if(page==="admin"){
requireLogin(()=>{
if(currentProfile?.role!=="admin"){
showToast("هذه الصفحة للمشرف فقط","error");
return;
}
renderAdmin();
});
return;
}

renderHome();
}

/* =====================================================
   HEADER
===================================================== */

function updateHeader(){

const root=document.getElementById("authHeader");
const admin=document.getElementById("adminMenu");

if(!currentUser){

root.innerHTML=`
<button class="primary" onclick="openAuth('login')">
دخول
</button>
`;

admin.innerHTML="";
return;
}

const name=
currentProfile?.full_name||
currentUser.user_metadata?.full_name||
"مستخدم عون";

root.innerHTML=`
<button
class="icon-btn"
title="حسابي"
onclick="openProfile()">
${escapeHtml(name.trim().charAt(0)||"ع")}
</button>
`;

if(currentProfile?.role==="admin"){
admin.innerHTML=`
<button onclick="showPage('admin');toggleMenu()">
🛠️ لوحة المشرف
</button>
`;
}else{
admin.innerHTML="";
}
}

/* =====================================================
   AUTH
===================================================== */

function openAuth(mode="login"){

showModal(`
<div class="modal-head">
<div>
<h2>مرحباً بك في عون</h2>
<p style="color:var(--muted);font-size:12px;margin-top:5px">
شارك في بناء مجتمع أكثر أماناً
</p>
</div>
<button class="close" onclick="closeModal()">×</button>
</div>

<div class="auth-tabs">
<button
id="loginTab"
class="${mode==="login"?"active":""}"
onclick="openAuth('login')">
تسجيل الدخول
</button>

<button
id="signupTab"
class="${mode==="signup"?"active":""}"
onclick="openAuth('signup')">
إنشاء حساب
</button>
</div>

<div id="authForm"></div>
`);

renderAuthForm(mode);
}

function renderAuthForm(mode){

const root=document.getElementById("authForm");

if(mode==="login"){

root.innerHTML=`

<div class="field">
<label>البريد الإلكتروني</label>
<input
id="authEmail"
type="email"
placeholder="example@email.com">
</div>

<div class="field">
<label>كلمة المرور</label>
<input
id="authPassword"
type="password"
placeholder="••••••••">
</div>

<button
class="primary"
style="width:100%"
onclick="login()">
تسجيل الدخول
</button>

`;

}else{

root.innerHTML=`

<div class="field">
<label>الاسم الكامل</label>
<input
id="authName"
placeholder="الاسم الكامل"
maxlength="80">
</div>

<div class="field">
<label>اسم المستخدم</label>
<input
id="authUsername"
placeholder="username"
maxlength="30">
</div>

<div class="field">
<label>البريد الإلكتروني</label>
<input
id="authEmail"
type="email"
placeholder="example@email.com">
</div>

<div class="field">
<label>رقم الهاتف</label>
<input
id="authPhone"
type="tel"
placeholder="05xxxxxxxx"
maxlength="25">
</div>

<div class="field">
<label>كلمة المرور</label>
<input
id="authPassword"
type="password"
placeholder="••••••••">
</div>

<button
class="primary"
style="width:100%"
onclick="signup()">
إنشاء الحساب
</button>

`;
}
}

async function login(){

const email=
document.getElementById("authEmail")?.value.trim();

const password=
document.getElementById("authPassword")?.value;

if(!email||!password){
showToast("أدخل البريد وكلمة المرور","error");
return;
}

const {error}=await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){
showToast(error.message||"تعذر تسجيل الدخول","error");
return;
}

closeModal();
showToast("تم تسجيل الدخول بنجاح ✓","success");
showPage("home");
}

async function signup(){

const full_name=
document.getElementById("authName")?.value.trim();

const username=
document.getElementById("authUsername")?.value.trim();

const email=
document.getElementById("authEmail")?.value.trim();

const phone=
document.getElementById("authPhone")?.value.trim();

const password=
document.getElementById("authPassword")?.value;

if(!full_name||!email||!password){
showToast("أكمل البيانات المطلوبة","error");
return;
}

if(password.length<6){
showToast("كلمة المرور يجب أن تكون 6 أحرف على الأقل","error");
return;
}

const {data,error}=
await supabaseClient.auth.signUp({
email,
password,
options:{
data:{
full_name,
username,
phone
}
}
});

if(error){
showToast(error.message||"تعذر إنشاء الحساب","error");
return;
}

if(data.user){

await supabaseClient
.from("profiles")
.upsert({
id:data.user.id,
full_name,
username,
email,
phone,
role:"user",
points:0
});
}

if(data.session){

closeModal();
showToast("تم إنشاء الحساب ✓","success");
}else{

showToast(
"تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتفعيل الحساب.",
"success"
);
}
}

/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

if(!currentUser)return;

const {data,error}=
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(!error&&data){

currentProfile=data;

}else{

currentProfile={
id:currentUser.id,
full_name:
currentUser.user_metadata?.full_name||
"مستخدم عون",
username:
currentUser.user_metadata?.username||"",

function initReportMap(){

if(reportMap){

try{
reportMap.remove();
}catch{}

reportMap=null;
reportMarker=null;
}

const el=document.getElementById("reportMap");

if(!el)return;

reportMap=
L.map(el).setView(
[24.2075,55.7447],
12
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(reportMap);

reportMap.on("click",e=>{
setReportLocation(
e.latlng.lat,
e.latlng.lng,
false
);
});

const type=
document.getElementById("reportType");

const desc=
document.getElementById("reportDescription");

type?.addEventListener("change",updateScorePreview);
desc?.addEventListener("input",updateScorePreview);
}

function setReportLocation(lat,lng,fromDevice=false){

selectedLat=lat;
selectedLng=lng;

if(reportMarker){

reportMarker.setLatLng([lat,lng]);

}else{

reportMarker=
L.marker(
[lat,lng],
{draggable:true}
).addTo(reportMap);

reportMarker.on("dragend",()=>{
const p=reportMarker.getLatLng();

selectedLat=p.lat;
selectedLng=p.lng;

updateLocationStatus();
});
}

if(reportMap){
reportMap.setView(
[lat,lng],
15
);
}

updateLocationStatus(
fromDevice?
"تم تحديد موقع جهازك":
"تم تحديد موقع المشكلة"
);
}

function updateLocationStatus(text){

const el=
document.getElementById("locationStatus");

if(!el)return;

if(text){
el.textContent=text;
return;
}

if(selectedLat&&selectedLng){
el.textContent="تم تحديد موقع المشكلة ✓";
}
}

function useMyLocation(){

if(!navigator.geolocation){

showToast(
"المتصفح لا يدعم تحديد الموقع",
"error"
);

return;
}

navigator.geolocation.getCurrentPosition(
position=>{

setReportLocation(
position.coords.latitude,
position.coords.longitude,
true
);

},
()=>{
showToast(
"تعذر الحصول على موقع جهازك. يمكنك تحديد الموقع من الخريطة.",
"error"
);
},
{
enableHighAccuracy:true,
timeout:10000,
maximumAge:0
}
);
}

/* =====================================================
   SCORE
===================================================== */

function analyzeIssue(type,description){

description=description||"";

let score=20;
let authority="الجهة المختصة";
let label="أولوية منخفضة";

if(type==="safety"){
score+=35;
authority="الجهة المختصة بالسلامة";
}

if(type==="road"){
score+=25;
authority="الجهة المختصة بالطرق";
}

if(type==="light"){
score+=18;
authority="الجهة المختصة بالإنارة";
}

if(type==="cleanliness"){
score+=12;
authority="الجهة المختصة بالنظافة";
}

if(type==="facility"){
score+=18;
authority="الجهة المختصة بالمرافق";
}

if(type==="accessibility"){
score+=25;
authority="الجهة المختصة بإتاحة الوصول";
}

if(type==="environment"){
score+=20;
authority="الجهة المختصة بالبيئة";
}

if(description.length>=100)score+=15;
else if(description.length>=50)score+=8;

const urgentWords=[
"خطر",
"حادث",
"حريق",
"مكشوف",
"سقوط",
"صعق",
"طارئ",
"خطير"
];

if(
urgentWords.some(
word=>description.includes(word)
)
){
score+=15;
}

score=Math.max(1,Math.min(100,score));

if(score>=75){
label="أولوية عالية";
}else if(score>=45){
label="أولوية متوسطة";
}else{
label="أولوية منخفضة";
}

return{
score,
label,
authority
};
}

function calculateContributionPoints(
type,
description,
hasPhoto,
matches
){

let total=5;
const breakdown=[];

breakdown.push({
label:"إرسال البلاغ",
points:5
});

if(selectedLat&&selectedLng){

total+=5;

breakdown.push({
label:"تحديد الموقع",
points:5
});
}

if((description||"").length>=100){

total+=5;

breakdown.push({
label:"وصف مفصل",
points:5
});

}else if((description||"").length>=40){

total+=3;

breakdown.push({
label:"وصف واضح",
points:3
});
}

if(hasPhoto){

total+=5;

breakdown.push({
label:"إضافة صورة",
points:5
});
}

if(type!=="other"){

total+=3;

breakdown.push({
label:"تحديد التصنيف",
points:3
});
}

if(matches===0){

total+=5;

breakdown.push({
label:"بلاغ جديد",
points:5
});

}else{

total+=2;

breakdown.push({
label:"تأكيد مشكلة موجودة",
points:2
});
}

return{
total,
breakdown
};
}

async function submitReport(){

if(!currentUser){

openAuth("login");
return;
}

const title=
document.getElementById("reportTitle")?.value.trim();

const type=
document.getElementById("reportType")?.value||"other";

const description=
document.getElementById("reportDescription")?.value.trim()||"";

const file=
document.getElementById("reportPhoto")?.files?.[0];

if(!title){

showToast(
"اكتب عنوان البلاغ",
"error"
);

return;
}

if(!selectedLat||!selectedLng){

showToast(
"حدد موقع المشكلة على الخريطة",
"error"
);

return;
}

const analysis=
analyzeIssue(type,description);

let photo_url=null;

if(file){

try{

const safeName=
`${currentUser.id}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,"_")}`;

const upload=
await supabaseClient
.storage
.from("reports")
.upload(
safeName,
file,
{
upsert:false,
contentType:file.type
}
);

if(upload.error){

console.log(upload.error);

showToast(
"تعذر رفع الصورة، سيتم إرسال البلاغ بدونها.",
"error"
);

}else{

const publicUrl=
supabaseClient
.storage
.from("reports")
.getPublicUrl(safeName);

photo_url=
publicUrl?.data?.publicUrl||null;
}

}catch(error){

console.log(error);

}
}

const {data:existing}=await supabaseClient
.from("reports")
.select("id,title,type,latitude,longitude")
.eq("type",type);

let matches=0;

if(existing){

matches=existing.filter(r=>{

if(!r.latitude||!r.longitude)return false;

const distance=
Math.sqrt(
Math.pow(
Number(r.latitude)-Number(selectedLat),
2
)+
Math.pow(
Number(r.longitude)-Number(selectedLng),
2
)
);

return distance<0.002;
}).length;
}

const contribution=
calculateContributionPoints(
type,
description,
!!photo_url,
matches
);

const newReport={

user_id:currentUser.id,

title,

type,

description,

latitude:selectedLat,

longitude:selectedLng,

score:analysis.score,

matches,

status:"قيد المراجعة",

has_photo:!!photo_url,

photo_url,

pointsEarned:contribution.total,

pointsBreakdown:contribution.breakdown

};

const {data,error}=
await supabaseClient
.from("reports")
.insert(newReport)
.select()
.maybeSingle();

if(error){

console.log(error);

showToast(
"تعذر إرسال البلاغ. تأكد من إعدادات جدول reports والصلاحيات.",
"error"
);

return;
}

if(data){

reports.unshift(data);
}

const oldPoints=
Number(currentProfile?.points||0);

const newPoints=
oldPoints+contribution.total;

try{

await supabaseClient
.from("profiles")
.update({
points:newPoints
})
.eq("id",currentUser.id);

}catch{}

currentProfile={
...(currentProfile||{}),
points:newPoints
};

updateHeader();

showModal(`

<div style="text-align:center">

<div style="font-size:55px;margin-bottom:10px">
🎉
</div>

<h2>تم إرسال البلاغ بنجاح</h2>

<p style="color:var(--muted);line-height:1.8;margin-top:8px">
شكراً لمساهمتك في خدمة المجتمع.
</p>

<div
class="card"
style="margin-top:18px">

<div style="font-size:13px;color:var(--muted)">
مكافأة مساهمتك
</div>

<div
style="font-size:38px;font-weight:950;color:var(--gold2);margin:5px 0">
+${contribution.total}
</div>

<div class="badge gold">
نقطة عون
</div>

<div
style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:14px">

${contribution.breakdown.map(
item=>`
<span class="meta">
${escapeHtml(item.label)} +${item.points}
</span>
`
).join("")}

</div>

</div>

<div class="actions" style="margin-top:15px">

</button>

selectedLat=null;

async function saveProfileChanges(){

const full_name=
document.getElementById("editFullName")
?.value.trim()||
"مستخدم عون";

const username=
document.getElementById("editUsername")
?.value.trim()||
"";

const phone=
document.getElementById("editPhone")
?.value.trim()||
"";

if(username.length>30){

showToast(
"اسم المستخدم طويل جداً",
"error"
);

return;
}

const {data,error}=
await supabaseClient
.from("profiles")
.update({
full_name,
username,
phone
})
.eq("id",currentUser.id)
.select()
.maybeSingle();

if(error){

showToast(
"تعذر حفظ البيانات. تأكد من إعدادات جدول profiles.",
"error"
);

console.log(error);

return;
}

currentProfile={
...(currentProfile||{}),
...(data||{}),
full_name,
username,
phone
};

try{

await supabaseClient.auth.updateUser({
data:{
full_name,
username,
phone
}
});

}catch{}

updateHeader();

showToast(
"تم تحديث بيانات حسابك ✓",
"success"
);

openProfile();
}

async function adminUpdateStatus(id,status){

const {error}=
await supabaseClient
.from("reports")
.update({
status,
updated_at:new Date().toISOString()
})
.eq("id",id);

if(error){

showToast(
"تعذر تحديث حالة البلاغ",
"error"
);

console.log(error);

return;
}

const r=
reports.find(x=>x.id===id);

if(r){
r.status=status;
}

showToast(
"تم تحديث حالة البلاغ ✓",
"success"
);

renderAdmin();
}

async function logout(){

currentUser=null;
currentProfile=null;

);

/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
async(event,session)=>{

currentUser=
session?.user||null;

if(currentUser){

await loadProfile();

}else{

currentProfile=null;
reports=[];

updateHeader();
}
});

/* =====================================================
   START
===================================================== */

async function startApp(){

const {data}=
await supabaseClient.auth.getSession();

currentUser=
data?.session?.user||null;

if(currentUser){
await loadProfile();
}else{
updateHeader();
}

showPage("home");
}

startApp();
