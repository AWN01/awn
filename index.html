<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f0e">
<meta name="description" content="عون — منصة ذكية لخدمة المجتمع">
<link rel="manifest" href="manifest.json">
<title>عون | معاً.. لمجتمع أكثر أماناً</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

:root{
 --bg:#080b0a;
 --panel:#101513;
 --panel2:#151b18;
 --border:rgba(255,255,255,.09);
 --gold:#c9a24e;
 --gold2:#e6c86a;
 --green:#4fae78;
 --red:#ff5f61;
 --orange:#ff9f43;
 --blue:#4fae78;
 --text:#f4f5f4;
 --muted:#9da5a1;
 --shadow:0 20px 60px rgba(0,0,0,.35);
}

html,body{
 min-height:100%;
 background:
 radial-gradient(circle at 20% 0%,rgba(201,162,78,.08),transparent 28%),
 radial-gradient(circle at 100% 20%,rgba(201,162,78,.07),transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
}

body{
 overflow-x:hidden;
}

button,input,textarea,select{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}

/* HEADER */

header{
 position:sticky;
 top:0;
 z-index:1000;
 height:76px;
 background:rgba(8,11,10,.88);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--border);
}

.nav{
 height:100%;
 max-width:1250px;
 margin:auto;
 padding:0 18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.logo{
 display:flex;
 align-items:center;
 gap:11px;
 cursor:pointer;
}

.logo-mark{
 width:48px;
 height:48px;
 border-radius:13px;
 background:transparent;
 display:grid;
 place-items:center;
 overflow:hidden;
 flex-shrink:0;
}

.logo-mark img{
 width:100%;
 height:100%;
 object-fit:contain;
 display:block;
}

.logo-text strong{
 display:block;
 font-size:20px;
 letter-spacing:.5px;
}

.logo-text small{
 color:var(--muted);
 font-size:10px;
}

.nav-actions{
 display:flex;
 align-items:center;
 gap:8px;
}

.icon-btn{
 width:44px;
 height:44px;
 border-radius:13px;
 border:1px solid var(--border);
 background:rgba(255,255,255,.035);
 color:white;
 display:grid;
 place-items:center;
 font-size:20px;
}

.primary{
 border:0;
 color:#10100d;
 font-weight:800;
 background:linear-gradient(135deg,var(--gold2),var(--gold));
 padding:13px 19px;
 border-radius:13px;
 box-shadow:0 10px 25px rgba(201,162,78,.12);
}

.secondary{
 border:1px solid var(--border);
 color:white;
 background:rgba(255,255,255,.04);
 padding:12px 17px;
 border-radius:13px;
}

.menu{
 position:fixed;
 top:84px;
 right:12px;
 width:min(330px,calc(100vw - 24px));
 max-height:calc(100vh - 98px);
 overflow:auto;
 z-index:2000;
 background:rgba(15,20,18,.98);
 border:1px solid rgba(255,255,255,.11);
 border-radius:22px;
 padding:12px;
 box-shadow:var(--shadow);
}

.menu-item{
 width:100%;
 border:0;
 background:transparent;
 color:white;
 text-align:right;
 padding:15px;
 border-radius:13px;
 display:flex;
 align-items:center;
 gap:12px;
}

.menu-item:hover{
 background:rgba(255,255,255,.06);
}

.menu-item span:first-child{
 width:35px;
 text-align:center;
 font-size:20px;
}

.menu-sep{
 height:1px;
 background:var(--border);
 margin:8px 0;
}

/* HERO */

.hero{
 max-width:1250px;
 margin:auto;
 padding:55px 18px 25px;
}

.hero-grid{
 display:grid;
 grid-template-columns:1.35fr .65fr;
 gap:22px;
}

.hero-main{
 min-height:430px;
 padding:45px;
 border-radius:30px;
 border:1px solid var(--border);
 background:
 linear-gradient(135deg,rgba(201,162,78,.11),transparent 45%),
 linear-gradient(160deg,#121815,#0d1110);
 position:relative;
 overflow:hidden;
}

.hero-logo{
 display:flex;
 justify-content:center;
 align-items:center;
 margin:0 auto 18px;
 position:relative;
 z-index:2;
}

.hero-logo img{
 width:118px;
 height:118px;
 object-fit:contain;
 display:block;
}

.hero-main:after{
 content:"";
 position:absolute;
 width:300px;
 height:300px;
 border-radius:50%;
 border:1px solid rgba(201,162,78,.12);
 left:-120px;
 bottom:-150px;
 box-shadow:0 0 0 50px rgba(201,162,78,.025),
 0 0 0 100px rgba(201,162,78,.018);
}

.badge{
 display:inline-flex;
 align-items:center;
 gap:7px;
 border:1px solid rgba(201,162,78,.25);
 color:var(--gold2);
 background:rgba(201,162,78,.07);
 border-radius:100px;
 padding:8px 13px;
 font-size:12px;
 margin-bottom:22px;
}

.hero h1{
 font-size:clamp(42px,7vw,76px);
 line-height:.95;
 margin-bottom:20px;
 letter-spacing:-3px;
}

.hero h1 em{
 color:var(--gold2);
 font-style:normal;
}

.hero p{
 max-width:620px;
 color:#bac0bd;
 font-size:17px;
 line-height:1.9;
 margin-bottom:28px;
}

.hero-buttons{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
}

.hero-side{
 display:grid;
 gap:14px;
}

.mini-card{
 border:1px solid var(--border);
 background:linear-gradient(145deg,#131917,#0e1210);
 border-radius:24px;
 padding:24px;
 min-height:130px;
}

.mini-card .num{
 font-size:35px;
 font-weight:900;
 color:var(--gold2);
 margin-top:10px;
}

.mini-card small{
 color:var(--muted);
}

/* SECTIONS */

.container{
 max-width:1250px;
 margin:auto;
 padding:25px 18px 70px;
}

.section{
 margin-top:28px;
}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:15px;
 margin-bottom:16px;
}

.section-head h2{
 font-size:26px;
}

.section-head p{
 color:var(--muted);
 margin-top:4px;
 font-size:13px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.card{
 background:linear-gradient(145deg,#121816,#0d1110);
 border:1px solid var(--border);
 border-radius:22px;
 padding:22px;
}

.feature{
 min-height:170px;
 transition:.2s;
}

.feature:hover{
 transform:translateY(-3px);
 border-color:rgba(201,162,78,.22);
}

.feature-icon{
 width:52px;
 height:52px;
 display:grid;
 place-items:center;
 border-radius:15px;
 background:rgba(201,162,78,.09);
 font-size:25px;
 margin-bottom:17px;
}

.feature h3{
 margin-bottom:8px;
}

.feature p{
 color:var(--muted);
 font-size:13px;
 line-height:1.7;
}

/* STATS */

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
}

.stat{
 padding:20px;
 border:1px solid var(--border);
 border-radius:20px;
 background:rgba(255,255,255,.025);
}

.stat .value{
 font-size:32px;
 font-weight:900;
 margin-top:8px;
}

.stat .label{
 color:var(--muted);
 font-size:12px;
}

/* FORMS */

.form{
 max-width:700px;
 margin:auto;
}

.field{
 margin-bottom:15px;
}

.field label{
 display:block;
 font-size:13px;
 color:#cfd4d1;
 margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 border:1px solid var(--border);
 background:#0b0f0d;
 color:white;
 border-radius:14px;
 padding:14px;
 outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
 border-color:rgba(201,162,78,.5);
}

.field textarea{
 min-height:125px;
 resize:vertical;
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.actions{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:10px;
}

/* SCORE */

.score-box{
 padding:25px;
 border-radius:23px;
 background:linear-gradient(145deg,#171b18,#0e1210);
 border:1px solid var(--border);
 text-align:center;
 margin:18px 0;
}

.score-circle{
 width:140px;
 height:140px;
 margin:10px auto 15px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:
 conic-gradient(var(--gold2) var(--score,70%),rgba(255,255,255,.08) 0);
 position:relative;
}

.score-circle:before{
 content:"";
 position:absolute;
 width:112px;
 height:112px;
 border-radius:50%;
 background:#0d1110;
}

.score-number{
 position:relative;
 font-size:38px;
 font-weight:900;
}

.score-label{
 color:var(--muted);
}

/* REPORT CARDS */

.report-list{
 display:grid;
 gap:12px;
}

.report{
 border:1px solid var(--border);
 background:linear-gradient(145deg,#131816,#0d1110);
 border-radius:21px;
 padding:18px;
}

.report-top{
 display:flex;
 align-items:flex-start;
 justify-content:space-between;
 gap:10px;
}

.report-title{
 font-weight:800;
 font-size:17px;
}

.report-type{
 color:var(--gold2);
 font-size:12px;
 margin-top:4px;
}

.status{
 padding:7px 10px;
 border-radius:100px;
 background:rgba(201,162,78,.1);
 color:#e6c86a;
 font-size:11px;
 white-space:nowrap;
}

.status.done{
 background:rgba(201,162,78,.1);
 color:#6fd3a0;
}

.status.critical{
 background:rgba(255,95,97,.1);
 color:#ff797b;
}

.report-desc{
 color:var(--muted);
 font-size:13px;
 line-height:1.7;
 margin:13px 0;
}

.report-meta{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
}

.meta{
 border:1px solid var(--border);
 padding:7px 10px;
 border-radius:10px;
 font-size:11px;
 color:#bbc1be;
}

.score-pill{
 font-weight:900;
 padding:7px 10px;
 border-radius:10px;
}

.score-high{
 color:#ff7779;
 background:rgba(255,95,97,.09);
}

.score-med{
 color:#e6b35b;
 background:rgba(255,159,67,.09);
}

.score-low{
 color:#6fd3a0;
 background:rgba(201,162,78,.09);
}

/* MAP */

.map{
 width:100%;
 height:470px;
 border-radius:22px;
 overflow:hidden;
 border:1px solid var(--border);
 background:#101513;
}

.map-tools{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-bottom:12px;
}

.filter{
 border:1px solid var(--border);
 background:rgba(255,255,255,.04);
 color:white;
 padding:9px 12px;
 border-radius:11px;
 font-size:12px;
}

.filter.active{
 background:rgba(201,162,78,.13);
 color:var(--gold2);
 border-color:rgba(201,162,78,.3);
}

/* TIMELINE */

.timeline{
 position:relative;
 padding-right:25px;
}

.timeline:before{
 content:"";
 position:absolute;
 right:8px;
 top:5px;
 bottom:5px;
 width:2px;
 background:rgba(201,162,78,.15);
}

.timeline-item{
 position:relative;
 padding:0 0 22px 0;
}

.timeline-dot{
 position:absolute;
 right:-22px;
 top:2px;
 width:14px;
 height:14px;
 border-radius:50%;
 background:var(--gold2);
 box-shadow:0 0 0 5px rgba(201,162,78,.08);
}

/* EMPTY */

.empty{
 text-align:center;
 padding:45px 20px;
 color:var(--muted);
 border:1px dashed var(--border);
 border-radius:20px;
}

.e-icon{
 font-size:40px;
 margin-bottom:10px;
}

/* MODAL */

.modal-back{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 backdrop-filter:blur(8px);
 z-index:5000;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
}

.modal{
 width:min(520px,100%);
 max-height:90vh;
 overflow:auto;
 background:#101513;
 border:1px solid var(--border);
 border-radius:25px;
 padding:25px;
 box-shadow:var(--shadow);
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:18px;
}

.modal-close{
 width:38px;
 height:38px;
 border:1px solid var(--border);
 background:rgba(255,255,255,.04);
 color:white;
 border-radius:11px;
}

/* TOAST */

.toast{
 position:fixed;
 left:50%;
 bottom:25px;
 transform:translateX(-50%);
 z-index:7000;
 background:#151b18;
 border:1px solid var(--border);
 border-radius:15px;
 padding:13px 17px;
 display:flex;
 align-items:center;
 gap:10px;
 box-shadow:var(--shadow);
 min-width:220px;
 justify-content:center;
}

.toast.success{
 border-color:rgba(201,162,78,.25);
}

.toast.error{
 border-color:rgba(255,95,97,.3);
}

/* ADMIN */

.dashboard{
 display:grid;
 grid-template-columns:230px 1fr;
 gap:18px;
}

.sidebar{
 border:1px solid var(--border);
 background:#101513;
 border-radius:22px;
 padding:12px;
 height:max-content;
 position:sticky;
 top:95px;
}

.side-item{
 width:100%;
 padding:13px;
 border:0;
 background:transparent;
 color:white;
 text-align:right;
 border-radius:12px;
 margin-bottom:5px;
}

.side-item.active,
.side-item:hover{
 background:rgba(201,162,78,.1);
 color:var(--gold2);
}

.admin-content{
 min-width:0;
}

.table-wrap{
 overflow:auto;
 border:1px solid var(--border);
 border-radius:20px;
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:700px;
}

th,td{
 padding:13px;
 text-align:right;
 border-bottom:1px solid var(--border);
 font-size:12px;
}

th{
 color:var(--gold2);
 background:rgba(255,255,255,.025);
}

td{
 color:#d4d8d6;
}

.desktop-login{
 display:block;
}

@media(max-width:850px){

 .hero-grid{
  grid-template-columns:1fr;
 }

 .grid{
  grid-template-columns:1fr 1fr;
 }

 .stats{
  grid-template-columns:1fr 1fr;
 }

 .dashboard{
  grid-template-columns:1fr;
 }

 .sidebar{
  position:static;
 }

 .hero-main{
  padding:30px 22px;
 }

 .hero-logo img{
  width:100px;
  height:100px;
 }

}

@media(max-width:560px){

 .grid{
  grid-template-columns:1fr;
 }

 .row{
  grid-template-columns:1fr;
 }

 .logo-text small{
  display:none;
 }

 .desktop-login{
  display:none;
 }

 .hero{
  padding-top:25px;
 }

 .hero h1{
  font-size:48px;
 }

 .hero p{
  font-size:15px;
 }

 .stats{
  grid-template-columns:1fr 1fr;
 }

 .mini-card{
  min-height:110px;
  padding:18px;
 }

}
</style>
</head>

</div>

<script>

function toggleMenu(){
 document
 .getElementById("menu")
 .classList.toggle("hidden");
}

function goHome(){
 showPage("home");
}

function showPage(page){

 document
 .getElementById("menu")
 .classList.add("hidden");

 if(page==="home")
  renderHome();

 else if(page==="map")
  renderMapPage();

 else if(page==="assistant")
  renderAssistant();

 else if(page==="pulse")
  renderPulse();

 else if(page==="myreports")
  renderMyReports();

 else if(page==="achievements")
  renderAchievements();

 else if(page==="admin")
  renderAdmin();

 else if(page==="report")
  renderReportPage();

}

function renderHome(){

 document.getElementById("app").innerHTML=`

 <section class="hero">

    </div>

     </div>

   </div>

  </div>

 </section>

 <section class="container">

  <div class="section-head">

function scoreReport(type,description){

 let score=30;

 const text=
 (description||"").toLowerCase();

 if(type==="safety")
  score+=30;

 if(type==="road")
  score+=20;

 if(type==="streetlight")
  score+=15;

 if(type==="accessibility")
  score+=20;

 if(
  text.includes("خطر")||
  text.includes("حادث")||
  text.includes("عاجل")
 )
  score+=20;

 if(text.length>100)
  score+=5;

 return Math.min(100,score);
}

function initMap(){

 if(mapInstance){

  mapInstance.remove();
  mapInstance=null;

 }

 const map=
 document.getElementById("map");

 if(
  !map||
  typeof L==="undefined"
 )
  return;

 mapInstance=
 L.map(map)
 .setView(
  [24.2075,55.7447],
  11
 );

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   attribution:"© OpenStreetMap"
  }
 )
 .addTo(mapInstance);

 const valid=
 reports.filter(
  r=>r.lat&&r.lng
 );

 valid.forEach(r=>{

  L.marker([
   r.lat,
   r.lng
  ])
  .addTo(mapInstance)
  .bindPopup(`
   <strong>
    ${escapeHtml(r.title||"بلاغ")}
   </strong>
   <br>
   ${escapeHtml(r.description||"")}
   <br>
   <b>${r.score||0}/100</b>
  `);

 });

}

function filterMap(level,button){

 document
 .querySelectorAll(".filter")
 .forEach(
  x=>x.classList.remove("active")
 );

 button.classList.add("active");

 if(!mapInstance)
  return;

 mapInstance.eachLayer(
  layer=>{

   if(layer instanceof L.Marker)
    mapInstance.removeLayer(layer);

  }
 );

 reports
 .filter(
  r=>
   r.lat&&
   r.lng&&
   (
    level==="all"||
    (
     level==="high"&&
     r.score>=80
    )||
    (
     level==="medium"&&
     r.score>=50&&
     r.score<80
    )||
    (
     level==="low"&&
     r.score<50
    )
   )
 )
 .forEach(r=>{

  L.marker([
   r.lat,
   r.lng
  ])
  .addTo(mapInstance)
  .bindPopup(`
   <strong>
    ${escapeHtml(r.title||"بلاغ")}
   </strong>
   <br>
   ${r.score||0}/100
  `);

 });

}

 reports.find(

   .toISOString();

 }

 try{

  await supabaseClient
   .from("reports")
   .update({

     new Date().toISOString()
   })

 }catch(err){

/* MODALS / TOAST */

function showModal(html){

 document.getElementById(
  "modalRoot"
 ).innerHTML=`

 <div
  class="modal-back"
  onclick="modalOutside(event)">

  <div class="modal">
   ${html}
  </div>

 </div>

 `;

}

function modalOutside(e){

 if(
  e.target.classList
  .contains("modal-back")
 )
  closeModal();

}

function closeModal(){

 document.getElementById(
  "modalRoot"
 ).innerHTML="";

}

function showToast(
 message,
 type="success"
){

 const root=
 document.getElementById(
  "toastRoot"
 );

 root.innerHTML=`

 <div class="toast ${type}">

  <span style="font-size:19px">
   ${
    type==="success"
    ?"✓"
    :
    "!"
   }
  </span>

  <span>
   ${escapeHtml(message)}
  </span>

 </div>

 `;

 setTimeout(
  ()=>{
   root.innerHTML="";
  },
  3500
 );

}

function requireLogin(callback){

 if(!currentUser){

  openAuth("login");
  return;

 }

 callback();

}

/* HELPERS */

function formatDate(date){

 if(!date)
  return "—";

 try{

  return new Date(date)
  .toLocaleDateString(
   "ar-AE",
   {
    year:"numeric",
    month:"short",
    day:"numeric"
   }
  );

 }catch{

  return "—";

 }

}

function escapeHtml(value){

 return String(value??"")
 .replace(
  /&/g,
  "&amp;"
 )
 .replace(
  /</g,
  "&lt;"
 )
 .replace(
  />/g,
  "&gt;"
 )
 .replace(
  /"/g,
  "&quot;"
 )
 .replace(
  /'/g,
  "&#039;"
 );

}

 showPage;

showPage=function(page){
