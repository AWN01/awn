<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="عون — منصة ذكية لخدمة المجتمع">
<link rel="manifest" href="manifest.json">
<title>عون | معاً.. لمجتمع أكثر أماناً</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

:root{
 --bg:#ffffff;
 --panel:#ffffff;
 --panel2:#f5faf7;
 --border:#dfe9e3;
 --gold:#d9ad42;
 --gold2:#f1cc69;
 --green:#198754;
 --green2:#2fa36b;
 --red:#dc3545;
 --orange:#f59f00;
 --blue:#3182ce;
 --text:#14231b;
 --muted:#66756d;
 --shadow:0 15px 45px rgba(25,135,84,.10);
}

html,body{
 min-height:100%;
 background:#ffffff;
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
}

body{
 overflow-x:hidden;
}

button,input,textarea,select{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}

/* HEADER */

header{
 position:sticky;
 top:0;
 z-index:1000;
 height:76px;
 background:rgba(255,255,255,.94);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--border);
}

.nav{
 height:100%;
 max-width:1250px;
 margin:auto;
 padding:0 18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.logo{
 display:flex;
 align-items:center;
 gap:11px;
 cursor:pointer;
}

.logo-mark{
 width:43px;
 height:43px;
 border-radius:13px;
 background:linear-gradient(145deg,#198754,#2fa36b);
 color:#fff;
 display:grid;
 place-items:center;
 font-size:23px;
 font-weight:900;
 box-shadow:0 8px 25px rgba(25,135,84,.18);
}

.logo-text strong{
 display:block;
 font-size:20px;
 letter-spacing:.5px;
 color:#173d2b;
}

.logo-text small{
 color:var(--muted);
 font-size:10px;
}

.nav-actions{
 display:flex;
 align-items:center;
 gap:8px;
}

.nav-actions button{
 border:1px solid var(--border);
 background:#fff;
 color:var(--text);
 border-radius:13px;
 min-width:44px;
 height:44px;
}

.primary{
 border:0!important;
 background:linear-gradient(135deg,#198754,#2fa36b)!important;
 color:#fff!important;
 padding:12px 18px;
 border-radius:14px;
 font-weight:800;
 box-shadow:0 8px 20px rgba(25,135,84,.15);
}

.secondary{
 border:1px solid var(--border);
 background:#fff;
 color:var(--text);
 padding:12px 18px;
 border-radius:14px;
 font-weight:700;
}

.menu{
 position:absolute;
 top:68px;
 left:18px;
 right:18px;
 max-width:350px;
 margin-left:auto;
 background:#fff;
 border:1px solid var(--border);
 border-radius:20px;
 box-shadow:var(--shadow);
 padding:8px;
}

.menu-item{
 width:100%;
 display:flex;
 align-items:center;
 gap:12px;
 padding:13px;
 border:0;
 background:transparent;
 color:var(--text);
 border-radius:12px;
 text-align:right;
}

.menu-item:hover{
 background:var(--panel2);
}

.container{
 max-width:1180px;
 margin:auto;
 padding:0 18px;
}

.section{
 padding:55px 0;
}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:20px;
 margin-bottom:22px;
}

.section-head h2{
 font-size:27px;
 color:#173d2b;
}

.section-head p{
 color:var(--muted);
 font-size:13px;
 margin-top:7px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:22px;
 padding:22px;
 box-shadow:0 8px 25px rgba(25,135,84,.045);
}

.feature{
 min-height:170px;
 transition:.2s;
}

.feature:hover{
 transform:translateY(-3px);
 border-color:rgba(25,135,84,.30);
}

.feature-icon{
 width:52px;
 height:52px;
 display:grid;
 place-items:center;
 border-radius:15px;
 background:rgba(25,135,84,.09);
 font-size:25px;
 margin-bottom:17px;
}

.feature h3{
 margin-bottom:8px;
 color:#173d2b;
}

.feature p{
 color:var(--muted);
 font-size:13px;
 line-height:1.7;
}

/* STATS */

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
}

.stat{
 padding:20px;
 border:1px solid var(--border);
 border-radius:20px;
 background:#fff;
}

.stat .value{
 font-size:32px;
 font-weight:900;
 margin-top:8px;
 color:var(--green);
}

.stat .label{
 color:var(--muted);
 font-size:12px;
}

/* FORMS */

.form{
 max-width:700px;
 margin:auto;
}

.field{
 margin-bottom:15px;
}

.field label{
 display:block;
 font-size:13px;
 color:#314139;
 margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 border:1px solid var(--border);
 background:#fff;
 color:var(--text);
 border-radius:14px;
 padding:13px;
 outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
 border-color:rgba(25,135,84,.55);
 box-shadow:0 0 0 3px rgba(25,135,84,.08);
}

.field textarea{
 min-height:120px;
 resize:vertical;
 line-height:1.7;
}

.actions{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
}

.actions button{
 flex:1;
 min-width:130px;
}

/* HERO */

.hero{
 position:relative;
 overflow:hidden;
 padding:75px 18px 65px;
 background:
 radial-gradient(circle at 10% 10%,rgba(25,135,84,.10),transparent 30%),
 radial-gradient(circle at 90% 30%,rgba(25,135,84,.07),transparent 28%),
 linear-gradient(180deg,#ffffff,#f7fbf8);
 border-bottom:1px solid var(--border);
}

.hero-grid{
 max-width:1180px;
 margin:auto;
 display:grid;
 grid-template-columns:1.35fr .65fr;
 gap:35px;
 align-items:center;
}

.hero-main{
 text-align:right;
}

.badge{
 display:inline-flex;
 align-items:center;
 gap:7px;
 padding:8px 13px;
 border-radius:30px;
 background:rgba(25,135,84,.08);
 border:1px solid rgba(25,135,84,.16);
 color:var(--green);
 font-size:12px;
 font-weight:800;
 margin-bottom:18px;
}

.hero h1{
 font-size:clamp(42px,7vw,76px);
 line-height:1.08;
 letter-spacing:-2px;
 color:#173d2b;
}

.hero h1 em{
 color:var(--green);
 font-style:normal;
}

.hero p{
 max-width:680px;
 color:var(--muted);
 font-size:16px;
 line-height:2;
 margin-top:18px;
}

.hero-buttons{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:25px;
}

.hero-buttons button{
 min-height:52px;
}

.hero-side{
 display:grid;
 gap:12px;
}

.mini-card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:22px;
 padding:22px;
 box-shadow:0 10px 30px rgba(25,135,84,.06);
}

.mini-card small{
 color:var(--muted);
 font-size:12px;
}

.mini-card .num{
 margin-top:8px;
 font-size:35px;
 font-weight:900;
 color:var(--green);
}

/* MODAL */

.modal-overlay{
 position:fixed;
 inset:0;
 z-index:3000;
 background:rgba(8,20,13,.45);
 backdrop-filter:blur(7px);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
}

.modal{
 width:min(680px,100%);
 max-height:90vh;
 overflow:auto;
 background:#fff;
 border-radius:25px;
 border:1px solid var(--border);
 box-shadow:0 30px 80px rgba(0,0,0,.20);
 padding:22px;
}

.modal-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 margin-bottom:20px;
}

.modal-head h2{
 color:#173d2b;
}

.close{
 width:42px;
 height:42px;
 border-radius:12px;
 border:1px solid var(--border);
 background:#fff;
 color:var(--text);
 font-size:25px;
}

/* TOAST */

.toast{
 position:fixed;
 left:18px;
 right:18px;
 bottom:22px;
 z-index:5000;
 max-width:700px;
 margin:auto;
 padding:16px 18px;
 background:#14231b;
 color:#fff;
 border-radius:16px;
 box-shadow:0 15px 40px rgba(0,0,0,.22);
 border:1px solid rgba(255,255,255,.12);
}

.toast.error{
 border-color:rgba(220,53,69,.55);
}

.toast.success{
 border-color:rgba(25,135,84,.55);
}

/* REPORT MAP */

#reportMap,
#map{
 width:100%;
 min-height:350px;
 border-radius:20px;
 overflow:hidden;
 border:1px solid var(--border);
}

.location-box{
 margin-top:15px;
 padding:15px;
 background:#f7fbf8;
 border:1px solid var(--border);
 border-radius:17px;
}

.location-box button{
 width:100%;
 margin-top:10px;
}

/* RESPONSIVE */

@media(max-width:850px){

 .hero-grid{
  grid-template-columns:1fr;
 }

 .hero-main{
  text-align:center;
 }

 .hero p{
  margin-left:auto;
  margin-right:auto;
 }

 .hero-buttons{
  justify-content:center;
 }

 .grid{
  grid-template-columns:1fr;
 }

 .stats{
  grid-template-columns:repeat(2,1fr);
 }

}

@media(max-width:520px){

 header{
  height:68px;
 }

 .nav{
  padding:0 12px;
 }

 .logo-text strong{
  font-size:17px;
 }

 .logo-text small{
  font-size:9px;
 }

 .hero{
  padding-top:50px;
 }

 .hero h1{
  font-size:46px;
 }

 .section{
  padding:38px 0;
 }

 .stats{
  grid-template-columns:1fr 1fr;
 }

 .stat{
  padding:15px;
 }

 .stat .value{
  font-size:27px;
 }

}

/* HOME GREEN THEME */

.home-green{
 background:#fff;
}

.home-green .home-brand{
 width:105px;
 height:105px;
 object-fit:contain;
 display:block;
 margin:0 auto 20px;
 border-radius:25px;
}

.home-green .hero{
 background:
 radial-gradient(circle at 0% 0%,rgba(25,135,84,.08),transparent 32%),
 radial-gradient(circle at 100% 50%,rgba(25,135,84,.06),transparent 35%),
 #fff;
}

.home-green .hero-main{
 text-align:center;
}

.home-green .hero-grid{
 grid-template-columns:1fr;
 max-width:900px;
}

.home-green .hero-side{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 max-width:900px;
 margin:20px auto 0;
 width:100%;
}

.home-green .mini-card{
 text-align:center;
}

.home-green .home-title{
 font-size:clamp(40px,7vw,72px);
 color:#173d2b;
 line-height:1.15;
}

.home-green .home-title em{
 color:var(--green);
}

.home-green .home-subtitle{
 max-width:760px;
 margin:18px auto 0;
 color:#66756d;
 line-height:2;
 font-size:16px;
}

.home-green .home-actions{
 justify-content:center;
}

.home-green .home-section-title{
 text-align:center;
}

.home-green .home-section-title h2{
 color:#173d2b;
}

.home-green .green-feature{
 border-color:#dfe9e3;
 background:#fff;
}

.home-green .green-feature:hover{
 border-color:rgba(25,135,84,.35);
 box-shadow:0 12px 35px rgba(25,135,84,.08);
}

.home-green .green-feature .feature-icon{
 background:rgba(25,135,84,.08);
}

.home-green .home-cta{
 background:linear-gradient(135deg,#f4faf6,#fff);
 border:1px solid #dfe9e3;
 border-radius:28px;
 padding:35px 22px;
 text-align:center;
}

.home-green .home-cta h2{
 color:#173d2b;
 margin-bottom:10px;
}

.home-green .home-cta p{
 color:var(--muted);
 line-height:1.8;
 margin-bottom:20px;
}

@media(max-width:650px){

 .home-green .hero-side{
  grid-template-columns:1fr;
 }

 .home-green .hero-side .mini-card{
  padding:16px;
 }

}

/* REPORT PAGE */

.awn-report-page{
 max-width:760px;
 margin:auto;
 padding:25px 16px 50px;
}

.awn-report-head{
 text-align:center;
 margin-bottom:22px;
}

.awn-report-head .icon{
 width:62px;
 height:62px;
 margin:0 auto 12px;
 border-radius:20px;
 display:grid;
 place-items:center;
 background:rgba(25,135,84,.10);
 border:1px solid rgba(25,135,84,.20);
 font-size:30px;
}

.awn-report-head h2{
 font-size:27px;
 margin-bottom:7px;
 color:#173d2b;
}

.awn-report-head p{
 color:var(--muted);
 font-size:13px;
 line-height:1.8;
}

.awn-report-card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:24px;
 padding:20px;
 margin-bottom:14px;
 box-shadow:0 10px 30px rgba(25,135,84,.05);
}

.awn-field{
 margin-bottom:17px;
}

.awn-field:last-child{
 margin-bottom:0;
}

.awn-field label{
 display:block;
 font-size:13px;
 font-weight:700;
 margin-bottom:8px;
}

.awn-field input,
.awn-field textarea,
.awn-field select{
 width:100%;
 border:1px solid var(--border);
 background:#fff;
 color:var(--text);
 border-radius:15px;
 padding:14px;
 outline:none;
}

.awn-field textarea{
 min-height:120px;
 resize:vertical;
 line-height:1.7;
}

.awn-field input:focus,
.awn-field textarea:focus,
.awn-field select:focus{
 border-color:rgba(25,135,84,.55);
}

.awn-upload{
 border:1px dashed rgba(25,135,84,.35);
 background:rgba(25,135,84,.045);
 padding:16px;
 border-radius:16px;
}

.awn-location-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:7px;
}

.awn-location-title h3{
 font-size:17px;
 color:#173d2b;
}

.awn-location-help{
 color:var(--muted);
 font-size:12px;
 line-height:1.7;
 margin-bottom:13px;
}

.awn-location-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-top:12px;
}

.awn-location-status{
 color:var(--muted);
 font-size:12px;
}

.awn-score{
 text-align:center;
 padding:23px 15px;
 border-radius:22px;
 background:linear-gradient(145deg,rgba(25,135,84,.07),rgba(25,135,84,.025));
 border:1px solid rgba(25,135,84,.18);
}

.awn-score-title{
 color:var(--muted);
 font-size:12px;
 margin-bottom:7px;
}

.awn-score-number{
 font-size:48px;
 font-weight:900;
 line-height:1;
 color:var(--green);
}

.awn-score-number small{
 font-size:20px;
 color:var(--muted);
}

.awn-score-label{
 margin-top:10px;
 display:inline-block;
 padding:7px 13px;
 border-radius:30px;
 color:var(--green);
 background:rgba(25,135,84,.08);
 border:1px solid rgba(25,135,84,.20);
 font-size:12px;
}

.awn-report-actions{
 display:grid;
 gap:10px;
}

.awn-report-actions button{
 width:100%;
 min-height:54px;
 border-radius:17px;
 font-weight:800;
}

.awn-submit{
 border:0;
 background:linear-gradient(135deg,#198754,#2fa36b);
 color:#fff;
 box-shadow:0 10px 25px rgba(25,135,84,.16);
}

.awn-cancel{
 border:1px solid var(--border);
 background:#fff;
 color:var(--text);
}

/* PULSE */

.pulse-card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:24px;
 padding:22px;
 box-shadow:0 10px 30px rgba(25,135,84,.05);
}

.pulse-progress{
 height:11px;
 border-radius:100px;
 background:#e9f0ec;
 overflow:hidden;
}

.pulse-progress > div{
 height:100%;
 border-radius:100px;
 background:linear-gradient(90deg,#198754,#2fa36b);
}

/* FOOTER */

footer{
 margin-top:50px;
 padding:30px 18px;
 text-align:center;
 background:#f7fbf8;
 border-top:1px solid var(--border);
 color:var(--muted);
}

footer strong{
 color:#173d2b;
}

</style>
</head>

<body>

<header>

 <div class="nav">

  <div class="logo" onclick="goHome()">

   <div class="logo-mark">ع</div>

   <div class="logo-text">
    <strong>عون</strong>
    <small>معاً.. لمجتمع أكثر أماناً</small>
   </div>

  </div>

  <div class="nav-actions">

   <button
    type="button"
    onclick="toggleMenu()"
   >
    ☰
   </button>

   <button
    type="button"
    onclick="openAuth('login')"
    id="loginNavButton"
   >
    دخول
   </button>

  </div>

 </div>

 <div
  id="menu"
  class="menu hidden"
 >

  <button
   class="menu-item"
   onclick="goHome();toggleMenu()"
  >
   <span>🏠</span>
   <span>الرئيسية</span>
  </button>

  <button
   class="menu-item"
   onclick="requireLogin(openReport);toggleMenu()"
  >
   <span>📢</span>
   <span>رفع بلاغ</span>
  </button>

  <button
   class="menu-item"
   onclick="showPage('map');toggleMenu()"
  >
   <span>🗺️</span>
   <span>خريطة عون</span>
  </button>

  <button
   class="menu-item"
   onclick="showPage('pulse');toggleMenu()"
  >
   <span>📊</span>
   <span>نبض المجتمع</span>
  </button>

  <button
   class="menu-item"
   onclick="showPage('assistant');toggleMenu()"
  >
   <span>🤖</span>
   <span>مساعد عون</span>
  </button>

  <button
   class="menu-item"
   onclick="requireLogin(()=>showPage('myreports'));toggleMenu()"
  >
   <span>📋</span>
   <span>بلاغاتي</span>
  </button>

  <button
   class="menu-item"
   onclick="requireLogin(()=>showPage('achievements'));toggleMenu()"
  >
   <span>🏆</span>
   <span>إنجازاتي</span>
  </button>

  <button
   class="menu-item hidden"
   id="adminMenuItem"
   onclick="showPage('admin');toggleMenu()"
  >
   <span>⚙️</span>
   <span>الإدارة</span>
  </button>

  <button
   class="menu-item"
   onclick="openProfile();toggleMenu()"
  >
   <span>👤</span>
   <span>حسابي</span>
  </button>

 </div>

</header>

<main id="app"></main>

<footer>
 <strong>عون</strong> — منصة ذكية لخدمة المجتمع
 <br>
 <span>معاً.. لمجتمع أكثر أماناً 🇦🇪</span>
</footer>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
   /* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ftamcnweyimjefajhcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_z7cfsDCEV7Z3gmGD09oGpw_qEdd4WQM";

const supabaseClient =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================================
   APP STATE
===================================================== */

let currentUser = null;
let currentProfile = null;
let reports = [];
let map = null;
let reportMap = null;
let selectedLat = null;
let selectedLng = null;
let markersLayer = null;

const STORAGE_KEY = "awn_local_reports_v2";

const categories = {
 road:"الطرق",
 light:"الإنارة",
 cleanliness:"النظافة",
 facility:"المرافق العامة",
 safety:"السلامة",
 accessibility:"إتاحة الوصول",
 environment:"البيئة",
 other:"أخرى"
};

const statusFlow = [
 "تم الاستلام",
 "قيد المراجعة",
 "تم تحويله للجهة المختصة",
 "قيد المعالجة",
 "تمت المعالجة"
];


/* =====================================================
   INIT
===================================================== */

document.addEventListener("DOMContentLoaded", async ()=>{

 loadLocalReports();

 await loadSession();

 renderHome();

});


async function loadSession(){

 const {data} =
 await supabaseClient.auth.getSession();

 currentUser = data.session?.user || null;

 if(currentUser){
  await loadProfile();
 }

 updateHeader();
}


async function loadProfile(){

 if(!currentUser) return;

 const {data,error} =
 await supabaseClient
 .from("profiles")
 .select("*")
 .eq("id",currentUser.id)
 .maybeSingle();

 if(!error && data){
  currentProfile = data;
 }else{
  currentProfile = {
   id:currentUser.id,
   full_name:currentUser.user_metadata?.full_name || "مستخدم عون",
   username:currentUser.user_metadata?.username || "",
   email:currentUser.email || "",
   phone:currentUser.user_metadata?.phone || "",
   role:"user",
   points:0,
   badge:"عضو جديد"
  };
 }

 updateHeader();
}

function initReportMap(){

 setTimeout(()=>{

  const mapElement =
   document.getElementById("reportMap");

  if(!mapElement) return;

  if(reportMap){

   reportMap.remove();
   reportMap=null;

  }

  reportMap =
   L.map("reportMap");

  L.tileLayer(
   "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
   {
    maxZoom:19,
    attribution:"© OpenStreetMap"
   }
  ).addTo(reportMap);


  const defaultLat =
   selectedLat ?? 24.2075;

  const defaultLng =
   selectedLng ?? 55.7447;


  reportMap.setView(
   [defaultLat,defaultLng],
   12
  );


  reportMap.on(
   "click",
   function(e){

    setReportLocation(
     e.latlng.lat,
     e.latlng.lng
    );

   }
  );


  if(
   selectedLat !== null &&
   selectedLng !== null
  ){

   setReportLocation(
    selectedLat,
    selectedLng
   );

  }

 },100);

}


function setReportLocation(lat,lng){

 selectedLat =
  Number(lat);

 selectedLng =
  Number(lng);


 if(reportMap){

  if(window.reportMarker){

   reportMap.removeLayer(
    window.reportMarker
   );

  }

  window.reportMarker =
   L.marker([
    selectedLat,
    selectedLng
   ])
   .addTo(reportMap);

  reportMap.setView(
   [selectedLat,selectedLng],
   16
  );

 }


 const status =
  document.getElementById(
   "locationStatus"
  );

 if(status){

  status.textContent =
   "تم تحديد موقع البلاغ ✓";

  status.style.color =
   "#198754";

 }


 calculateLiveScore();

}

/* =====================================================
   SCORE
===================================================== */

function calculateLiveScore(){

 const title =
  document.getElementById(
   "reportTitle"
  )?.value.trim() || "";

 const type =
  document.getElementById(
   "reportType"
  )?.value || "other";

 const description =
  document.getElementById(
   "reportDescription"
  )?.value.trim() || "";


 const score =
  calculateScore({
   title,
   type,
   description,
   latitude:selectedLat,
   longitude:selectedLng
  });


 const scoreElement =
  document.getElementById(
   "reportScore"
  );

 const labelElement =
  document.getElementById(
   "reportScoreLabel"
  );


 if(scoreElement)
  scoreElement.textContent =
   score;


 if(labelElement){

  if(score >= 80){

   labelElement.textContent =
    "أولوية عالية";

  }else if(score >= 50){

   labelElement.textContent =
    "أولوية متوسطة";

  }else if(score > 0){

   labelElement.textContent =
    "أولوية منخفضة";

  }else{

   labelElement.textContent =
    "بإنتظار البيانات";

  }

 }

}


function calculateScore(data){

 let score = 20;


 const title =
  String(data.title || "").toLowerCase();

 const description =
  String(data.description || "").toLowerCase();


 const text =
  title + " " + description;


 const highWords = [
  "خطر",
  "خطير",
  "حادث",
  "حريق",
  "كهرباء",
  "صعق",
  "حفرة كبيرة",
  "انهيار",
  "طريق مغلق",
  "danger",
  "fire"
 ];


 const mediumWords = [
  "مشكلة",
  "عطل",
  "مكسور",
  "تالف",
  "إنارة",
  "ازدحام",
  "مياه",
  "تسرب",
  "نظافة"
 ];


 highWords.forEach(word=>{

  if(text.includes(word))
   score += 12;

 });


 mediumWords.forEach(word=>{

  if(text.includes(word))
   score += 5;

 });


 if(data.type === "safety")
  score += 12;

 if(data.type === "road")
  score += 8;

 if(data.type === "accessibility")
  score += 7;


 if(data.latitude !== null &&
    data.longitude !== null){

  score += 8;

 }


 score =
  Math.min(100,score);


 return score;

}

/* =====================================================
   MATCHING
===================================================== */

function findMatchingReports(data){

 const result = [];

 reports.forEach(report=>{

  let score = 0;


  if(report.type === data.type)
   score += 30;


  const oldText =
   `${report.title || ""} ${report.description || ""}`
    .toLowerCase();


  const newText =
   `${data.title || ""} ${data.description || ""}`
    .toLowerCase();


  const words =
   newText
    .split(/\s+/)
    .filter(word=>word.length >= 3);


  words.forEach(word=>{

   if(oldText.includes(word))
    score += 5;

  });


  if(
   report.latitude &&
   report.longitude &&
   data.latitude &&
   data.longitude
  ){

   const distance =
    calculateDistance(
     report.latitude,
     report.longitude,
     data.latitude,
     data.longitude
    );


   if(distance <= 0.2)
    score += 35;

   else if(distance <= 0.5)
    score += 20;

  }


  if(score >= 50){

   result.push({
    id:report.id,
    score
   });

  }

 });


 return result;

}


function calculateDistance(
 lat1,
 lon1,
 lat2,
 lon2
){

 const R =
  6371;

 const dLat =
  (lat2-lat1) *
  Math.PI / 180;

 const dLon =
  (lon2-lon1) *
  Math.PI / 180;


 const a =
  Math.sin(dLat/2) *
  Math.sin(dLat/2) +

  Math.cos(lat1 *
   Math.PI/180) *

  Math.cos(lat2 *
   Math.PI/180) *

  Math.sin(dLon/2) *
  Math.sin(dLon/2);


 const c =
  2 *
  Math.atan2(
   Math.sqrt(a),
   Math.sqrt(1-a)
  );


 return R*c;

}

function drawMarkers(list){

  return;

 list.forEach(r=>{

  if(
   r.latitude === null ||
   r.latitude === undefined ||
   r.longitude === null ||
   r.longitude === undefined
  ){
   return;
  }


  let color =
   "#198754";

   color="#dc3545";

  else if(r.score >= 50)
   color="#f59f00";

   L.divIcon({

    className:"",

    html:`

       border-radius:50%;
       background:${color};
       border:3px solid white;
       box-shadow:0 3px 12px rgba(0,0,0,.3)

     ></div>

    iconSize:[18,18],

    iconAnchor:[9,9]

   });


  L.marker(
   [
    Number(r.latitude),
    Number(r.longitude)

function filterMap(filter,button){

  .querySelectorAll(".filter")
  .forEach(x =>
   x.classList.remove("active")

 if(button)
  button.classList.add("active");


 let list =
  reports;


 if(filter==="critical")
  list =
   reports.filter(r =>
    Number(r.score || 0) >= 80
   );


 if(filter==="medium")
  list =
   reports.filter(r =>
    Number(r.score || 0) >= 50 &&
    Number(r.score || 0) < 80
   );


 if(filter==="low")
  list =
   reports.filter(r =>
    Number(r.score || 0) < 50
   );


 if(
  [
   "road",
   "light",
   "safety"
  ].includes(filter)
 ){

  list =
   reports.filter(
    r=>r.type===filter
   );

 }


 drawMarkers(list);

}

/* =====================================================
   ASSISTANT
===================================================== */

function renderAssistant(){

 document.getElementById("app").innerHTML = `

 <section class="section">

  <div class="container">

   <div class="section-head">

    <div>

     <h2>🤖 مساعد عون</h2>

     <p>
      اشرح المشكلة بكلماتك، وعون يساعدك في فهمها.
     </p>

    </div>

   </div>


   <div class="form">

    <div class="card">

     <div class="field">

      <label>
       ما المشكلة التي شاهدتها؟
      </label>

      <textarea
       id="assistantText"
       placeholder="مثال: توجد حفرة كبيرة في الشارع وقد تسبب خطراً على السيارات..."
      ></textarea>

     </div>


     <button
      class="primary"
      onclick="runAssistant()">

      ✨ تحليل المشكلة

     </button>

    </div>


    <div
     id="assistantResult"
     style="margin-top:15px"
    ></div>

   </div>

  </div>

 </section>

 `;

}


function runAssistant(){

 const input =
  document.getElementById(
   "assistantText"
  );

 const result =
  document.getElementById(
   "assistantResult"
  );


 const text =
  input?.value.trim() || "";


 if(!text){

  showToast(
   "اكتب المشكلة أولاً",
   "error"
  );

  return;

 }


 let type="other";


 if(
  /شارع|طريق|حفرة|رصيف/
   .test(text)
 ){

  type="road";

 }

 else if(
  /إنارة|لمبة|مصباح|نور/
   .test(text)
 ){

  type="light";

 }

 else if(
  /نظافة|قمامة|مخلفات|زبالة/
   .test(text)
 ){

  type="cleanliness";

 }

 else if(
  /خطر|حادث|كهرباء|حريق/
   .test(text)
 ){

  type="safety";

 }

 else if(
  /كرسي|منحدر|ذوي الإعاقة|إعاقة|وصول/
   .test(text)
 ){

  type="accessibility";

 }

 else if(
  /حديقة|مرفق|دورة مياه|ملعب/
   .test(text)
 ){

  type="facility";

 }


 const score =
  calculateScore({

   title:text,

   type,

   description:text,

   latitude:null,

   longitude:null

  });


 let label =
  "أولوية منخفضة";


 if(score>=80)
  label="أولوية عالية";

 else if(score>=50)
  label="أولوية متوسطة";


 result.innerHTML = `

 <div class="card">

  <div class="badge">
   تحليل عون
  </div>


  <h2 style="margin-top:10px">
   ${categories[type] || "أخرى"}
  </h2>


  <div
   class="awn-score"
   style="margin-top:18px"
  >

   <div class="awn-score-title">
    درجة الأولوية
   </div>

   <div class="awn-score-number">
    ${score}
    <small>/100</small>
   </div>

   <div class="awn-score-label">
    ${label}
   </div>

  </div>


  <p
   style="
    color:var(--muted);
    line-height:1.8;
    margin-top:15px
   "
  >
   ${
    score>=80
    ?"هذه المشكلة قد تحتاج إلى تعامل سريع بسبب مستوى الأولوية المرتفع."
    :score>=50
    ?"يفضل رفع البلاغ مع صورة ووصف واضح لمساعدة الجهة المختصة."
    :"يمكن رفع البلاغ للمساهمة في تحسين المكان ومتابعة المشكلة."
   }
  </p>


  <button
   class="primary"
   style="margin-top:15px"
   onclick="openReportFromAssistant('${type}')"
  >
   📢 ارفع البلاغ
  </button>

 </div>

 `;

}


function openReportFromAssistant(type){

 requireLogin(()=>{

  renderReportPage();

  setTimeout(()=>{

   const select =
    document.getElementById(
     "reportType"
    );

   if(select){

    select.value =
     type;

    calculateLiveScore();

   }

  },100);

 });

}

/* =====================================================
   MODALS
===================================================== */

function showModal(html){

 document.getElementById(
  "modalRoot"
 ).innerHTML = `

 <div
  class="modal-overlay"
  onclick="modalOutside(event)"
 >

  <div class="modal">

   ${html}

  </div>

 </div>

 `;

}


function modalOutside(event){

 if(
  event.target.classList.contains(
   "modal-overlay"
  )
 ){

  closeModal();

 }

}


function closeModal(){

 document.getElementById(
  "modalRoot"
 ).innerHTML="";

}


/* =====================================================
   HELPERS
===================================================== */

function formatDate(date){

 if(!date)
  return "—";


 try{

  return new Date(date)
   .toLocaleDateString(
    "ar-AE",
    {
     year:"numeric",
     month:"short",
     day:"numeric"
    }
   );

 }catch{

  return "—";

 }

}


function escapeHtml(value){

 return String(
  value ?? ""
 )
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* =====================================================
   SHOW PAGE FIX
===================================================== */

const _showPage =
 showPage;


showPage = function(page){

 if(page === "profile"){

  renderProfile();
  return;

 }

 if(page === "report"){

  renderReportPage();
  return;

 }

 _showPage(page);

};


/* =====================================================
   HEADER LOGIN BUTTON
===================================================== */

function updateHeader(){

 const loginButton =
  document.getElementById(
   "loginNavButton"
  );

 const adminItem =
  document.getElementById(
   "adminMenuItem"
  );


 if(loginButton){

  if(currentUser){

   loginButton.textContent =
    "حسابي";

   loginButton.onclick =
    openProfile;

  }else{

   loginButton.textContent =
    "دخول";

   loginButton.onclick =
    ()=>openAuth("login");

  }

 }


 if(adminItem){

  if(
   currentProfile?.role === "admin"
  ){

   adminItem.classList.remove(
    "hidden"
   );

  }else{

   adminItem.classList.add(
    "hidden"
   );

  }

 }

}


/* =====================================================
   AUTH LISTENER
===================================================== */

supabaseClient.auth.onAuthStateChange(
 async (event,session)=>{

  currentUser =
   session?.user || null;


  if(currentUser){

   await loadProfile();

  }else{

   currentProfile=null;

  }


  updateHeader();

 }
);

renderHome();
