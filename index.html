<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta
  name="theme-color"
  content="#061017"
>

<meta
  name="description"
  content="عون | منصة ذكية لخدمة المجتمع"
>

<title>عون | معاً.. لمجتمع أكثر أماناً</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

/* =========================================================
   AWN
   PREMIUM CIVIC TECHNOLOGY DESIGN
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{

  --bg:#061017;
  --bg2:#08151d;

  --panel:#0b1b24;
  --panel2:#0e222c;

  --line:rgba(116,226,226,.13);
  --line2:rgba(255,255,255,.08);

  --cyan:#39d8d2;
  --cyan2:#72eee9;

  --green:#4bd69c;
  --gold:#d9b45c;

  --red:#ff6468;
  --orange:#ffad5b;

  --text:#f4fbfb;
  --muted:#91a8ad;

  --shadow:
    0 25px 80px rgba(0,0,0,.42);

  --radius:24px;
}

html,
body{

  min-height:100%;

  background:
    radial-gradient(
      circle at 12% 0%,
      rgba(57,216,210,.12),
      transparent 27%
    ),
    radial-gradient(
      circle at 90% 8%,
      rgba(30,130,170,.12),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #061017 0%,
      #07131b 55%,
      #040b10 100%
    );

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

.page{
  min-height:calc(100vh - 76px);
}

/* =========================================================
   HEADER
========================================================= */

header{

  position:sticky;
  top:0;

  z-index:3000;

  height:76px;

  background:
    rgba(4,12,17,.84);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  border-bottom:
    1px solid var(--line);
}

.nav{

  max-width:1380px;

  height:100%;

  margin:auto;

  padding:
    0 24px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;
}

/* BRAND */

.brand{

  display:flex;

  align-items:center;

  gap:12px;

  cursor:pointer;

  order:2;
}

.brand-logo{

  width:53px;
  height:53px;

  border-radius:15px;

  overflow:hidden;

  background:
    rgba(255,255,255,.04);

  border:
    1px solid rgba(255,255,255,.09);

  box-shadow:
    0 0 35px rgba(57,216,210,.10);

  display:flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;
}

.brand-logo img{

  width:100%;
  height:100%;

  object-fit:contain;
}

.brand-info strong{

  display:block;

  font-size:20px;

  letter-spacing:.4px;
}

.brand-info small{

  display:block;

  color:var(--muted);

  font-size:10px;

  margin-top:2px;
}

/* ACTIONS */

.nav-actions{

  display:flex;

  align-items:center;

  gap:8px;

  order:1;
}

.icon-btn{

  width:44px;
  height:44px;

  border-radius:14px;

  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.035);

  color:white;

  display:grid;

  place-items:center;

  font-size:19px;

  transition:.2s;
}

.icon-btn:hover{

  border-color:
    rgba(57,216,210,.35);

  background:
    rgba(57,216,210,.07);

  transform:translateY(-1px);
}

.primary{

  border:0;

  color:#03100f;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--cyan2),
      var(--cyan)
    );

  padding:
    12px 19px;

  border-radius:14px;

  box-shadow:
    0 10px 30px rgba(57,216,210,.12);

  transition:.2s;
}

.primary:hover{

  transform:translateY(-1px);

  box-shadow:
    0 15px 35px rgba(57,216,210,.20);
}

.secondary{

  border:
    1px solid var(--line);

  color:white;

  background:
    rgba(255,255,255,.035);

  padding:
    12px 17px;

  border-radius:14px;

  transition:.2s;
}

.secondary:hover{

  border-color:
    rgba(57,216,210,.28);

  background:
    rgba(57,216,210,.06);
}

/* =========================================================
   MENU
========================================================= */

.menu{

  position:fixed;

  top:88px;

  right:18px;

  width:
    min(365px,calc(100vw - 30px));

  max-height:
    calc(100vh - 105px);

  overflow:auto;

  z-index:4000;

  padding:11px;

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      rgba(9,28,38,.99),
      rgba(5,15,21,.99)
    );

  border:
    1px solid var(--line);

  box-shadow:
    0 30px 90px rgba(0,0,0,.58);
}

.menu-title{

  padding:
    12px 13px 10px;

  color:var(--muted);

  font-size:11px;
}

.menu-item{

  width:100%;

  min-height:54px;

  border:0;

  background:transparent;

  color:#e1edef;

  text-align:right;

  padding:
    14px;

  border-radius:15px;

  display:flex;

  align-items:center;

  gap:12px;

  transition:.2s;
}

.menu-item:hover{

  background:
    rgba(57,216,210,.07);

  color:var(--cyan2);
}

.menu-item .mi-icon{

  width:35px;

  height:35px;

  border-radius:11px;

  display:grid;

  place-items:center;

  background:
    rgba(57,216,210,.06);

  color:var(--cyan2);

  font-size:18px;
}

.menu-sep{

  height:1px;

  background:var(--line);

  margin:8px 0;
}

/* =========================================================
   GENERAL
========================================================= */

.container{

  width:
    min(1380px,100%);

  margin:auto;

  padding:
    28px 24px 75px;
}

.section{

  margin-top:28px;
}

.section-head{

  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  gap:15px;

  margin-bottom:15px;
}

.section-head h2{

  font-size:27px;

  letter-spacing:-.5px;
}

.section-head p{

  color:var(--muted);

  font-size:13px;

  margin-top:5px;
}

.card{

  background:
    linear-gradient(
      145deg,
      rgba(12,31,41,.94),
      rgba(6,17,23,.96)
    );

  border:
    1px solid var(--line);

  border-radius:
    var(--radius);

  padding:23px;

  box-shadow:
    0 15px 50px rgba(0,0,0,.14);
}

.grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:14px;
}

.two-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:15px;
}

.three-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:14px;
}

/* =========================================================
   HERO
========================================================= */

.hero{

  max-width:1380px;

  margin:auto;

  padding:
    32px 24px 20px;
}

.hero-grid{

  display:grid;

  grid-template-columns:
    1.45fr .75fr;

  gap:17px;
}

.hero-main{

  position:relative;

  overflow:hidden;

  min-height:480px;

  padding:50px;

  border-radius:31px;

  border:
    1px solid var(--line);

  background:

    radial-gradient(
      circle at 85% 25%,
      rgba(57,216,210,.09),
      transparent 25%
    ),

    linear-gradient(
      145deg,
      #0b222d,
      #061219
    );

  box-shadow:
    var(--shadow);

  display:flex;

  flex-direction:column;

  justify-content:center;
}

.hero-main:before{

  content:"";

  position:absolute;

  width:420px;
  height:420px;

  left:-190px;
  bottom:-220px;

  border-radius:50%;

  border:
    1px solid rgba(57,216,210,.09);

  box-shadow:
    0 0 0 55px rgba(57,216,210,.025),
    0 0 0 110px rgba(57,216,210,.015);

  pointer-events:none;
}

.hero-main:after{

  content:"";

  position:absolute;

  width:2px;

  height:190px;

  right:11%;

  top:0;

  background:
    linear-gradient(
      transparent,
      rgba(57,216,210,.25),
      transparent
    );

  transform:rotate(32deg);

  opacity:.6;
}

.badge{

  width:max-content;

  display:inline-flex;

  align-items:center;

  gap:7px;

  color:var(--cyan2);

  background:
    rgba(57,216,210,.055);

  border:
    1px solid rgba(57,216,210,.18);

  border-radius:100px;

  padding:
    8px 13px;

  font-size:12px;

  margin-bottom:23px;
}

.badge-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 14px rgba(75,214,156,.5);
}

.hero h1{

  position:relative;
  z-index:1;

  font-size:
    clamp(50px,7vw,84px);

  line-height:.98;

  letter-spacing:-4px;

  margin-bottom:20px;
}

.hero h1 span{

  color:var(--cyan2);
}

.hero p{

  position:relative;
  z-index:1;

  max-width:650px;

  color:#a8bec2;

  font-size:16px;

  line-height:1.9;

  margin-bottom:28px;
}

.hero-buttons{

  position:relative;
  z-index:1;

  display:flex;

  flex-wrap:wrap;

  gap:10px;
}

/* HERO SIDE */

.hero-side{

  display:grid;

  grid-template-rows:
    repeat(3,1fr);

  gap:12px;
}

.hero-mini{

  min-height:145px;

  padding:23px;

  border-radius:24px;

  border:
    1px solid var(--line);

  background:
    linear-gradient(
      145deg,
      rgba(13,34,44,.94),
      rgba(7,18,24,.95)
    );

  position:relative;

  overflow:hidden;
}

.hero-mini:after{

  content:"";

  position:absolute;

  width:120px;
  height:120px;

  left:-55px;
  bottom:-65px;

  border-radius:50%;

  background:
    rgba(57,216,210,.045);
}

.hero-mini .mini-label{

  color:var(--muted);

  font-size:12px;
}

.hero-mini .mini-value{

  font-size:37px;

  font-weight:900;

  margin-top:11px;

  color:#f4ffff;
}

.hero-mini .mini-value.cyan{

  color:var(--cyan2);
}

.hero-mini .mini-text{

  color:#8fa7ac;

  font-size:11px;

  margin-top:4px;
}

/* =========================================================
   FEATURES
========================================================= */

.feature{

  min-height:185px;

  transition:.22s;
}

.feature:hover{

  transform:translateY(-4px);

  border-color:
    rgba(57,216,210,.28);
}

.feature-icon{

  width:53px;
  height:53px;

  border-radius:16px;

  display:grid;

  place-items:center;

  background:
    rgba(57,216,210,.065);

  border:
    1px solid rgba(57,216,210,.10);

  color:var(--cyan2);

  font-size:24px;

  margin-bottom:17px;
}

.feature h3{

  font-size:17px;

  margin-bottom:7px;
}

.feature p{

  color:var(--muted);

  font-size:13px;

  line-height:1.75;
}

/* =========================================================
   STATS
========================================================= */

.stats{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:11px;
}

.stat{

  position:relative;

  overflow:hidden;

  padding:21px;

  border:
    1px solid var(--line);

  border-radius:20px;

  background:
    rgba(255,255,255,.025);
}

.stat-label{

  color:var(--muted);

  font-size:11px;
}

.stat-value{

  font-size:31px;

  font-weight:900;

  margin-top:8px;
}

.stat-value.cyan{

  color:var(--cyan2);
}

/* =========================================================
   PAGE HEAD
========================================================= */

.page-head{

  margin-bottom:20px;
}

.page-head h1{

  font-size:36px;

  letter-spacing:-1px;
}

.page-head p{

  color:var(--muted);

  font-size:13px;

  margin-top:7px;

  line-height:1.7;
}

/* =========================================================
   FORMS
========================================================= */

.form{

  max-width:760px;

  margin:auto;
}

.field{

  margin-bottom:15px;
}

.field label{

  display:block;

  color:#d9e4e5;

  font-size:12px;

  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{

  width:100%;

  outline:none;

  color:white;

  background:
    rgba(3,13,18,.78);

  border:
    1px solid rgba(116,226,226,.12);

  border-radius:15px;

  padding:
    14px;

  transition:.2s;
}

.field input::placeholder,
.field textarea::placeholder{

  color:#63787d;
}

.field input:focus,
.field textarea:focus,
.field select:focus{

  border-color:
    rgba(57,216,210,.52);

  box-shadow:
    0 0 0 3px rgba(57,216,210,.055);
}

.field textarea{

  min-height:140px;

  resize:vertical;
}

.row{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;
}

.actions{

  display:flex;

  flex-wrap:wrap;

  gap:9px;

  margin-top:10px;
}

/* =========================================================
   MAP
========================================================= */

.map{

  width:100%;

  height:470px;

  overflow:hidden;

  border-radius:23px;

  border:
    1px solid rgba(57,216,210,.15);

  background:#071219;
}

.map.small{

  height:360px;
}

.map-tools{

  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-bottom:12px;
}

.filter{

  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.035);

  color:white;

  padding:
    9px 13px;

  border-radius:11px;

  font-size:12px;
}

.filter.active{

  background:
    rgba(57,216,210,.09);

  color:var(--cyan2);

  border-color:
    rgba(57,216,210,.28);
}

/* =========================================================
   REPORTS
========================================================= */

.report-list{

  display:grid;

  gap:12px;
}

.report{

  border:
    1px solid var(--line);

  background:
    linear-gradient(
      145deg,
      rgba(12,31,41,.94),
      rgba(6,17,23,.96)
    );

  border-radius:21px;

  padding:19px;
}

.report-top{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:10px;
}

.report-title{

  font-size:17px;

  font-weight:900;
}

.report-type{

  color:var(--cyan2);

  font-size:11px;

  margin-top:5px;
}

.report-desc{

  color:var(--muted);

  font-size:13px;

  line-height:1.75;

  margin:
    13px 0;
}

.report-meta{

  display:flex;

  flex-wrap:wrap;

  gap:7px;
}

.meta{

  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.025);

  padding:
    7px 10px;

  border-radius:10px;

  color:#aebec1;

  font-size:10px;
}

.status{

  white-space:nowrap;

  border-radius:100px;

  padding:
    7px 10px;

  font-size:10px;

  background:
    rgba(57,216,210,.08);

  color:var(--cyan2);
}

.status.done{

  background:
    rgba(75,214,156,.09);

  color:#70e0ad;
}

.status.review{

  background:
    rgba(255,173,91,.09);

  color:#ffc27e;
}

.status.closed{

  background:
    rgba(255,255,255,.06);

  color:#a7b1b3;
}

/* =========================================================
   PULSE
========================================================= */

.pulse-number{

  font-size:58px;

  font-weight:900;

  line-height:1;

  color:var(--cyan2);
}

.progress{

  width:100%;

  height:8px;

  border-radius:100px;

  background:
    rgba(255,255,255,.06);

  overflow:hidden;

  margin-top:12px;
}

.progress span{

  display:block;

  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      var(--cyan),
      var(--green)
    );
}

/* =========================================================
   PROFILE
========================================================= */

.profile-head{

  display:flex;

  align-items:center;

  gap:16px;
}

.avatar{

  width:76px;
  height:76px;

  border-radius:23px;

  display:grid;

  place-items:center;

  font-size:30px;

  font-weight:900;

  color:#061017;

  background:
    linear-gradient(
      135deg,
      var(--cyan2),
      var(--cyan)
    );
}

.profile-name{

  font-size:23px;

  font-weight:900;
}

.profile-sub{

  color:var(--muted);

  font-size:12px;

  margin-top:4px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{

  padding:
    48px 20px;

  text-align:center;

  border:
    1px dashed var(--line);

  border-radius:20px;

  color:var(--muted);
}

.empty-icon{

  font-size:39px;

  margin-bottom:10px;
}

/* =========================================================
   ADMIN
========================================================= */

.dashboard{

  display:grid;

  grid-template-columns:250px 1fr;

  gap:15px;
}

.sidebar{

  height:max-content;

  position:sticky;

  top:93px;

  padding:10px;

  border:
    1px solid var(--line);

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(10,28,37,.96),
      rgba(5,15,21,.97)
    );
}

.sidebar-title{

  color:var(--muted);

  font-size:11px;

  padding:
    11px 12px;
}

.side-item{

  width:100%;

  border:0;

  background:transparent;

  color:#c8d5d7;

  text-align:right;

  padding:
    13px;

  border-radius:13px;

  margin-bottom:3px;
}

.side-item:hover,
.side-item.active{

  background:
    rgba(57,216,210,.07);

  color:var(--cyan2);
}

.admin-content{

  min-width:0;
}

.admin-title{

  font-size:30px;

  font-weight:900;
}

/* TABLE */

.table-wrap{

  overflow:auto;

  border:
    1px solid var(--line);

  border-radius:19px;
}

table{

  width:100%;

  min-width:720px;

  border-collapse:collapse;
}

th,
td{

  padding:
    13px;

  text-align:right;

  border-bottom:
    1px solid var(--line);

  font-size:11px;
}

th{

  color:var(--cyan2);

  background:#0a2029;
}

td{

  color:#c6d1d3;
}

/* =========================================================
   MODAL
========================================================= */

.modal-back{

  position:fixed;

  inset:0;

  z-index:8000;

  display:grid;

  place-items:center;

  padding:17px;

  background:
    rgba(0,0,0,.76);

  backdrop-filter:blur(9px);
}

.modal{

  width:
    min(590px,100%);

  max-height:91vh;

  overflow:auto;

  border-radius:27px;

  padding:26px;

  background:
    linear-gradient(
      145deg,
      #0b222d,
      #061219
    );

  border:
    1px solid var(--line);

  box-shadow:
    0 35px 100px rgba(0,0,0,.60);
}

.modal-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:21px;
}

.modal-head h2{

  font-size:24px;
}

.close{

  width:40px;
  height:40px;

  border:
    1px solid var(--line);

  border-radius:12px;

  background:
    rgba(255,255,255,.035);

  color:white;

  font-size:20px;
}

/* AUTH TABS */

.auth-tabs{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:7px;

  margin-bottom:20px;
}

.auth-tab{

  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.03);

  color:#b6c6c9;

  border-radius:12px;

  padding:11px;
}

.auth-tab.active{

  color:var(--cyan2);

  background:
    rgba(57,216,210,.07);

  border-color:
    rgba(57,216,210,.25);
}

.auth-note{

  color:var(--muted);

  font-size:11px;

  line-height:1.7;

  margin-top:8px;
}

.link-btn{

  border:0;

  background:transparent;

  color:var(--cyan2);

  font-size:12px;

      await supabaseClient
        .from("profiles")

        .eq(
          "id",
          currentUser.id

    if(error){

async function signupUser(){

  const name =
    document
      .getElementById("authName")
      .value
      .trim();

  const username =
    document
      .getElementById("authUsername")
      .value
      .trim();

  const phone =
    document
      .getElementById("authPhone")
      .value
      .trim();

  const email =
    document
      .getElementById("authEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("authPassword")
      .value;


  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .signUp({

        email,

        password,

        options:{
          data:{
            full_name:name,
            username:username,
            phone:phone
          }
        }

      });


  if(error){

    showToast(
      error.message ||
      "تعذر إنشاء الحساب",
      "error"
    );

    return;

  }


  if(data.user){

    try{

      await supabaseClient
        .from("profiles")
        .upsert({

          id:data.user.id,

          full_name:name,

          username:username,

          email:email,

          phone:phone,

          role:"user",

          points:0

        });

    }catch(error){

      console.warn(error);

    }

  }


  if(data.session){

    await loadSession();

    closeModal();

    showToast(
      "تم إنشاء الحساب بنجاح",
      "success"
    );

  }else{

    showToast(
      "تم إنشاء الحساب. تحقق من بريدك الإلكتروني إذا طُلب منك ذلك.",
      "success"
    );

}

function initReportMap(){

  if(reportMap){

    reportMap.remove();

    reportMap = null;

  }


  reportMap =
    L.map("reportMap")
      .setView(
        [24.2075,55.7447],
        13
      );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap"
    }
  ).addTo(reportMap);


  reportMap.on(
    "click",
    function(e){

      selectedLat =
        e.latlng.lat;

      selectedLng =
        e.latlng.lng;


      if(reportMarker){

        reportMap.removeLayer(
          reportMarker
        );

      }


      reportMarker =
        L.marker([
          selectedLat,
          selectedLng
        ])
        .addTo(reportMap);


      const status =
        document.getElementById(
          "locationStatus"
        );

      if(status){

        status.textContent =
          "تم تحديد موقع المشكلة ✓";

      }

    }
  );

}


function useMyLocation(){

  if(
    !navigator.geolocation
  ){

    showToast(
      "الموقع غير متاح في جهازك",
      "error"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      selectedLat =
        position.coords.latitude;

      selectedLng =
        position.coords.longitude;


      if(reportMap){

        reportMap.setView(
          [
            selectedLat,
            selectedLng
          ],
          16
        );


        if(reportMarker){

          reportMap.removeLayer(
            reportMarker
          );

        }


        reportMarker =
          L.marker([
            selectedLat,
            selectedLng
          ])
          .addTo(reportMap);

      }


      const status =
        document.getElementById(
          "locationStatus"
        );

      if(status){

        status.textContent =
          "تم تحديد الموقع ✓";

      }

    },

    function(){

      showToast(
        "تعذر الوصول إلى الموقع",
        "error"
      );

    }

  );

}


/* =========================================================
   LOCAL SMART ANALYSIS
   ========================================================= */

function analyzeIssue(
  type,
  description
){

  const text =
    (
      description || ""
    ).toLowerCase();


  let score = 45;


  const criticalWords = [

    "حادث",
    "حريق",
    "خطر",
    "خطير",
    "انهيار",
    "كهرباء",
    "تسرب",
    "دخان",
    "مكشوف",
    "طوارئ"

  ];


  const mediumWords = [

    "حفرة",
    "تالف",
    "مكسور",
    "ظلام",
    "إنارة",
    "مشكلة",
    "مياه"

  ];


  criticalWords.forEach(
    word => {

      if(text.includes(word)){

        score += 10;

      }

    }
  );


  mediumWords.forEach(
    word => {

      if(text.includes(word)){

        score += 5;

      }

    }
  );


  if(
    type === "safety"
  ){

    score += 15;

  }


  if(
    type === "roads"
  ){

    score += 8;

  }


  score =
    Math.max(
      1,
      Math.min(
        100,
        score
      )
    );


  let label =
    "أولوية منخفضة";


  if(score >= 80){

    label =
      "أولوية عالية";

  }else if(score >= 60){

    label =
      "أولوية متوسطة";

  }


  return {
    score,
    label
  };

}

async function submitReport(){

  if(!currentUser){

    openAuth("login");

    return;

  }


  const title =
    document
      .getElementById("reportTitle")
      .value
      .trim();

  const type =
    document
      .getElementById("reportType")
      .value;

  const description =
    document
      .getElementById("reportDescription")
      .value
      .trim();

  const photoInput =
    document.getElementById(
      "reportPhoto"
    );


  if(!title){

    showToast(
      "اكتب عنوان البلاغ",
      "error"
    );

    return;

  }


  if(!type){

    showToast(
      "اختر نوع المشكلة",
      "error"
    );

    return;

  }


  if(!description){

    showToast(
      "اكتب وصف المشكلة",
      "error"
    );

    return;

  }


  if(
    selectedLat === null ||
    selectedLng === null
  ){

    showToast(
      "حدد موقع المشكلة على الخريطة",
      "error"
    );

    return;

  }


  const ai =
    analyzeIssue(
      type,
      description
    );


  let photoUrl = null;

  let hasPhoto = false;


  if(
    photoInput &&
    photoInput.files &&
    photoInput.files[0]
  ){

    try{

      const file =
        photoInput.files[0];


      const extension =
        file.name
          .split(".")
          .pop();


      const path =
        currentUser.id +
        "/" +
        Date.now() +
        "." +
        extension;


      const {
        error:
          uploadError
      } =
        await supabaseClient
          .storage
          .from("reports")
          .upload(
            path,
            file,
            {
              upsert:false
            }
          );


      if(
        !uploadError
      ){

        const {
          data
        } =
          supabaseClient
            .storage
            .from("reports")
            .getPublicUrl(
              path
            );


        photoUrl =
          data?.publicUrl ||
          null;

        hasPhoto =
          !!photoUrl;

      }

    }catch(error){

      console.warn(
        "Photo upload failed",
        error
      );

    }

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("reports")
      .insert({

        user_id:
          currentUser.id,

        title,

        type,

        description,

        latitude:
          selectedLat,

        longitude:
          selectedLng,

        score:
          ai.score,

        matches:0,

        status:
          "received",

        has_photo:
          hasPhoto,

        photo_url:
          photoUrl

      })
      .select()
      .single();


  if(error){

    console.error(error);

    showToast(
      "تعذر إرسال البلاغ. تأكد من إعداد قاعدة البيانات.",
      "error"
    );

    return;

  }


  reports.unshift(
    data
  );


  showSuccessReportModal(
    data
  );

}

    await supabaseClient
      .from("reports")
      .update({
        status

      .eq(
        "id",

      );


  if(error){

    console.error(error);

    showToast(
      "تعذر تحديث حالة البلاغ",
      "error"
    );

    return;

  }


  const local =
    reports.find(
      r =>
        String(r.id) ===

  if(local){

    local.status =
      status;

  }


  showToast(
    "تم تحديث الحالة",
    "success"
  );


  renderAdmin();

}

/* =========================================================
   TOAST
========================================================= */

function showToast(
  message,
  type = "success"
){

  const old =
    document.querySelector(
      ".toast"
    );

  old?.remove();


  const toast =
    document.createElement(
      "div"
    );


  toast.className =
    "toast " +
    type;


  toast.innerHTML = `

    <span>
      ${
        type === "success"
          ? "✓"
          : "!"
      }
    </span>

    <span>
      ${escapeHtml(
        message
      )}
    </span>

  `;


  document.body.appendChild(
    toast
  );


  setTimeout(
    ()=>{
      toast.remove();
    },
    3500
  );

}


/* =========================================================
   HELPERS
========================================================= */

function getCategoryLabel(
  value
){

  const found =
    categories.find(
      c =>
        c.value === value
    );


  return found
    ? found.label
    : value ||
      "أخرى";

}


function getStatusClass(
  status
){

  if(status === "done"){

    return "done";

  }

  if(
    status === "review" ||
    status === "progress"
  ){

    return "review";

  }

  if(status === "closed"){

    return "closed";

  }

  return "";

}


function formatDate(
  date
){

  if(!date){

    return "-";

  }


  try{

    return new Date(
      date
    ).toLocaleDateString(
      "ar-AE",
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

  }catch(error){

    return "-";

  }

}


function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );

}


/* =========================================================
   CLOSE MENU WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener(
  "click",
  function(event){

    const menu =
      document.getElementById(
        "menu"
      );

    const button =
      event.target.closest(
        ".icon-btn"
      );


    if(
      !menu ||
      menu.classList.contains(
        "hidden"
      )
    ){

      return;

    }


    if(
      !menu.contains(event.target) &&
      !button
    ){

      menu.classList.add(
        "hidden"
      );

    }

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeModal();

      document
        .getElementById("menu")
        ?.classList
        .add("hidden");

    }

  }
);

</script>
