<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f0e">
<meta name="description" content="عون — منصة ذكية لخدمة المجتمع">
<title>عون | معاً.. لمجتمع أكثر أماناً</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

:root{
 --bg:#080b0a;
 --panel:#101513;
 --panel2:#151b18;
 --border:rgba(255,255,255,.09);
 --gold:#48c78e;
 --gold2:#68dda8;
 --green:#48c78e;
 --red:#ff5f61;
 --orange:#ff9f43;
 --blue:#48c78e;
 --text:#f4f5f4;
 --muted:#9da5a1;
 --shadow:0 20px 60px rgba(0,0,0,.35);
}

html,body{
 min-height:100%;
 background:
 radial-gradient(circle at 20% 0%,rgba(72,199,142,.08),transparent 28%),
 radial-gradient(circle at 100% 20%,rgba(72,199,142,.07),transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
}

body{
 overflow-x:hidden;
}

button,input,textarea,select{
 font:inherit;
}

button{
 cursor:pointer;
}

.hidden{
 display:none!important;
}

/* HEADER */

header{
 position:sticky;
 top:0;
 z-index:1000;
 height:76px;
 background:rgba(8,11,10,.88);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--border);
}

.nav{
 height:100%;
 max-width:1250px;
 margin:auto;
 padding:0 18px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

.logo{
 display:flex;
 align-items:center;
 gap:11px;
 cursor:pointer;
}

.logo-mark{
 width:43px;
 height:43px;
 border-radius:13px;
 background:linear-gradient(145deg,var(--gold2),var(--gold));
 color:#111;
 display:grid;
 place-items:center;
 font-size:23px;
 font-weight:900;
 box-shadow:0 8px 25px rgba(72,199,142,.18);
}

.logo-text strong{
 display:block;
 font-size:20px;
 letter-spacing:.5px;
}

.logo-text small{
 color:var(--muted);
 font-size:10px;
}

.nav-actions{
 display:flex;
 align-items:center;
 gap:8px;
}

.icon-btn{
 width:44px;
 height:44px;
 border-radius:13px;
 border:1px solid var(--border);
 background:rgba(255,255,255,.035);
 color:white;
 display:grid;
 place-items:center;
 font-size:20px;
}

.primary{
 border:0;
 color:#10100d;
 font-weight:800;
 background:linear-gradient(135deg,var(--gold2),var(--gold));
 padding:13px 19px;
 border-radius:13px;
 box-shadow:0 10px 25px rgba(72,199,142,.12);
}

.secondary{
 border:1px solid var(--border);
 color:white;
 background:rgba(255,255,255,.04);
 padding:12px 17px;
 border-radius:13px;
}

.menu{
 position:fixed;
 top:84px;
 right:12px;
 width:min(330px,calc(100vw - 24px));
 max-height:calc(100vh - 98px);
 overflow:auto;
 z-index:2000;
 background:rgba(15,20,18,.98);
 border:1px solid rgba(255,255,255,.11);
 border-radius:22px;
 padding:12px;
 box-shadow:var(--shadow);
}

.menu-item{
 width:100%;
 border:0;
 background:transparent;
 color:white;
 text-align:right;
 padding:15px;
 border-radius:13px;
 display:flex;
 align-items:center;
 gap:12px;
}

.menu-item:hover{
 background:rgba(255,255,255,.06);
}

.menu-item span:first-child{
 width:35px;
 text-align:center;
 font-size:20px;
}

.menu-sep{
 height:1px;
 background:var(--border);
 margin:8px 0;
}

/* HERO */

.hero{
 max-width:1250px;
 margin:auto;
 padding:55px 18px 25px;
}

.hero-grid{
 display:grid;
 grid-template-columns:1.35fr .65fr;
 gap:22px;
}

.hero-main{
 min-height:430px;
 padding:45px;
 border-radius:30px;
 border:1px solid var(--border);
 background:
 linear-gradient(135deg,rgba(72,199,142,.11),transparent 45%),
 linear-gradient(160deg,#121815,#0d1110);
 position:relative;
 overflow:hidden;
}

.hero-main:after{
 content:"";
 position:absolute;
 width:300px;
 height:300px;
 border-radius:50%;
 border:1px solid rgba(72,199,142,.12);
 left:-120px;
 bottom:-150px;
}

.badge{
 display:inline-flex;
 align-items:center;
 gap:7px;
 background:rgba(72,199,142,.10);
 border:1px solid rgba(72,199,142,.22);
 color:var(--gold2);
 padding:8px 12px;
 border-radius:100px;
 font-size:12px;
 font-weight:800;
}

.hero h1{
 margin-top:22px;
 font-size:64px;
 line-height:1.05;
 letter-spacing:-2px;
}

.hero h1 em{
 color:var(--gold2);
 font-style:normal;
}

.hero p{
 margin-top:20px;
 max-width:650px;
 color:var(--muted);
 line-height:1.9;
 font-size:16px;
}

.hero-buttons{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:27px;
}

.hero-side{
 display:grid;
 gap:12px;
}

.mini-card{
 border:1px solid var(--border);
 border-radius:22px;
 padding:25px;
 background:linear-gradient(145deg,#111714,#0d1110);
}

.mini-card small{
 color:var(--muted);
 font-size:12px;
}

.mini-card .num{
 font-size:36px;
 font-weight:900;
 color:var(--gold2);
 margin-top:8px;
}

/* CONTAINERS */

.container{
 max-width:1250px;
 margin:auto;
 padding:25px 18px 55px;
}

.section{
 margin-top:30px;
}

.section-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 margin-bottom:17px;
}

.section-head h2{
 font-size:25px;
}

.section-head p{
 color:var(--muted);
 margin-top:5px;
 font-size:13px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:13px;
}

.card{
 border:1px solid var(--border);
 background:linear-gradient(145deg,#111714,#0d1110);
 border-radius:20px;
 padding:21px;
}

.feature{
 min-height:180px;
}

.feature-icon{
 width:46px;
 height:46px;
 border-radius:14px;
 display:grid;
 place-items:center;
 background:rgba(72,199,142,.10);
 border:1px solid rgba(72,199,142,.18);
 font-size:23px;
 margin-bottom:14px;
}

.feature h3{
 font-size:17px;
}

.feature p{
 color:var(--muted);
 line-height:1.8;
 font-size:13px;
 margin-top:8px;
}

/* FORMS */

.form{
 max-width:850px;
 margin:auto;
}

.field{
 margin-bottom:16px;
}

.field label{
 display:block;
 font-size:13px;
 margin-bottom:8px;
 color:#d9dedb;
}

.field input,
.field textarea,
.field select{
 width:100%;
 border:1px solid var(--border);
 background:#0b0f0d;
 color:var(--text);
 border-radius:13px;
 padding:13px 14px;
 outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
 border-color:var(--gold);
 box-shadow:0 0 0 3px rgba(72,199,142,.08);
}

.field textarea{
 min-height:130px;
 resize:vertical;
}

.field select{
 appearance:auto;
}

.actions{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:18px;
}

/* MAP */

.map{
 width:100%;
 height:500px;
 border-radius:20px;
 overflow:hidden;
 border:1px solid var(--border);
 background:#101513;
}

.map-tools{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:12px;
}

.filter{
 border:1px solid var(--border);
 background:rgba(255,255,255,.04);
 color:white;
 padding:9px 13px;
 border-radius:100px;
 font-size:12px;
}

.filter.active{
 color:var(--gold2);
 border-color:rgba(72,199,142,.3);
 background:rgba(72,199,142,.08);
}

/* SCORE */

.score-box{
 border:1px solid var(--border);
 background:linear-gradient(145deg,#111714,#0d1110);
 border-radius:20px;
 padding:25px;
 text-align:center;
 margin-top:15px;
}

.score-circle{
 --score:70%;
 width:125px;
 height:125px;
 margin:15px auto;
 border-radius:50%;
 display:grid;
 place-items:center;
 position:relative;
 background:
 conic-gradient(var(--gold2) var(--score),#252c28 0);
}

.score-circle:after{
 content:"";
 position:absolute;
 inset:9px;
 border-radius:50%;
 background:#101513;
}

.score-number{
 position:relative;
 z-index:2;
 font-size:34px;
 font-weight:900;
}

.score-label{
 color:var(--muted);
 font-size:13px;
}

/* REPORTS */

.report-list{
 display:grid;
 gap:12px;
}

.report{
 border:1px solid var(--border);
 background:linear-gradient(145deg,#111714,#0d1110);
 border-radius:20px;
 padding:20px;
}

.report-top{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:15px;
}

.report-title{
 font-size:18px;
 font-weight:900;
}

.report-type{
 color:var(--gold2);
 font-size:12px;
 margin-top:6px;
}

.report-desc{
 color:var(--muted);
 line-height:1.8;
 margin-top:13px;
 font-size:13px;
}

.report-meta{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 align-items:center;
 margin-top:15px;
}

.score-pill{
 display:inline-flex;
 align-items:center;
 gap:4px;
 padding:6px 9px;
 border-radius:100px;
 font-size:11px;
 font-weight:800;
}

.score-high{
 background:rgba(255,95,97,.10);
 color:#ff8587;
}

.score-med{
 background:rgba(255,159,67,.10);
 color:#ffb86b;
}

.score-low{
 background:rgba(72,199,142,.10);
 color:#68dda8;
}

.meta{
 color:var(--muted);
 font-size:11px;
}

.status{
 padding:6px 10px;
 border-radius:100px;
 background:rgba(255,255,255,.05);
 color:var(--muted);
 font-size:11px;
}

.status.done{
 color:#68dda8;
 background:rgba(72,199,142,.10);
}

.status.critical{
 color:#ff8587;
 background:rgba(255,95,97,.10);
}

/* STATS */

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
}

.stat{
 border:1px solid var(--border);
 border-radius:20px;
 padding:20px;
 background:linear-gradient(145deg,#111714,#0d1110);
}

.stat .label{
 color:var(--muted);
 font-size:12px;
}

.stat .value{
 margin-top:9px;
 font-size:30px;
 font-weight:900;
 color:var(--gold2);
}

/* EMPTY */

.empty{
 text-align:center;
 padding:55px 20px;
 border:1px dashed var(--border);
 border-radius:20px;
 color:var(--muted);
}

.e-icon{
 font-size:42px;
 margin-bottom:15px;
}

/* TIMELINE */

.timeline{
 border-right:2px solid #29302c;
 padding-right:18px;
}

.timeline-item{
 position:relative;
 padding-bottom:20px;
}

.timeline-dot{
 position:absolute;
 right:-27px;
 top:2px;
 width:14px;
 height:14px;
 border-radius:50%;
 border:2px solid #101513;
}

.timeline-item h4{
 font-size:14px;
}

.timeline-item p{
 color:var(--muted);
 font-size:11px;
 margin-top:5px;
}

/* DASHBOARD */

.dashboard{
 display:grid;
 grid-template-columns:230px 1fr;
 gap:15px;
}

.sidebar{
 border:1px solid var(--border);
 background:#101513;
 border-radius:20px;
 padding:10px;
 height:max-content;
}

.side-item{
 width:100%;
 border:0;
 background:transparent;
 color:#c7ceca;
 text-align:right;
 padding:13px;
 border-radius:12px;
 margin-bottom:4px;
}

.side-item:hover,
.side-item.active{
 background:rgba(72,199,142,.09);
 color:var(--gold2);
}

.admin-content{
 min-width:0;
}

.table-wrap{
 overflow:auto;
 border:1px solid var(--border);
 border-radius:18px;
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:650px;
}

th,td{
 padding:13px;
 border-bottom:1px solid var(--border);
 text-align:right;
 font-size:12px;
}

th{
 background:#151b18;
 color:var(--gold2);
}

td{
 color:#c7ceca;
}

/* MODAL */

.modal-back{
 position:fixed;
 inset:0;
 z-index:5000;
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(10px);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modal{
 width:min(600px,100%);
 max-height:90vh;
 overflow:auto;
 border:1px solid var(--border);
 border-radius:24px;
 background:#101513;
 padding:23px;
 box-shadow:var(--shadow);
}

.modal-head{
 display:flex;
 align-items:flex-start;
 justify-content:space-between;
 gap:15px;
 margin-bottom:20px;
}

.close{
 width:38px;
 height:38px;
 border:1px solid var(--border);
 background:rgba(255,255,255,.04);
 color:white;
 border-radius:11px;
 font-size:24px;
}

.toast{
 position:fixed;
 left:50%;
 bottom:22px;
 transform:translateX(-50%);
 z-index:6000;
 min-width:min(390px,calc(100vw - 30px));
 border:1px solid var(--border);
 background:#111714;
 color:white;
 border-radius:15px;
 padding:13px 15px;
 display:flex;
 align-items:center;
 gap:9px;
 box-shadow:var(--shadow);
}

.toast.success{
 border-color:rgba(72,199,142,.25);
}

.toast.error{
 border-color:rgba(255,95,97,.25);
}

/* FOOTER */

footer{
 border-top:1px solid var(--border);
 padding:30px 18px;
 text-align:center;
 color:var(--muted);
 font-size:12px;
}

/* AUTH */

.auth-tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-bottom:18px;
}

.auth-tab{
 border:1px solid var(--border);
 background:rgba(255,255,255,.04);
 color:var(--muted);
 border-radius:12px;
 padding:11px;
}

.auth-tab.active{
 color:var(--gold2);
 border-color:rgba(72,199,142,.3);
 background:rgba(72,199,142,.08);
}

.auth-note{
 color:var(--muted);
 font-size:11px;
 line-height:1.7;
 margin-top:10px;
}

.link-btn{
 border:0;
 background:none;
 color:var(--gold2);
 padding:0;
 font-size:12px;
}

/* SETTINGS */

.settings-colors{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:9px;
 margin-top:10px;
}

.color-choice{
 border:2px solid transparent;
 border-radius:12px;
 min-height:42px;
 font-size:11px;
 font-weight:800;
 color:white;
 padding:8px 4px;
}

.color-choice.selected{
 border-color:var(--text);
 box-shadow:0 0 0 2px rgba(255,255,255,.7) inset;
}

.settings-preview{
 border:1px solid var(--border);
 border-radius:16px;
 padding:14px;
 margin-top:14px;
}

.attachment-actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
 margin-top:9px;
}

.attachment-btn{
 border:1px solid var(--border);
 background:rgba(255,255,255,.04);
 color:var(--text);
 border-radius:13px;
 padding:12px 8px;
 text-align:center;
}

.attachment-preview{
 display:none;
 margin-top:12px;
 border:1px solid var(--border);
 border-radius:16px;
 padding:10px;
 overflow:hidden;
}

.attachment-preview img{
 width:100%;
 max-height:260px;
 object-fit:cover;
 border-radius:12px;
}

.attachment-file{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
}

/* FULL-SCREEN MAP */

body.map-mode{
 overflow:hidden;
}

body.map-mode #app{
 height:100vh;
}

body.map-mode footer{
 display:none;
}

.map-screen{
 position:fixed;
 inset:0;
 z-index:900;
 background:#101513;
}

.map-screen .map{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 border:0;
 border-radius:0;
}

.map-screen .map-overlay{
 position:absolute;
 top:18px;
 right:18px;
 left:18px;
 z-index:1000;
 display:flex;
 justify-content:flex-start;
 gap:7px;
 flex-wrap:wrap;
 pointer-events:none;
}

.map-screen .map-overlay .filter{
 pointer-events:auto;
 background:rgba(15,20,18,.90);
 backdrop-filter:blur(12px);
}

.map-screen .map-overlay .filter.active{
 color:var(--gold2);
}

/* LIGHT THEME */

body.light-theme{
 --bg:#f7f8f6;
 --panel:#ffffff;
 --panel2:#f0f3f1;
 --border:rgba(20,30,25,.12);
 --text:#17221d;
 --muted:#66716b;
 background:#f7f8f6;
 color:var(--text);
}

body.light-theme header{
 background:rgba(255,255,255,.92);
}

body.light-theme .icon-btn,
body.light-theme .secondary,
body.light-theme .filter{
 color:var(--text);
 background:rgba(0,0,0,.035);
}

body.light-theme .menu{
 background:rgba(255,255,255,.98);
 border-color:rgba(20,30,25,.12);
}

body.light-theme .menu-item{
 color:var(--text);
}

body.light-theme .menu-item:hover{
 background:rgba(0,0,0,.05);
}

body.light-theme .hero-main{
 background:
 linear-gradient(135deg,rgba(72,199,142,.10),transparent 45%),
 linear-gradient(160deg,#ffffff,#eef2ef);
}

body.light-theme .mini-card,
body.light-theme .card,
body.light-theme .report,
body.light-theme .score-box,
body.light-theme .stat{
 background:linear-gradient(145deg,#ffffff,#f0f3f1);
}

body.light-theme .field input,
body.light-theme .field textarea,
body.light-theme .field select{
 background:#ffffff;
 color:var(--text);
}

body.light-theme .field label{
 color:#45514b;
}

body.light-theme .modal{
 background:#ffffff;
}

body.light-theme .close{
 color:var(--text);
 background:rgba(0,0,0,.035);
}

body.light-theme .sidebar{
 background:#ffffff;
}

body.light-theme .side-item{
 color:#4c5752;
}

body.light-theme th{
 background:#eef2ef;
}

body.light-theme td{
 color:#4c5752;
}

body.light-theme .map-screen{
 background:#f0f3f1;
}

body.light-theme .map-screen .map-overlay .filter{
 background:rgba(255,255,255,.92);
 color:var(--text);
}

body.light-theme .score-circle:after{
 background:#ffffff;
}

body.light-theme .attachment-btn{
 background:rgba(0,0,0,.035);
 color:var(--text);
}

/* RESPONSIVE */

.desktop-login{
 display:block;
}

@media(max-width:900px){
 .hero-grid{
  grid-template-columns:1fr;
 }

 .grid{
  grid-template-columns:repeat(2,1fr);
 }

 .stats{
  grid-template-columns:repeat(2,1fr);
 }

 .dashboard{
  grid-template-columns:1fr;
 }
}

@media(max-width:600px){
 .desktop-login{
  display:none;
 }

 .nav{
  padding:0 12px;
 }

 .logo-mark{
  width:39px;
  height:39px;
 }

 .logo-text strong{
  font-size:17px;
 }

 .hero{
  padding-top:30px;
 }

 .hero-main{
  border-radius:23px;
  padding:25px 20px;
 }

 .hero h1{
  font-size:46px;
 }

 .hero p{
  font-size:14px;
 }

 .grid{
  grid-template-columns:1fr;
 }

 .stats{
  gap:8px;
 }

 .stat{
  padding:15px;
 }

 .stat .value{
  font-size:26px;
 }

 .container{
  padding-left:12px;
  padding-right:12px;
 }

 .settings-colors{
  grid-template-columns:repeat(4,1fr);
 }

 .attachment-actions{
  grid-template-columns:1fr;
 }

 .map-screen .map-overlay{
  top:10px;
  right:10px;
  left:10px;
 }
}

</style>
</head>

<body>

<header>
 <div class="nav">

  <div class="logo" onclick="goHome()">
   <div class="logo-mark">ع</div>
   <div class="logo-text">
    <strong>عون</strong>
    <small>معاً.. لمجتمع أكثر أماناً</small>
   </div>
  </div>

  <div class="nav-actions">

   <button id="headerLogin"
    class="primary desktop-login"
    onclick="openAuth('login')">
    تسجيل الدخول
   </button>

   <button id="headerUser"
    class="icon-btn hidden"
    onclick="openProfile()">
    👤
   </button>

   <button class="icon-btn"
    onclick="toggleMenu()">
    ☰
   </button>

  </div>
 </div>
</header>

function formatFileSize(bytes){

 if(!bytes) return "0 B";

 const units=[
  "B","KB","MB","GB"
 ];

 const i=
  Math.min(
   Math.floor(
    Math.log(bytes)/
    Math.log(1024)
   ),
   units.length-1
  );

 return (
  bytes/
  Math.pow(1024,i)
 ).toFixed(i?1:0)
 +" "+
 units[i];

}

function useMyLocation(){

  showToast(
   "الموقع غير متاح في جهازك",
   "error"
  );

  return;

 }

 navigator.geolocation.getCurrentPosition(

  pos=>{

   selectedLat=
    pos.coords.latitude;

   selectedLng=
    pos.coords.longitude;

   if(reportMap){

    reportMap.setView(
     [
      selectedLat,
      selectedLng
     ],
     16
    );

    L.marker([
     selectedLat,
     selectedLng
    ]).addTo(reportMap);

   }

   document
    .getElementById(
     "locationStatus"
    )
    .textContent=
     "تم تحديد موقعك ✓";

  },

  ()=>{

   showToast(
    "لم نتمكن من الوصول إلى موقعك. يمكنك تحديده من الخريطة.",
    "error"
   );

  },

  {
   enableHighAccuracy:true,
   timeout:10000
  }

 );

}

function analyzeIssue(
 type,
 description
){

 const text=
  (description||"").toLowerCase();

 let score=35;

 const criticalWords=[
  "حادث",
  "حريق",
  "خطر",
  "خطير",
  "سقوط",
  "مكشوف",
  "كهرباء",
  "ماس",
  "حفرة كبيرة",
  "انهيار",
  "تسرب",
  "تصادم",
  "دخان",
  "طوارئ"
 ];

 const mediumWords=[
  "مكسور",
  "تالف",
  "لا يعمل",
  "مشكلة",
  "ازدحام",
  "ماء",
  "تسريب",
  "مزعج",
  "متضرر"
 ];

 criticalWords.forEach(w=>{
  if(text.includes(w))
   score+=10;
 });

 mediumWords.forEach(w=>{
  if(text.includes(w))
   score+=5;
 });

 const typeBonus={
  safety:18,
  road:14,
  light:10,
  accessibility:12,
  facility:8,
  environment:7,
  cleanliness:4,
  other:5
 };

 score+=
  typeBonus[type]||5;

 if(text.length>120)
  score+=5;

 if(!selectedLat)
  score-=5;

 score=
  Math.max(
   1,
   Math.min(
    100,
    score
   )
  );

 let label="منخفض";

 if(score>=80)
  label="حرج";
 else if(score>=60)
  label="مرتفع";
 else if(score>=40)
  label="متوسط";

 return{
  score,
  label,
  authority:getAuthority(type)
 };

}

function getAuthority(type){

 const map={
  road:"جهة الطرق والصيانة",
  light:"جهة الإنارة والصيانة",
  cleanliness:"جهة النظافة والبلدية",
  facility:"جهة المرافق والخدمات",
  safety:"جهة السلامة والطوارئ",
  accessibility:
   "جهة الخدمات المجتمعية وإتاحة الوصول",
  environment:"جهة البيئة",
  other:"الجهة المختصة"
 };

 return map[type]||map.other;

}

function findMatches(
 type,
 lat,
 lng
){

 return reports.filter(
  r=>{

   if(r.type!==type)
    return false;

   if(!r.latitude ||
      !r.longitude)
    return false;

   const distance=
    getDistanceKm(
     lat,
     lng,
     r.latitude,
     r.longitude
    );

   return distance<=0.3;

  }
 ).length;

}

function getDistanceKm(
 lat1,
 lon1,
 lat2,
 lon2
){

 const R=6371;

 const dLat=
  (lat2-lat1)*
  Math.PI/180;

 const dLon=
  (lon2-lon1)*
  Math.PI/180;

 const a=
  Math.sin(dLat/2)**2+
  Math.cos(
   lat1*Math.PI/180
  )*
  Math.cos(
   lat2*Math.PI/180
  )*
  Math.sin(
   dLon/2
  )**2;

 return R*
  2*
  Math.atan2(
   Math.sqrt(a),
   Math.sqrt(1-a)
  );

}

function initMainMap(){

 map=
  L.map("mainMap")
  .setView(
   [24.2075,55.7447],
   12
  );

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"© OpenStreetMap"
  }
 ).addTo(map);

 markersLayer=
  L.layerGroup().addTo(map);

 drawMarkers(reports);

}

function drawMarkers(list){

 if(!markersLayer)
  return;

 markersLayer.clearLayers();

 list.forEach(r=>{

  if(
   !r.latitude ||
   !r.longitude
  )
   return;

  let color=
   "#48c78e";

  if(r.score>=80)
   color="#ff5f61";

  else if(r.score>=50)
   color="#ff9f43";

  const icon=
   L.divIcon({

    className:"",

    html:`

     <div style="
      width:17px;
      height:17px;
      border-radius:50%;
      background:${color};
      border:3px solid white;
      box-shadow:
       0 3px 12px rgba(0,0,0,.4);
     "></div>

    `,

    iconSize:[17,17]

   });

  L.marker(
   [
    r.latitude,
    r.longitude
   ],
   {icon}
  )
  .bindPopup(`

   <div
    dir="rtl"
    style="min-width:190px">

    <strong>
     ${escapeHtml(
      r.title||
      "بلاغ"
     )}
    </strong>

    <br>

    <small>
     ${
      categories[r.type]||
      r.type||
      "أخرى"
     }
    </small>

    <br><br>

    <strong>
     الأولوية:
     ${r.score||0}/100
    </strong>

    <br>

    <small>
     ${escapeHtml(
      r.status||
      "تم الاستلام"
     )}
    </small>

   </div>

  `)
  .addTo(
   markersLayer
  );

 });

}

function filterMap(
 filter,
 button
){

 document
  .querySelectorAll(
   ".filter"
  )
  .forEach(
   x=>x.classList.remove(
    "active"
   )
  );

 button.classList.add(
  "active"
 );

 let list=reports;

 if(filter==="critical")
  list=
   reports.filter(
    r=>r.score>=80
   );

 if(filter==="medium")
  list=
   reports.filter(
    r=>r.score>=50 &&
    r.score<80
   );

 if(filter==="low")
  list=
   reports.filter(
    r=>r.score<50
   );

 if(
  ["road","light","safety"]
   .includes(filter)
 )
  list=
   reports.filter(
    r=>r.type===filter
   );

 drawMarkers(list);

}

 green:[

 ],

function loadTheme(){

 let settings={
  background:"black",
  color:"green"
 };

 try{

  settings=
   JSON.parse(
    localStorage.getItem(
     "awn_settings"
    )||
    JSON.stringify(settings)
   );

 }catch{}

 applyTheme(
  settings.background,
  settings.color
 );

}

function applyTheme(
 background="black",
 color="green"
){

 const pair=
  AWN_COLORS[color]||
  AWN_COLORS.green;

 document.documentElement
  .style
  .setProperty(
   "--gold",
   pair[0]
  );

 document.documentElement
  .style
  .setProperty(
   "--gold2",
   pair[1]
  );

 document.documentElement
  .style
  .setProperty(
   "--blue",
   pair[0]
  );

 document.body.classList.toggle(
  "light-theme",
  background==="white"
 );

 try{

  localStorage.setItem(
   "awn_settings",
   JSON.stringify({
    background,
    color
   })
  );

 }catch{}

}

function getThemeSettings(){

 try{

  return JSON.parse(
   localStorage.getItem(
    "awn_settings"
   )||
   '{"background":"black","color":"green"}'
  );

 }catch{

  return{
   background:"black",
   color:"green"
  };

 }

}

/* =====================================================
   MODALS / TOAST
===================================================== */

function showModal(html){

 document.getElementById(
  "modalRoot"
 ).innerHTML=`

 <div
  class="modal-back"
  onclick="modalOutside(event)">

  <div class="modal">

   ${html}

  </div>

 </div>

 `;

}

function modalOutside(e){

 if(
  e.target.classList.contains(
   "modal-back"
  )
 )
  closeModal();

}

function closeModal(){

 document.getElementById(
  "modalRoot"
 ).innerHTML="";

}

function showToast(
 message,
 type="success"
){

 const root=
  document.getElementById(
   "toastRoot"
  );

 root.innerHTML=`

 <div class="toast ${type}">

  <span style="font-size:19px">
   ${
    type==="success"
    ?"✓"
    :"!"
   }
  </span>

  <span>
   ${escapeHtml(message)}
  </span>

 </div>

 `;

 setTimeout(()=>{

  root.innerHTML="";

 },3500);

}

function requireLogin(
 callback
){

 if(!currentUser){

  openAuth("login");

  return;

 }

 callback();

}

/* =====================================================
   HELPERS
===================================================== */

function formatDate(
 date
){

 if(!date)
  return "—";

 try{

  return new Date(date)
   .toLocaleDateString(
    "ar-AE",
    {
     year:"numeric",
     month:"short",
     day:"numeric"
    }
   );

 }catch{

  return "—";

 }

}

function escapeHtml(
 value
){

 return String(
  value??""
 )
 .replace(
  /&/g,
  "&amp;"
 )
 .replace(
  /</g,
  "&lt;"
 )
 .replace(
  />/g,
  "&gt;"
 )
 .replace(
  /"/g,
  "&quot;"
 )
 .replace(
  /'/g,
  "&#039;"
 );

}
